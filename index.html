        </div>`).join('') : `<div class="p-3 text-slate-400 text-xs">${_L('Никого не найдено', 'Ешкім табылмады')}</div>`;
    } catch (e) { /* ignore */ }
  }, 250);
}

// Настройка: каким должностям нужна книжка и период (6 / 12 мес.)
let mbPos = { items: [], q: '' };
async function mbOpenPositions() {
  mbModal(`<div class="text-sm text-slate-400">${t('loading')}</div>`);
  try {
    const r = await api.req('/api/medbooks/positions');
    mbPos = { items: r.items || [], q: '' };
    mbRenderPositions();
  } catch (err) { mbModal(`<p class="text-sm text-red-600">${esc(err.message)}</p>`); }
}
function mbPosGroups() {
  const q = mbPos.q.trim().toLowerCase();
  const groups = new Map();
  mbPos.items.forEach((it, i) => {
    if (q && !`${it.position} ${it.department} ${it.object}`.toLowerCase().includes(q)) return;
    const k = `${it.object}\u0001${it.department}`;
    if (!groups.has(k)) groups.set(k, { object: it.object, department: it.department, idx: [] });
    groups.get(k).idx.push(i);
  });
  return [...groups.values()];
}
function mbRenderPositions() {
  const sel = (i, v) => `<select onchange="mbPosSet(${i}, this.value)" class="border rounded px-1.5 py-1 text-xs ${v ? 'bg-emerald-50 border-emerald-300 font-semibold' : ''}">
      <option value="" ${!v ? 'selected' : ''}>${_L('не нужна', 'қажет емес')}</option>
      <option value="6" ${v === 6 ? 'selected' : ''}>${_L('6 мес.', '6 ай')}</option>
      <option value="12" ${v === 12 ? 'selected' : ''}>${_L('12 мес.', '12 ай')}</option></select>`;
  const groups = mbPosGroups();
  const count = mbPos.items.filter(x => x.period_months).length;
  const body = groups.map((g, gi) => `
    <div class="border rounded-lg mb-2">
      <div class="flex items-center justify-between gap-2 bg-slate-50 px-3 py-1.5 rounded-t-lg">
        <div class="text-xs font-bold text-slate-700">${esc(g.object)} / ${esc(g.department)}</div>
        <select onchange="mbPosSetGroup(${gi}, this.value); this.value='-'" class="border rounded px-1.5 py-1 text-[11px] bg-white">
          <option value="-">${_L('Для всего отдела…', 'Бүкіл бөлімге…')}</option>
          <option value="">${_L('не нужна', 'қажет емес')}</option><option value="6">${_L('6 мес.', '6 ай')}</option><option value="12">${_L('12 мес.', '12 ай')}</option>
        </select>
      </div>
      ${g.idx.map(i => `<div class="flex items-center justify-between gap-2 px-3 py-1.5 border-t border-slate-100"><span class="text-xs text-slate-700">${esc(posLabel(mbPos.items[i].position) || mbPos.items[i].position)}</span>${sel(i, mbPos.items[i].period_months)}</div>`).join('')}
    </div>`).join('');
  mbModal(`
    <div class="flex justify-between items-start mb-1">
      <h3 class="text-base font-bold text-slate-900">⚙ ${_L('Должности с мед. книжкой', 'Медициналық кітапшасы бар лауазымдар')}</h3>
      <button onclick="mbCloseModal()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
    </div>
    <p class="text-xs text-slate-500 mb-3">${_L('Отметьте должности, у которых должна быть санкнижка, и выберите напоминание: полугодичное (6 мес.) или годичное (12 мес.). Сотрудникам с другими должностями книжка не показывается.', 'Санкнижка қажет лауазымдарды белгілеп, еске салуды таңдаңыз: жарты жылдық (6 ай) немесе жылдық (12 ай). Басқа лауазымдағы қызметкерлерге кітапша көрсетілмейді.')}</p>
    <input id="mbPosQ" value="${esc(mbPos.q)}" oninput="mbPos.q=this.value; mbRenderPositionsKeep()" placeholder="${esc(_L('Поиск по должности или отделу', 'Лауазым немесе бөлім бойынша іздеу'))}" class="w-full border p-2 rounded text-sm mb-3">
    <div class="max-h-[50vh] overflow-y-auto pr-1">${body || `<div class="text-sm text-slate-400 p-3">${_L('В «Настройках» нет структуры «Объект → Отдел → Должность» или ничего не найдено.', '«Баптаулар» бөлімінде «Объект → Бөлім → Лауазым» құрылымы жоқ немесе ештеңе табылмады.')}</div>`}</div>
    <p id="mbFormMsg" class="text-xs text-red-600 mt-2"></p>
    <div class="flex items-center justify-between gap-2 pt-3 mt-3 border-t">
      <span class="text-xs text-slate-500">${_L('Выбрано должностей', 'Таңдалған лауазымдар')}: <b>${count}</b></span>
      <div class="flex gap-2">
        <button type="button" onclick="mbCloseModal()" class="px-4 py-2 border rounded-lg text-sm">${_L('Отмена', 'Бас тарту')}</button>
        <button type="button" onclick="mbSavePositions()" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg text-sm">${_L('Сохранить', 'Сақтау')}</button>
      </div>
    </div>`);
}
function mbRenderPositionsKeep() {
  mbRenderPositions();
  const el = document.getElementById('mbPosQ');
  if (el) { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) {} }
}
function mbPosSet(i, v) { mbPos.items[i].period_months = v ? Number(v) : null; mbRenderPositionsKeepScroll(); }
function mbPosSetGroup(gi, v) {
  if (v === '-') return;
  const g = mbPosGroups()[gi]; if (!g) return;
  g.idx.forEach(i => { mbPos.items[i].period_months = v ? Number(v) : null; });
  mbRenderPositionsKeepScroll();
}
function mbRenderPositionsKeepScroll() {
  const box = document.querySelector('#mbModal .max-h-\\[50vh\\]');
  const top = box ? box.scrollTop : 0;
  mbRenderPositions();
  const nb = document.querySelector('#mbModal .max-h-\\[50vh\\]');
  if (nb) nb.scrollTop = top;
}
async function mbSavePositions() {
  try {
    const items = mbPos.items.filter(x => x.period_months).map(x => ({ object: x.object, department: x.department, position: x.position, period_months: x.period_months }));
    await api.req('/api/medbooks/positions', { method: 'PUT', body: { items } });
    mbAfterChange();
  } catch (err) { const el = document.getElementById('mbFormMsg'); if (el) el.textContent = err.message; }
}

// ---- блок в карточке сотрудника и в кабинете сотрудника ----
// Показывается ТОЛЬКО если книжка нужна (по должности или добавлена вручную); иначе пустая строка.
function mbCardHtml(e, canEdit, userId) {
  if (!e || !e.applicable) return '';
  const tone = e.status === 'overdue' ? 'border-red-200 bg-red-50/40' : e.status === 'soon' ? 'border-amber-200 bg-amber-50/40' : 'border-slate-200 bg-white';
  return `
    <div class="p-4 rounded-xl border shadow-sm mb-6 ${tone}">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h3 class="text-sm font-bold text-slate-900">🩺 ${_L('Личная медицинская книжка', 'Жеке медициналық кітапша')} ${mbBadge(e.status)}</h3>
          ${e.start_date
            ? `<p class="text-xs text-slate-600 mt-1.5">${_L('Начало', 'Басталуы')}: <b>${fmtDate(e.start_date)}</b> · ${_L('Действует до', 'Дейін жарамды')}: <b>${fmtDate(e.expires)}</b> · ${esc(mbLeftText(e))}</p>`
            : `<p class="text-xs text-slate-600 mt-1.5">${_L('Дата начала книжки ещё не внесена.', 'Кітапшаның басталу күні әлі енгізілмеген.')}</p>`}
          <p class="text-[11px] text-slate-400 mt-1">${_L('Напоминание', 'Еске салу')}: ${esc(mbPeriodText(e.period_months))}${e.manual ? ' · ' + _L('добавлена вручную', 'қолмен қосылған') : ''}</p>
        </div>
        ${canEdit ? `<div class="flex gap-2">
          <button type="button" onclick="mbOpenForm(${userId})" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white hover:bg-blue-700">${e.start_date ? _L('Обновить книжку', 'Кітапшаны жаңарту') : _L('Внести дату', 'Күнін енгізу')}</button>
          ${e.manual || e.start_date ? `<button type="button" onclick="mbRemove(${userId}, ${e.manual ? 'true' : 'false'})" class="px-3 py-1.5 rounded-lg text-xs font-semibold border hover:bg-slate-50">${e.manual ? _L('Убрать', 'Алып тастау') : _L('Сбросить дату', 'Күнді тастау')}</button>` : ''}
        </div>` : ''}
      </div>
    </div>`;
}
async function loadMyMedbook() {
  const box = document.getElementById('myMedbook');
  if (!box) return;
  try { const e = await api.req('/api/medbooks/me'); box.innerHTML = e.applicable ? mbCardHtml(e, false, 0).replace('mb-6', 'mb-0') : ''; }
  catch (e) { /* вспомогательный блок — ошибку не показываем */ }
}

// --- Уведомления (веб-пуши) (service worker: /sw.js, сервер: /api/push) ---
const PWA = { cfg: null };
function pwaStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
const PWA_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function pwaPushSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(e => console.warn('service worker:', e)); });
}

function pwaKeyToBytes(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
async function pwaGetSub() {
  if (!pwaPushSupported()) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}
async function pwaSendSub(sub) {
  await api.req('/api/push/subscribe', { method: 'POST', body: { subscription: sub.toJSON(), lang: CURRENT_LANG } });
}

async function pwaEnablePush() {
  if (!pwaPushSupported()) throw new Error(_L('Этот браузер не поддерживает уведомления', 'Бұл браузер хабарландыруды қолдамайды'));
  // Разрешение просим первым и сразу в обработчике нажатия — iPhone иначе его не покажет
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error(_L('Разрешение на уведомления не выдано', 'Хабарландыруға рұқсат берілмеді'));
  const cfg = await fetch('/api/push/public-key').then(r => r.json());
  PWA.cfg = cfg;
  if (!cfg.enabled) throw new Error(_L('Уведомления ещё не настроены на сервере', 'Хабарландырулар серверде әлі бапталмаған'));
  const want = pwaKeyToBytes(cfg.key);
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (sub && sub.options && sub.options.applicationServerKey) {
    const have = new Uint8Array(sub.options.applicationServerKey);
    if (have.length !== want.length || have.some((v, i) => v !== want[i])) { await sub.unsubscribe(); sub = null; }   // ключи сервера сменились
  }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: want });
  await pwaSendSub(sub);
}
async function pwaDisablePush() {
  const sub = await pwaGetSub();
  if (!sub) return;
  const endpoint = sub.endpoint;
  await sub.unsubscribe();
  try { await api.req('/api/push/unsubscribe', { method: 'POST', body: { endpoint } }); } catch (e) { /* подписка и так удалена на устройстве */ }
}

// Вошли в систему (или открыли приложение уже вошедшим): привязываем подписку этого устройства к текущему сотруднику.
function pwaAfterLogin() {
  if (!state.token || !pwaPushSupported() || Notification.permission !== 'granted') return;
  pwaGetSub().then(sub => sub && pwaSendSub(sub)).catch(() => {});
}
// Вышли: этому устройству больше нельзя слать уведомления прежнего сотрудника (телефон могут передать другому).
function pwaOnLogout(token) {
  if (!token || !pwaPushSupported() || Notification.permission !== 'granted') return;
  pwaGetSub().then(sub => sub && fetch('/api/push/unsubscribe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ endpoint: sub.endpoint })
  })).catch(() => {});
}

function pwaShowMsg(text, ok) {
  const el = document.getElementById('pwaMsg');
  if (!el) return;
  el.textContent = text || '';
  el.className = 'text-xs mt-2 ' + (ok ? 'text-emerald-700' : 'text-red-600');
}
async function pwaAction(fn, okText) {
  try { await fn(); await pwaRefreshModal(); if (okText) pwaShowMsg(okText, true); }
  catch (e) { await pwaRefreshModal(); pwaShowMsg(e && e.message ? e.message : String(e), false); }
}
function pwaEnableClick() { pwaAction(pwaEnablePush); }
function pwaDisableClick() { pwaAction(pwaDisablePush); }
function pwaTestClick() {
  pwaAction(async () => {
    const r = await api.req('/api/push/test', { method: 'POST' });
    if (!r || !r.sent) throw new Error(_L('Не удалось отправить: отключите и включите уведомления заново', 'Жіберілмеді: хабарландыруларды өшіріп, қайта қосыңыз'));
  }, _L('Отправлено — уведомление придёт через пару секунд', 'Жіберілді — хабарландыру бірнеше секундтан кейін келеді'));
}

function pwaCloseModal() { const m = document.getElementById('pwaModal'); if (m) m.remove(); }
function openAppSettingsModal() {
  let m = document.getElementById('pwaModal');
  if (!m) {
    m = document.createElement('div');
    m.id = 'pwaModal';
    m.className = 'fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-[110]';
    m.onclick = (e) => { if (e.target === m) pwaCloseModal(); };
    document.body.appendChild(m);
  }
  pwaRefreshModal();
  if (!PWA.cfg) fetch('/api/push/public-key').then(r => r.json()).then(c => { PWA.cfg = c; pwaRefreshModal(); }).catch(() => {});
}

async function pwaRefreshModal() {
  const m = document.getElementById('pwaModal');
  if (!m) return;
  const box = 'rounded-xl border border-slate-200 p-4';
  const btn = 'w-full px-4 py-2.5 text-sm font-semibold rounded-lg ';

  // --- уведомления ---
  let notif;
  let sub = null;
  try { sub = await pwaGetSub(); } catch (e) { /* ignore */ }
  if (!state.token) {
    notif = `<p class="text-sm text-slate-600">${_L('Войдите в систему, чтобы включить уведомления.', 'Хабарландыруды қосу үшін жүйеге кіріңіз.')}</p>`;
  } else if (!pwaPushSupported()) {
    notif = PWA_IOS && !pwaStandalone()
      ? `<p class="text-sm text-amber-700">${_L('На iPhone и iPad уведомления работают только если сайт добавлен на экран «Домой» (iOS 16.4 и новее) и открыт оттуда.', 'iPhone және iPad-та хабарландырулар сайт «Басты экранға» қосылып, содан ашылғанда ғана жұмыс істейді (iOS 16.4 және одан жаңа).')}</p>`
      : `<p class="text-sm text-slate-600">${_L('Этот браузер не поддерживает уведомления.', 'Бұл браузер хабарландыруды қолдамайды.')}</p>`;
  } else if (Notification.permission === 'denied') {
    notif = `<p class="text-sm text-red-600">${_L('Уведомления заблокированы. Разрешите их для этого сайта в настройках браузера или телефона.', 'Хабарландырулар бұғатталған. Оларды браузер немесе телефон баптауларында осы сайтқа рұқсат етіңіз.')}</p>`;
  } else if (PWA.cfg && !PWA.cfg.enabled) {
    notif = `<p class="text-sm text-slate-600">${_L('Уведомления ещё не настроены на сервере (обратитесь к администратору).', 'Хабарландырулар серверде әлі бапталмаған (әкімшіге хабарласыңыз).')}</p>`;
  } else if (sub && Notification.permission === 'granted') {
    notif = `<p class="text-sm text-emerald-700 mb-3">🔔 ${_L('Уведомления включены на этом устройстве.', 'Хабарландырулар осы құрылғыда қосулы.')}</p>
      <div class="flex gap-2"><button onclick="pwaTestClick()" class="${btn}bg-slate-100 hover:bg-slate-200 text-slate-800">${_L('Тест', 'Сынақ')}</button>
      <button onclick="pwaDisableClick()" class="${btn}bg-slate-100 hover:bg-slate-200 text-slate-800">${_L('Отключить', 'Өшіру')}</button></div>`;
  } else {
    notif = `<p class="text-sm text-slate-600 mb-3">${_L('Получайте сообщения о новых курсах, пересдачах, сроках обучения и мед. книжки.', 'Жаңа курстар, қайта тапсыру, оқу және медициналық кітапша мерзімдері туралы хабарлама алыңыз.')}</p>
      <button onclick="pwaEnableClick()" class="${btn}bg-blue-600 hover:bg-blue-700 text-white">🔔 ${_L('Включить уведомления', 'Хабарландыруды қосу')}</button>`;
  }

  m.innerHTML = `
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5">
      <div class="flex justify-between items-start mb-4">
        <h3 class="text-base font-bold text-slate-900">${_L('Уведомления', 'Хабарландырулар')}</h3>
        <button onclick="pwaCloseModal()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
      </div>
      <div class="space-y-3">
        <div class="${box}">${notif}</div>
      </div>
      <p id="pwaMsg" class="text-xs mt-2"></p>
    </div>`;
}

pwaAfterLogin();
</script>
</body>
</html>
