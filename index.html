              <button type="button" onclick="document.getElementById('assignModal').classList.add('hidden')" class="px-4 py-2 border rounded-lg text-sm">Отмена</button>
              <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg text-sm">Назначить</button>
            </div>
          </form>
        </div>
      </div>
  `;
}

let asAllEmployees = [];
let asSelectedIds = new Set();
let asShowSelectedOnly = false;   // в списке окна назначения показывать только отмеченных
// Если назначение курса открыто с карточки сотрудника (п.1 запроса), сюда
// попадает id этого сотрудника — выбор в списке ниже блокируется на нём одном.
let asLockedUserId = null;
let asCourses = [];          // курсы, загруженные в модалку (нужны, чтобы знать, какой из них внешний)
let asExtMode = false;       // модалка сейчас в режиме «внешний курс»
let asOwnProtNum = '';       // наш предложенный номер протокола — возвращаем при переключении обратно

// Окно назначения встроено не на каждую вкладку: если его нет в разметке — добавляем на лету
// (раньше на вкладке «Сотрудники» кнопка «Назначить выбранным» падала с TypeError и молчала).
function ensureAssignModal() {
  if (document.getElementById('assignModal')) return;
  const holder = document.createElement('div');
  holder.innerHTML = assignModalHtml();
  while (holder.firstChild) document.body.appendChild(holder.firstChild);
}

let assignModalOpening = false;
async function openAssignModal(presetUserId, presetUserIds, presetCourseId) {
  if (assignModalOpening) return;           // защита от повторных нажатий, пока грузятся списки
  assignModalOpening = true;
  try {
    ensureAssignModal();
    await _openAssignModalImpl(presetUserId, presetUserIds, presetCourseId);
  } catch (e) {
    console.error('openAssignModal:', e);
    alert('Не удалось открыть окно назначения: ' + (e && e.message ? e.message : e));
  } finally {
    assignModalOpening = false;
  }
}

async function _openAssignModalImpl(presetUserId, presetUserIds, presetCourseId) {
  asLockedUserId = presetUserId ? Number(presetUserId) : null;
  // getUsers() без параметра status по умолчанию отдаёт только действующих сотрудников —
  // уволенные и находящиеся в декрете (вкладка «Архив») в список для назначения теста не попадают.
  const [allUsers, courses] = await Promise.all([api.getUsers(), api.getCourses()]);
  asAllEmployees = allUsers.filter(u => u.role === 'employee');
  asCourses = courses;
  asExtMode = false;
  if (asLockedUserId) {
    asSelectedIds = new Set([asLockedUserId]);
  } else if (presetUserIds && presetUserIds.length) {
    asSelectedIds = new Set(presetUserIds.map(Number));
  } else {
    asSelectedIds = new Set();
  }

  const cSel = document.getElementById('asCourseId');
  // Курсы в выпадающем списке сгруппированы по категориям — так проще найти нужный, когда курсов много
  const courseGroups = groupCoursesByCategory(courses);
  const flat = courseGroups.length === 1 && !courseGroups[0].key;
  const optHtml = c => `<option value="${c.id}">${esc(c.title_ru)}</option>`;
  const sortByRu = (a, b) => String(a.title_ru).localeCompare(String(b.title_ru), 'ru');
  cSel.innerHTML = flat
    ? courses.map(optHtml).join('')
    : courseGroups.map(g => `<optgroup label="${esc(g.label)}">${g.items.slice().sort(sortByRu).map(optHtml).join('')}</optgroup>`).join('');
  if (presetCourseId) cSel.value = presetCourseId;

  // Фильтры по объекту/отделу для списка сотрудников
  const objects = [...new Set(asAllEmployees.map(u => u.object).filter(Boolean))].sort();
  const departments = [...new Set(asAllEmployees.map(u => u.department).filter(Boolean))].sort();
  document.getElementById('asFilterObject').innerHTML = `<option value="">${t('all_objects')}</option>` + objects.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
  document.getElementById('asFilterDept').innerHTML = `<option value="">${t('all_departments')}</option>` + departments.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
  document.getElementById('asFilterQ').value = '';

  // Если открыто с карточки сотрудника — скрываем список выбора сотрудников
  // и жёстко фиксируем назначение на одного человека (п.1 запроса).
  const titleEl = document.getElementById('assignModalTitle');
  const lockedInfo = document.getElementById('asLockedEmployeeInfo');
  const selBlock = document.getElementById('asEmployeeSelectionBlock');
  if (asLockedUserId) {
    const emp = asAllEmployees.find(u => String(u.id) === String(asLockedUserId));
    if (titleEl) titleEl.textContent = 'Назначить курс сотруднику';
    if (lockedInfo) {
      lockedInfo.classList.remove('hidden');
      lockedInfo.querySelector('div').textContent = emp ? `${emp.last_name} ${emp.first_name}` : '';
    }
    if (selBlock) selBlock.classList.add('hidden');
  } else {
    if (titleEl) titleEl.textContent = 'Назначить тестирование';
    if (lockedInfo) lockedInfo.classList.add('hidden');
    if (selBlock) selBlock.classList.remove('hidden');
  }

  document.getElementById('asHistorical').checked = false;
  document.getElementById('asHistoricalFields').classList.add('hidden');
  document.getElementById('asTestDate').value = '';
  document.getElementById('asTestDate').required = false;
  document.getElementById('asNextTestDate').value = '';
  asNextManual = false;
  document.getElementById('asScorePercent').value = '';

  document.getElementById('asProtDate').value = toLocalDateStr(new Date());
  try {
    const nums = await api.getLastNumbers();
    document.getElementById('asProtNum').value = nums.next_protocol_number || '1';
    const certHint = document.getElementById('asNextCertHint');
    if (certHint) certHint.textContent = nums.next_certificate_number ? `${t('hint_next_cert')}: ${nums.next_certificate_number}` : '';
  } catch (e) {
    document.getElementById('asProtNum').value = '1';
  }

  // Если сегодня действует открытый протокол (вкладка "Протоколы"), предупреждаем
  // администратора: итоговый номер будет присвоен автоматически при сдаче теста
  // сотрудником в период действия этого протокола, независимо от того, что введено ниже.
  const activeHint = document.getElementById('asActiveProtocolHint');
  if (activeHint) {
    activeHint.textContent = '';
    try {
      const active = await api.getActiveProtocols();
      if (active.length) {
        const p = active[0];
        activeHint.textContent = `Сейчас открыт протокол № ${p.protocol_number} (до ${fmtDate(p.close_date)}) — если сотрудник сдаст тест сегодня, ему автоматически будет присвоен именно этот номер.`;
      }
    } catch (e) {}
  }

  asShowSelectedOnly = false;
  applyAsExternalMode();
  renderAssignEmployeeList();
  document.getElementById('assignModal').classList.remove('hidden');
}

// ---------- Срок действия курса: автоподстановка «даты след. прохождения» ----------
// Прибавляем месяцы КАЛЕНДАРНО и считаем «с конца месяца»: 31.01 + 1 мес = 28/29.02, а не 03.03.
// Arithmetic ведём по числам (год, месяц, день), без Date.setMonth на «грязной» дате.
function addMonthsISO(iso, months) {
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  const n = Number(months);
  if (!m || !Number.isFinite(n)) return '';
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  if (y < 1990 || y > 2100 || mo < 1 || mo > 12 || d < 1 || d > 31) return '';
  const total = y * 12 + (mo - 1) + Math.trunc(n);
  const ny = Math.floor(total / 12), nm = total % 12;                 // nm: 0..11
  const last = new Date(Date.UTC(ny, nm + 1, 0)).getUTCDate();         // последний день нужного месяца
  const nd = Math.min(d, last);
  return `${String(ny).padStart(4, '0')}-${String(nm + 1).padStart(2, '0')}-${String(nd).padStart(2, '0')}`;
}
// {noExpiry, months} — months = null, если срок у курса не задан
function courseTermInfo(course) {
  if (!course) return { noExpiry: false, months: null };
  const v = Number(course.validity_months);
  return { noExpiry: !!course.no_expiry, months: Number.isFinite(v) && v > 0 ? Math.trunc(v) : null };
}
function asNextDateFromTerm(testDate, course) {
  const term = courseTermInfo(course);
  return !term.noExpiry && term.months !== null && testDate ? addMonthsISO(testDate, term.months) : '';
}
function monthsWord(n) { return _L(`${n} мес.`, `${n} ай`); }

let asNextManual = false;   // пользователь сам поправил «дату след. прохождения» — при смене даты прохождения не затираем

function asCurrentCourse() {
  const cid = document.getElementById('asCourseId').value;
  return (asCourses || []).find(c => String(c.id) === String(cid)) || null;
}
function onAsNextInput() {
  const el = document.getElementById('asNextTestDate');
  // Очистили поле — снова считаем автоматически; ввели своё значение — больше не затираем
  asNextManual = !!el.value;
  asUpdateNextDate();
}
// Пересчёт поля «след. прохождения» и подсказок под ним. Вызывается при смене курса, даты прохождения и режима «пройденное ранее».
function asUpdateNextDate() {
  const $ = id => document.getElementById(id);
  const course = asCurrentCourse();
  const term = courseTermInfo(course);
  const nextEl = $('asNextTestDate'), hint = $('asNextHint'), fields = $('asNextFields');
  if (!nextEl || !hint || !fields) return;

  if (term.noExpiry) {                       // бессрочный курс: следующего прохождения нет
    fields.classList.add('hidden');
    nextEl.value = '';
    hint.textContent = _L('Бессрочно — даты следующего прохождения нет.', 'Мерзімсіз — келесі өту күні жоқ.');
  } else {
    fields.classList.remove('hidden');
    if (term.months === null) {              // срок не задан — поле остаётся пустым и ручным
      if (!asNextManual) nextEl.value = '';
      hint.textContent = '';
    } else {
      const testDate = $('asTestDate').value;
      const auto = testDate ? addMonthsISO(testDate, term.months) : '';
      if (!asNextManual) nextEl.value = auto;
      hint.textContent = asNextManual
        ? _L(`Срок курса: ${term.months} мес. — дата изменена вручную`, `Курс мерзімі: ${term.months} ай — күн қолмен өзгертілді`)
        : (auto
          ? _L(`Срок курса: ${term.months} мес. — дата рассчитана автоматически`, `Курс мерзімі: ${term.months} ай — күн автоматты түрде есептелді`)
          : _L(`Срок курса: ${term.months} мес. — дата рассчитается после ввода даты прохождения`, `Курс мерзімі: ${term.months} ай — өту күнін енгізгеннен кейін есептеледі`));
    }
  }

  // Обычное назначение теста нашего курса (без «пройденного ранее»): поля дат не нужны, но показываем срок действия после сдачи
  const note = $('asValidityNote');
  if (note) {
    const ext = !!(course && course.is_external);
    const hist = $('asHistorical').checked;
    const show = !!course && !ext && !hist && (term.noExpiry || term.months !== null);
    note.classList.toggle('hidden', !show);
    note.textContent = !show ? '' : term.noExpiry
      ? _L('Результат будет действовать бессрочно.', 'Нәтиже мерзімсіз жарамды болады.')
      : _L(`Будет действовать ${term.months} мес. с даты сдачи`, `Тапсырған күннен бастап ${term.months} ай жарамды болады`);
  }
}
// Значение «след. прохождения» для отправки: из поля, а если поле пустое, но срок задан — расчётное (чтобы БД совпадала с формой)
function asNextDateForSubmit(testDate) {
  const term = courseTermInfo(asCurrentCourse());
  if (term.noExpiry) return undefined;
  const v = document.getElementById('asNextTestDate').value;
  if (v) return v;
  return term.months !== null && testDate ? (addMonthsISO(testDate, term.months) || undefined) : undefined;
}

// Внешний курс: вместо нашего протокола — номер протокола внешней организации и дата прохождения.
// Всегда «уже пройденное» обучение (теста нет), поэтому переключатель «Внести пройденное» скрыт и включён.
function applyAsExternalMode() {
  const cid = document.getElementById('asCourseId').value;
  const course = (asCourses || []).find(c => String(c.id) === String(cid));
  const ext = !!(course && course.is_external);
  const $ = id => document.getElementById(id);
  const changed = ext !== asExtMode;
  // Разметку приводим к режиму каждый раз (после прошлого открытия модалки в ней мог остаться другой режим),
  // а значения полей трогаем только при реальном переключении курса.
  const noProt = ext && course.course_kind === 'no_protocol';
  $('asExternalInfo').classList.toggle('hidden', !ext);
  if (ext) {
    $('asExternalInfoText').innerHTML = noProt
      ? '<b>Курс без протокола.</b> Протокол не нужен. Укажите только дату прохождения и (по желанию) срок — удостоверение не выдаётся; на странице по QR-коду сотрудник будет отображаться как «пройден», обучение попадёт в статистику.'
      : '<b>Внешний курс.</b> Обучение проводила не наша компания: теста, нашего протокола и удостоверения нет. Укажите дату прохождения, (по желанию) номер протокола внешней организации и срок — на странице по QR-коду сотрудник будет отображаться как «пройден», обучение попадёт в статистику.';
  }
  $('asProtNumWrap').classList.toggle('hidden', noProt);
  $('asProtNum').required = !ext;
  $('asProtDateWrap').classList.toggle('hidden', ext);
  $('asProtDate').required = !ext;
  $('asProtAutoNote').classList.toggle('hidden', ext);
  $('asActiveProtocolHint').classList.toggle('hidden', ext);
  $('asNextCertHint').classList.toggle('hidden', ext);
  $('asHistoricalToggleLabel').classList.toggle('hidden', ext);
  $('asProtNumLabel').textContent = ext ? 'Номер протокола (внешний, необязательно)' : 'Номер протокола';
  $('asScoreLabel').textContent = ext ? 'Результат, % (необязательно)' : 'Результат, % (по умолчанию 100)';
  $('asHistNote').textContent = ext
    ? 'Сертификат и удостоверение не выдаются. Если дату след. прохождения не указать, она рассчитается по сроку действия курса (у бессрочных курсов даты нет).'
    : 'Номер сертификата будет присвоен автоматически. Если дату след. прохождения не указать, она рассчитается по сроку действия курса (у бессрочных курсов даты нет).';
  $('asProtNum').placeholder = ext ? 'Номер из документа внешней организации' : '';
  if (changed) {
    if (ext) {
      asOwnProtNum = $('asProtNum').value;
      $('asProtNum').value = '';
      $('asHistorical').checked = true;
    } else {
      $('asProtNum').value = asOwnProtNum || $('asProtNum').value;
      $('asHistorical').checked = false;
    }
  }
  onAsHistoricalToggle();
  asExtMode = ext;
  // Смена курса (или открытие модалки) — автозначение считаем заново, ручная правка предыдущего курса не переносится
  asNextManual = false;
  asUpdateNextDate();
}

function renderAssignEmployeeList() {
  const q = (document.getElementById('asFilterQ').value || '').toLowerCase();
  const obj = document.getElementById('asFilterObject').value;
  const dept = document.getElementById('asFilterDept').value;

  const filtered = asAllEmployees.filter(u => {
    if (asShowSelectedOnly && !asSelectedIds.has(u.id)) return false;
    if (asShowSelectedOnly) return true;   // «Показать выбранных» игнорирует поиск и фильтры — виден весь выбор
    if (obj && u.object !== obj) return false;
    if (dept && u.department !== dept) return false;
    if (q) {
      const hay = `${u.last_name} ${u.first_name} ${u.login}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const div = document.getElementById('asEmployeeList');
  if (!filtered.length) {
    div.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">${asShowSelectedOnly ? 'Никто не выбран' : t('no_data')}</div>`;
  } else {
    div.innerHTML = filtered.map(u => `
      <label class="flex items-center gap-2 px-3 py-2 text-sm hover:bg-slate-50 cursor-pointer">
        <input type="checkbox" value="${u.id}" ${asSelectedIds.has(u.id) ? 'checked' : ''} onchange="toggleAsEmployee(${u.id}, this.checked)" class="rounded text-blue-600">

        <span class="text-xs text-slate-400">${esc(u.object || '—')}</span>

  updateAsSelectedCount();
}

function toggleAsEmployee(id, checked) {
  if (checked) asSelectedIds.add(id); else asSelectedIds.delete(id);
  if (asShowSelectedOnly && !checked) {
    if (!asSelectedIds.size) asShowSelectedOnly = false;
    renderAssignEmployeeList();
    return;
  }
  updateAsSelectedCount();
}

function toggleAsShowSelected() {
  if (!asShowSelectedOnly && !asSelectedIds.size) { alert('Пока никто не выбран.'); return; }
  asShowSelectedOnly = !asShowSelectedOnly;
  renderAssignEmployeeList();
}

function asSelectAll(select) {
  const q = (document.getElementById('asFilterQ').value || '').toLowerCase();
  const obj = document.getElementById('asFilterObject').value;
  const dept = document.getElementById('asFilterDept').value;
  const filtered = asAllEmployees.filter(u => {
    if (asShowSelectedOnly && !asSelectedIds.has(u.id)) return false;
    if (asShowSelectedOnly) return true;   // «Показать выбранных» игнорирует поиск и фильтры — виден весь выбор
    if (obj && u.object !== obj) return false;
    if (dept && u.department !== dept) return false;
    if (q) {
      const hay = `${u.last_name} ${u.first_name} ${u.login}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  filtered.forEach(u => select ? asSelectedIds.add(u.id) : asSelectedIds.delete(u.id));
  renderAssignEmployeeList();
}

function updateAsSelectedCount() {
  const span = document.getElementById('asSelectedCount');
  if (span) span.textContent = asSelectedIds.size ? `(${asSelectedIds.size})` : '';
  const showBtn = document.getElementById('asShowSelectedBtn');
  if (showBtn) showBtn.textContent = asShowSelectedOnly ? 'Показать всех' : (asSelectedIds.size ? `Показать выбранных (${asSelectedIds.size})` : 'Показать выбранных');
}

function onAsHistoricalToggle() {
  const on = document.getElementById('asHistorical').checked;
  document.getElementById('asHistoricalFields').classList.toggle('hidden', !on);
  document.getElementById('asTestDate').required = on;
  if (typeof asUpdateNextDate === 'function') asUpdateNextDate();
}

async function submitAssignForm(e) {
  e.preventDefault();
  if (asSelectedIds.size === 0) {
    alert('Выберите хотя бы одного сотрудника.');
    return;
  }
  const historical = document.getElementById('asHistorical').checked;
  if (historical && !document.getElementById('asTestDate').value) {
    alert('Укажите дату прохождения для исторической записи.');
    return;
  }
  const data = {
    user_ids: [...asSelectedIds],
    course_id: document.getElementById('asCourseId').value,
    protocol_number: document.getElementById('asProtNum').value.trim(),
    protocol_date: asExtMode ? document.getElementById('asTestDate').value : document.getElementById('asProtDate').value
  };
  if (historical) {
    data.historical = true;
    data.test_date = document.getElementById('asTestDate').value;
    // Бессрочный курс — дату следующего прохождения не шлём; иначе — то, что видно в форме (или расчётное при пустом поле)
    data.next_test_date = asNextDateForSubmit(data.test_date);
    data.score_percent = document.getElementById('asScorePercent').value || undefined;
  }
  const res = await api.createAssignmentsBulk(data);
  document.getElementById('assignModal').classList.add('hidden');
  if (res.skipped) {
    alert(`Назначено: ${res.created}. Пропущено (некорректный id): ${res.skipped}.`);
  }
  // Назначали с карточки сотрудника — обновляем именно её, а не список всех назначений.
  // Назначали с главной (виджет «Скоро истекает») — обновляем весь дашборд, чтобы
  // запись пропала из списка просроченных и обновились счётчики.
  if (asLockedUserId) {
    if (document.getElementById('profileContent')) {
      loadUserProfile(asLockedUserId);
    } else if (document.getElementById('expiringList')) {
      loadTabContent();
    }
  } else if (document.getElementById('assignTable')) {
    loadAssignmentsList();
  } else if (document.getElementById('coursesList')) {
    // Назначали "всем непрошедшим" со страницы курсов — обновляем счётчики на карточках
    loadCoursesList();
  }
}

async function allowRetake(id) {
  await api.allowRetake(id);
  loadAssignmentsList();
}

async function delAssign(id, profileUserId) {
  if (!confirm('Удалить запись?')) return;
  await api.deleteAssignment(id);
  // Удаляли из карточки сотрудника («История обучения») — обновляем именно её,
  // а не список всех назначений (которого на этой странице может и не быть).
  if (profileUserId) {
    loadUserProfile(profileUserId);
  } else if (document.getElementById('assignTable')) {
    loadAssignmentsList();
  }
}

const trainUi = { q: '', status: '', course: '', rows: [] };

// Состояние срока действия пройденного курса: valid / soon (≤30 дн.) / overdue / unlimited
function trainStatusOf(a) {
  if (a.no_expiry || !a.next_test_date) return { key: 'unlimited', days: null };
  const days = expDaysLeft(a);
  if (days < 0) return { key: 'overdue', days };
  if (days <= 30) return { key: 'soon', days };
  return { key: 'valid', days };
}

// Бейдж «осталось N дней» / «просрочен N дн.» / «Бессрочно»
function trainBadgeHtml(a) {
  const st = trainStatusOf(a);
  const dn = CURRENT_LANG === 'kz' ? 'күн' : 'дн.';
  let cls, text;
  if (st.key === 'unlimited') { cls = 'bg-slate-100 text-slate-600'; text = CURRENT_LANG === 'kz' ? 'Мерзімсіз' : 'Бессрочно'; }
  else if (st.key === 'overdue') { cls = 'bg-red-100 text-red-800'; text = `${Math.abs(st.days)} ${dn} ${t('overdue')}`; }
  else if (st.days === 0) { cls = 'bg-amber-100 text-amber-800'; text = t('expires_today'); }
  else if (st.key === 'soon') { cls = 'bg-amber-100 text-amber-800'; text = `${st.days} ${t('days_left')}`; }
  else { cls = 'bg-emerald-100 text-emerald-800'; text = `${st.days} ${t('days_left')}`; }
  return `<span class="text-xs font-bold px-2.5 py-1 rounded-lg whitespace-nowrap ${cls}">${text}</span>`;
}

// Только актуальная (последняя успешная) запись по паре «сотрудник + курс»
function latestPassedPerCourse(list) {
  const m = new Map();
  list.filter(x => x.status === 'passed').forEach(x => {
    const k = `${x.user_id}:${x.course_id}`;
    const cur = m.get(k);
    const tx = String(x.test_date || ''), tc = cur ? String(cur.test_date || '') : '';
    if (!cur || tx > tc || (tx === tc && Number(x.id) > Number(cur.id))) m.set(k, x);
  });
  return [...m.values()];
}

function renderTrainingRows() {
  const tbody = document.getElementById('trainTable');
  if (!tbody) return;
  const title = a => (CURRENT_LANG === 'kz' ? (a.title_kz || a.title_ru) : (a.title_ru || a.title_kz)) || '';
  const rows = trainUi.rows;

  // курсы для фильтра
  const courses = [...new Set(rows.map(title).filter(Boolean))].sort((x, y) => x.localeCompare(y, 'ru'));
  if (trainUi.course && !courses.includes(trainUi.course)) trainUi.course = '';
  const cSel = document.getElementById('trainCourse');
  if (cSel) cSel.innerHTML = `<option value="">${_L('Все курсы', 'Барлық курстар')}</option>` +
    courses.map(c => `<option value="${esc(c)}" ${c === trainUi.course ? 'selected' : ''}>${esc(c)}</option>`).join('');

  // счётчики-«таблетки» (клик — фильтр по статусу)
  const counts = { valid: 0, soon: 0, overdue: 0, unlimited: 0 };
  rows.forEach(a => { counts[trainStatusOf(a).key]++; });
  const pill = (key, label, n, color) => `<button type="button" onclick="setTrainStatus('${key}')" class="text-xs font-semibold px-3 py-1.5 rounded-full border ${trainUi.status === key ? color.on : color.off}">${label}: ${n}</button>`;
  const sum = document.getElementById('trainSummary');
  if (sum) sum.innerHTML = [
    pill('valid', _L('Действует', 'Жарамды'), counts.valid, { on: 'bg-emerald-600 text-white border-emerald-600', off: 'bg-emerald-50 text-emerald-700 border-emerald-200' }),
    pill('soon', _L('Истекает ≤ 30 дн.', '≤ 30 күнде аяқталады'), counts.soon, { on: 'bg-amber-500 text-white border-amber-500', off: 'bg-amber-50 text-amber-700 border-amber-200' }),
    pill('overdue', _L('Просрочено', 'Мерзімі өткен'), counts.overdue, { on: 'bg-red-600 text-white border-red-600', off: 'bg-red-50 text-red-700 border-red-200' }),
    pill('unlimited', _L('Бессрочно', 'Мерзімсіз'), counts.unlimited, { on: 'bg-slate-600 text-white border-slate-600', off: 'bg-slate-50 text-slate-600 border-slate-200' })
  ].join('');

  const q = (trainUi.q || '').trim().toLowerCase();
  let list = rows.filter(a => {
    if (trainUi.status && trainStatusOf(a).key !== trainUi.status) return false;
    if (trainUi.course && title(a) !== trainUi.course) return false;
    if (q) {
      const hay = `${a.last_name} ${a.first_name} ${title(a)} ${a.object || ''} ${a.department || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  // сначала самые срочные (просроченные → скоро истекающие), бессрочные — в конце
  const rank = a => { const st = trainStatusOf(a); return st.key === 'unlimited' ? Infinity : st.days; };
  list.sort((a, b) => rank(a) - rank(b) || `${a.last_name} ${a.first_name}`.localeCompare(`${b.last_name} ${b.first_name}`, 'ru'));

  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400">${rows.length ? _L('Ничего не найдено по выбранным фильтрам', 'Таңдалған сүзгілер бойынша ештеңе табылмады') : t('no_data')}</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(a => {
    const hasCert = !a.is_external && a.certificate_number;
    return `
    <tr class="hover:bg-slate-50">
      <td class="px-4 py-3 font-medium">
        <button onclick="openUserProfile(${a.user_id})" class="hover:text-blue-600 hover:underline text-left">${esc(a.last_name)} ${esc(a.first_name)}</button>
        <br><span class="text-xs text-slate-400">${esc(a.object || '—')}${a.department ? ' / ' + esc(a.department) : ''}</span>
      </td>
      <td class="px-4 py-3">${esc(title(a))}</td>
      <td class="px-4 py-3 text-xs text-slate-600">${a.test_date ? new Date(a.test_date).toLocaleDateString('ru-RU') : '—'}</td>
      <td class="px-4 py-3 text-xs text-slate-600">${a.no_expiry ? (CURRENT_LANG === 'kz' ? 'Мерзімсіз' : 'Бессрочно') : (a.next_test_date ? new Date(a.next_test_date).toLocaleDateString('ru-RU') : '—')}</td>
      <td class="px-4 py-3">${trainBadgeHtml(a)}</td>
      <td class="px-4 py-3 text-xs text-slate-600">№ ${esc(a.protocol_number || '—')}</td>
      <td class="px-4 py-3 text-right whitespace-nowrap space-x-3">
        ${hasCert ? `<a href="#" onclick="downloadAuthed('/api/certificates/${a.id}');return false;" class="text-blue-600 hover:underline text-xs font-semibold">${t('download_cert')}</a>
        <a href="#" onclick="downloadAuthed('/api/id-cards/${a.id}');return false;" class="text-indigo-600 hover:underline text-xs font-semibold">${t('download_id_card')}</a>` : ''}
        ${a.public_uid ? `<a href="/p/${encodeURIComponent(a.public_uid)}" target="_blank" rel="noopener" class="text-indigo-700 hover:underline text-xs font-semibold">🪪 ${_L('Единое удостоверение', 'Бірыңғай куәлік')}</a>` : ''}
      </td>
    </tr>`;
  }).join('');
}

// --- ПРОТОКОЛЫ (открытие/закрытие, п.1 и п.4) ---
function fmtDate(d) {
  if (!d) return '—';
  // Поле приходит как YYYY-MM-DD (DATE в postgres) — просто переставляем местами
  const s = String(d).slice(0, 10);
  const parts = s.split('-');
  return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : s;
}

// Дата+время (подписи протокола, журнал подписания) — сервер отдаёт ISO-строку/timestamptz
function fmtDateTime(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return String(d);
  const pad = n => String(n).padStart(2, '0');
  return `${pad(dt.getDate())}.${pad(dt.getMonth() + 1)}.${dt.getFullYear()} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}

function protocolYearOf(p) {
  return parseInt(String(p.open_date).slice(0, 4), 10);
}

// Вкладки по годам (год = год даты открытия протокола) + сортировка по дате открытия внутри года
function renderProtocolsView() {
  const tbody = document.getElementById('protocolsTable');
  const tabsEl = document.getElementById('protocolYearTabs');
  if (!tbody || !tabsEl) return;
  const list = state.protocols || [];
  const currentYear = new Date().getFullYear();

  const counts = {};
  list.forEach(p => { const y = protocolYearOf(p); counts[y] = (counts[y] || 0) + 1; });
  const years = Object.keys(counts).map(Number);
  if (!years.includes(currentYear)) years.push(currentYear);
  years.sort((x, y) => x - y);

  // По умолчанию — текущий год; если выбранного года больше нет в списке — тоже текущий
  if (!state.protocolYear || !years.includes(state.protocolYear)) state.protocolYear = currentYear;

  tabsEl.innerHTML = years.map(y => `
    <button type="button" onclick="selectProtocolYear(${y})"
      class="px-4 py-1.5 rounded-lg text-sm font-semibold border ${y === state.protocolYear ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
      ${y}<span class="ml-1.5 text-xs font-normal ${y === state.protocolYear ? 'text-blue-100' : 'text-slate-400'}">${counts[y] || 0}</span>
    </button>
  `).join('');

  const sortBtn = document.getElementById('protocolSortBtn');
  if (sortBtn) sortBtn.textContent = state.protocolSortDesc ? 'По дате открытия: новые сверху ↓' : 'По дате открытия: старые сверху ↑';

  const rows = list.filter(p => protocolYearOf(p) === state.protocolYear).sort((p1, p2) => {
    const d = String(p1.open_date).localeCompare(String(p2.open_date)) || (Number(p1.id) - Number(p2.id));
    return state.protocolSortDesc ? -d : d;
  });

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">${
      list.length && orgActive() ? 'По выбранному объекту/отделу за ' + state.protocolYear + ' год протоколов нет — сбросьте фильтр, чтобы увидеть все'

      : 'За ' + state.protocolYear + ' год протоколов пока нет')}</td></tr>`;

  }

  const todayStr = toLocalDateStr(new Date());
  tbody.innerHTML = rows.map(p => {
    const isActiveNow = p.status === 'open' && String(p.open_date).slice(0,10) <= todayStr && todayStr <= String(p.close_date).slice(0,10);

    <tr class="hover:bg-slate-50">
      <td class="px-4 py-3 font-bold text-slate-900"><button type="button" onclick="openProtocolMembersModal(${p.id})" class="hover:text-blue-600 hover:underline">№ ${esc(p.protocol_number)}</button></td>

      <td class="px-4 py-3 text-slate-600">${fmtDate(p.close_date)}</td>

        <button onclick="downloadProtocolDocx(${p.id})" class="text-indigo-600 hover:underline text-xs font-semibold">Скачать Word</button>
        <button onclick="downloadProtocolPdf(${p.id})" class="text-purple-600 hover:underline text-xs font-semibold">Скачать PDF</button>
        ${isObserverUser() ? '' : p.status === 'revoked' ? `
          ${(state.user && state.user.role === 'superadmin') ? `<button onclick="deleteProtocolAction(${p.id})" class="text-red-600 hover:underline text-xs">Удалить</button>` : ''}
        ` : p.locked ? `
          <span class="text-[11px] text-slate-400 font-semibold" title="Протокол полностью подписан комиссией — изменение, закрытие и удаление запрещены">🔒 Подписан</span>

        ` : `
          ${isSuperadminUser() ? `<button onclick="editProtocol(${p.id})" class="text-blue-600 hover:underline text-xs">Изменить</button>` : ''}

            ? `<button onclick="closeProtocolAction(${p.id})" class="text-amber-600 hover:underline text-xs">Закрыть</button>`

async function downloadProtocolDocx(id) {
  try {
    const res = await api.req('/api/protocols/' + id + '/download');
    const blob = await res.blob();
    // Имя файла приходит с сервера: «2026-09-20 Протокол по БиОТ № 027.docx»
    let name = 'protocol.docx';
    const m = (res.headers.get('content-disposition') || '').match(/filename\*=UTF-8''([^;]+)/i);
    if (m) { try { name = decodeURIComponent(m[1]); } catch (e) {} }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Не удалось скачать протокол: ' + e.message);
  }
}

// Предложить следующий номер по нумерации года даты открытия (пока номер не правили вручную)
async function suggestProtocolNumber() {
  const numEl = document.getElementById('protoNumber');
  const hintEl = document.getElementById('protoNumberHint');
  if (!numEl || numEl.dataset.auto !== '1') return;
  const year = String(document.getElementById('protoOpenDate').value || '').slice(0, 4) || String(new Date().getFullYear());
  try {
    const r = await api.getNextProtocolNumber(year);
    if (numEl.dataset.auto !== '1') return;   // пока грузилось, пользователь начал вводить вручную
    numEl.value = r.next_number;
    if (hintEl) hintEl.textContent = `Предложен следующий номер по нумерации ${year} года — можно изменить вручную.`;
  } catch (e) {
    if (hintEl) hintEl.textContent = 'Не удалось получить следующий номер — введите его вручную.';
  }
}

// Ответ сервера «такой сотрудник уже есть / очень похожий уже есть» (защита от дублей).
// Точный дубль — сообщение + предложение открыть существующую карточку.
// Похожий — админ может подтвердить «это другой человек» и сохранить; ассистент — только сообщение.
// Возвращает true, если ошибка обработана здесь.
async function handleDuplicateError(err, opts) {
  const d = err && err.data;
  if (!d || (d.error !== 'duplicate_employee' && d.error !== 'possible_duplicate')) return false;
  const ex = d.existing_user;
  if (d.error === 'possible_duplicate' && d.can_confirm) {
    const ok = confirm(d.message + '\n\n' + _L('Это ДРУГОЙ человек (однофамилец)?\nОК — всё равно сохранить, Отмена — не сохранять.', 'Бұл БАСҚА адам ба?\nОК — сақтау, Болдырмау — сақтамау.'));
    if (ok && opts && opts.resend) {
      try { await opts.resend(); } catch (e2) { alert(_L('Не удалось сохранить: ', 'Сақтау мүмкін болмады: ') + (e2.message || '')); }
    }
    return true;
  }
  alert(d.message || err.message);
  if (d.error === 'duplicate_employee' && ex && ex.id && confirm(_L('Открыть карточку существующего сотрудника?', 'Бар қызметкердің карточкасын ашу керек пе?'))) {
    if (opts && opts.close) opts.close();
    openUserProfile(ex.id);
  }
  return true;
}

  document.getElementById('aeFirstName').value = u.first_name || '';

  document.getElementById('aeIin').value = u.iin || '';
  await loadDictionaries();
  fillOrgSelects('ae', { object: u.object || '', department: u.department || '', position: u.position || '' });

async function submitAssistantFieldsForm(e) {
  e.preventDefault();
  const id = document.getElementById('aeUserId').value;
  const data = {
    last_name: document.getElementById('aeLastName').value.trim(),
    first_name: document.getElementById('aeFirstName').value.trim(),
    object: document.getElementById('aeObject').value.trim(),
    department: document.getElementById('aeDept').value.trim(),
    position: document.getElementById('aePos').value.trim(),
    tco_badge: document.getElementById('aeTcoBadge').value.trim(),
    iin: document.getElementById('aeIin').value.trim()
  };
  const btn = e.target.querySelector('button[type=submit]');
  if (btn) btn.disabled = true;
  try {
    await api.saveUser(data, id);
    document.getElementById('assistantEditModal').classList.add('hidden');
    loadUserProfile(id);
  } catch (err) {
    if (await handleDuplicateError(err, {
      close: () => document.getElementById('assistantEditModal').classList.add('hidden'),
      resend: async () => { await api.saveUser({ ...data, confirm_not_duplicate: true }, id); document.getElementById('assistantEditModal').classList.add('hidden'); loadUserProfile(id); }
    })) return;
    alert('Не удалось сохранить: ' + (err.message === 'invalid_iin' ? 'ИИН должен состоять ровно из 12 цифр' : err.message === 'out_of_zone' ? 'Этот объект/отдел вне вашей зоны доступа' : err.message === 'duplicate_employee' ? 'Сотрудник с таким ФИО уже есть' : (err.message || 'ошибка сервера')));
  } finally {
    if (btn) btn.disabled = false;
  }
}

// Показывает, на какие вопросы сотрудник ответил верно/неверно в конкретной попытке (п.2 запроса)
async function openAnswersModal(assignmentId) {
  const modal = document.getElementById('answersModal');
  const body = document.getElementById('answersModalBody');
  if (!modal || !body) return;
  body.innerHTML = `<div class="text-slate-400 text-sm">${t('loading')}</div>`;
  modal.classList.remove('hidden');
  try {
    const { questions } = await api.getAssignmentAnswers(assignmentId);
    if (!questions.length) {
      body.innerHTML = `<div class="text-slate-400 text-sm">${t('no_data')}</div>`;
      return;
    }
    body.innerHTML = questions.map((q, i) => {
      const opts = parseOpts(CURRENT_LANG === 'kz' ? q.options_kz : q.options_ru);
      const qText = CURRENT_LANG === 'kz' ? q.question_kz : q.question_ru;
      return `
        <div class="border rounded-lg p-3 ${q.is_correct ? 'border-emerald-200 bg-emerald-50/40' : 'border-red-200 bg-red-50/40'}">
          <p class="text-sm font-semibold text-slate-800 mb-2">${i + 1}. ${esc(qText)} ${q.is_correct ? '<span class="text-emerald-600">✓</span>' : '<span class="text-red-600">✗</span>'}</p>
          <div class="space-y-1">
            ${opts.map((o, idx) => {
              let cls = 'text-slate-600';
              let mark = '';
              if (idx === q.correct_index) { cls = 'text-emerald-700 font-semibold'; mark = ' ✓ верный ответ'; }
              if (idx === q.chosen_index && idx !== q.correct_index) { cls = 'text-red-700 font-semibold'; mark = ' ✗ выбран сотрудником'; }
              else if (idx === q.chosen_index && idx === q.correct_index) { mark = ' ✓ выбран сотрудником и верный'; }
              return `<div class="text-xs ${cls}">${esc(o)}${mark}</div>`;
            }).join('')}
            ${q.chosen_index === null ? '<div class="text-xs text-slate-400 italic">Сотрудник не ответил на этот вопрос</div>' : ''}
          </div>
        </div>
      `;
    }).join('');
  } catch (e) {
    body.innerHTML = `<div class="text-red-600 text-sm">${t('error_generic')}</div>`;
  }
}

// --- Вспомогательное: дата в локальном времени ---
// Форматирует дату в YYYY-MM-DD по ЛОКАЛЬНОМУ времени (в отличие от toISOString,
// который переводит в UTC и может сдвинуть дату на день назад/вперёд для часовых поясов вроде UTC+5)
function toLocalDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

async function copyPersonLink(btn) {
  const url = btn && btn.dataset ? btn.dataset.url : '';
  if (!url) return;
  try {
    await navigator.clipboard.writeText(url);
    const old = btn.textContent;
    btn.textContent = _L('Скопировано', 'Көшірілді');
    setTimeout(() => { btn.textContent = old; }, 1500);
  } catch (e) {
    window.prompt(_L('Скопируйте ссылку:', 'Сілтемені көшіріңіз:'), url);
  }
}

function setMyTestsTab(tab) {
  myTestsTab = tab;
  renderMyTests();
}

// Состояние назначения глазами сотрудника:
// new — не начат; retake — пересдача открыта админом; started — начат, но не завершён;
// failed — не сдан (пересдачу может открыть только админ); passed — сдан
function myTestKind(a) {
  if (a.status === 'passed') return 'passed';
  if (a.status === 'in_progress') return 'started';
  if (a.status === 'failed') return a.retake_allowed ? 'retake' : 'failed';
  return (a.retake_allowed && a.attempts_used > 0) ? 'retake' : 'new';
}

function myTestHasScore(a) {
  return a.score_percent !== null && a.score_percent !== undefined && a.score_percent !== '' && Number(a.attempts_used || 0) > 0;
}

function myTestMedia(a) {
  const isKz = CURRENT_LANG === 'kz';
  // Материалы/видео на языке интерфейса сотрудника; если для этого языка не загружено — берём другой язык, затем старые (legacy) поля
  const materialPath = (isKz ? a.material_pdf_path_kz : a.material_pdf_path_ru) || a.material_pdf_path_ru || a.material_pdf_path_kz || a.material_pdf_path;
  const videoPath = (isKz ? a.video_path_kz : a.video_path_ru) || a.video_path_ru || a.video_path_kz || a.video_path;
  const videoUrl = (isKz ? a.video_url_kz : a.video_url_ru) || a.video_url_ru || a.video_url_kz || a.video_url;
  return { materialPath, videoSrc: videoPath || videoUrl };
}

// Полоска «правильных ответов» с отметкой проходного балла
function myScoreBarHtml(score, pass, color) {
  const sc = Math.max(0, Math.min(100, Number(score) || 0));
  const ps = Number(pass) > 0 ? Math.min(100, Number(pass)) : null;
  return `<div class="relative h-2.5 rounded-full bg-slate-200 mt-2" role="img" aria-label="${sc}%">
    <div class="absolute left-0 top-0 h-full rounded-full" style="width:${sc}%;background:${color}"></div>
    ${ps !== null ? `<div class="absolute -top-1 w-0.5 bg-slate-700" style="left:${ps}%;height:1.125rem" title="${_L('Проходной балл', 'Өту балы')}: ${ps}%"></div>` : ''}
  </div>`;
}

function myTestCardHtml(a, color) {
  const isKz = CURRENT_LANG === 'kz';
  const title = isKz ? (a.title_kz || a.title_ru) : (a.title_ru || a.title_kz);
  const kind = myTestKind(a);
  const { materialPath, videoSrc } = myTestMedia(a);
  const pass = a.pass_score_percent;
  const hasScore = myTestHasScore(a);

  // Цвет и подпись статуса
  const ST = {
    new:     { fg: '#1d4ed8', bg: '#eff6ff', accent: '#2563eb', label: _L('Не начат', 'Басталмаған') },
    retake:  { fg: '#b45309', bg: '#fffbeb', accent: '#d97706', label: _L('Пересдача открыта', 'Қайта тапсыру ашық') },
    started: { fg: '#b45309', bg: '#fffbeb', accent: '#d97706', label: _L('Начат, не завершён', 'Басталды, аяқталмады') },
    failed:  { fg: '#be123c', bg: '#fff1f2', accent: '#e11d48', label: _L('Не сдан', 'Тапсырылмады') }
  }[kind];

  // Блок результата (только если уже была попытка)
  let resultHtml = '';
  if (hasScore && (kind === 'failed' || kind === 'retake')) {
    resultHtml = `
      <div class="mt-4 p-3 rounded-xl" style="background:${ST.bg}">
        <div class="flex flex-wrap items-baseline justify-between gap-x-3">
          <span class="text-sm font-bold" style="color:${ST.fg}">${_L('Правильных ответов', 'Дұрыс жауаптар')}: ${a.score_percent}%</span>
          ${pass ? `<span class="text-xs text-slate-600">${_L('нужно не менее', 'кемінде қажет')} ${pass}%</span>` : ''}
        </div>
        ${myScoreBarHtml(a.score_percent, pass, ST.accent)}
      </div>`;
  }

  // Подсказка, что делать дальше
  let hintHtml = '';
  if (kind === 'failed') {
    hintHtml = `<p class="mt-3 text-sm font-semibold" style="color:${ST.fg}">${_L('Тест не сдан. Для пересдачи обратитесь к администратору.', 'Тест тапсырылмады. Қайта тапсыру үшін әкімшіге жүгініңіз.')}</p>`;
  } else if (kind === 'started') {
    hintHtml = `<p class="mt-3 text-sm font-semibold" style="color:${ST.fg}">${_L('Тест был начат, но не завершён. Для новой попытки обратитесь к администратору.', 'Тест басталды, бірақ аяқталмады. Жаңа әрекет үшін әкімшіге жүгініңіз.')}</p>`;
  }

  const meta = [
    a.time_limit_minutes ? `⏱ ${a.time_limit_minutes} мин` : '',
    pass ? `${_L('Проходной балл', 'Өту балы')}: ${pass}%` : '',
    a.protocol_number ? `${_L('Протокол', 'Хаттама')} № ${esc(a.protocol_number)}${a.protocol_date ? ' ' + _L('от', 'күні') + ' ' + fmtDate(a.protocol_date) : ''}` : ''
  ].filter(Boolean).join(' · ');

  const canStart = kind === 'new' || kind === 'retake';
  const mediaBtnCls = 'inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border-2 border-blue-200 bg-blue-50 hover:bg-blue-100 text-blue-800 text-sm font-bold transition';

  return `
    <div class="rounded-2xl bg-white border border-slate-200 shadow-sm overflow-hidden fade-in" style="border-left:8px solid ${ST.accent}">
      <div class="p-5 sm:p-6">
        <div class="flex flex-wrap items-center gap-2 mb-2">
          <span class="text-xs font-bold px-3 py-1 rounded-full" style="background:${ST.bg};color:${ST.fg}">${ST.label}${(kind === 'failed' && hasScore) ? ' · ' + a.score_percent + '%' : ''}</span>
          ${catBadgeHtml(a)}
        </div>
        <h4 class="text-xl sm:text-2xl font-extrabold text-slate-900 leading-snug break-words">${esc(title)}</h4>
        ${meta ? `<p class="text-xs text-slate-500 mt-1.5">${meta}</p>` : ''}
        ${resultHtml}
        ${hintHtml}
        <div class="mt-5 flex flex-wrap items-center gap-3">
          ${materialPath ? `<button type="button" onclick="openMediaViewer('${jsAttrEsc(materialPath)}', '${jsAttrEsc(title)}')" class="${mediaBtnCls}">📄 ${t('view_material')}</button>` : ''}
          ${videoSrc ? `<button type="button" onclick="openMediaViewer('${jsAttrEsc(videoSrc)}', '${jsAttrEsc(title)}')" class="${mediaBtnCls}">🎬 ${_L('Видео', 'Бейне')}</button>` : ''}
          ${canStart ? `
            <button type="button" onclick="runTest(${a.id}, '${jsAttrEsc(title)}', ${a.time_limit_minutes || 20})" class="w-full sm:w-auto sm:ml-auto px-8 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl text-base shadow-md transition">
              ${kind === 'retake' ? '↻ ' + _L('Пересдать тест', 'Қайта тапсыру') : '▶ ' + _L('Начать тест', 'Тестті бастау')}
            </button>` : ''}
        </div>
      </div>
    </div>`;
}

// Сданный тест — компактная строка (без крупных кнопок)
function myPassedRowHtml(a) {
  const isKz = CURRENT_LANG === 'kz';
  const title = isKz ? (a.title_kz || a.title_ru) : (a.title_ru || a.title_kz);

  const fmt = d => new Date(d).toLocaleDateString('ru-RU');
  const parts = [
    a.test_date ? `${_L('Сдан', 'Тапсырылды')}: ${fmt(a.test_date)}` : '',
    a.next_test_date ? `${_L('Действителен до', 'Жарамды')}: ${fmt(a.next_test_date)}` : (a.no_expiry ? _L('Бессрочно', 'Мерзімсіз') : ''),
    a.protocol_number ? `${_L('Протокол', 'Хаттама')} № ${esc(a.protocol_number)}` : ''
  ].filter(Boolean).join(' · ');
  const scoreTxt = (a.score_percent !== null && a.score_percent !== undefined && a.score_percent !== '') ? ` · ${a.score_percent}%` : '';
  return `
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3 border border-slate-200 rounded-xl bg-white">
      <div class="flex-1 min-w-[220px]">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-sm font-bold text-slate-900 break-words">${esc(title)}</span>
          ${catBadgeHtml(a)}
        </div>
        ${parts ? `<div class="text-xs text-slate-500 mt-0.5">${parts}</div>` : ''}
      </div>
      <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg whitespace-nowrap">✓ ${_L('Сдан', 'Тапсырылды')}${scoreTxt}</span>
      <div class="flex items-center gap-3 text-xs font-semibold">
        ${materialPath ? `<button type="button" onclick="openMediaViewer('${jsAttrEsc(materialPath)}', '${jsAttrEsc(title)}')" class="text-blue-600 hover:underline">📄 ${_L('Материалы', 'Материалдар')}</button>` : ''}
        ${videoSrc ? `<button type="button" onclick="openMediaViewer('${jsAttrEsc(videoSrc)}', '${jsAttrEsc(title)}')" class="text-blue-600 hover:underline">🎬 ${_L('Видео', 'Бейне')}</button>` : ''}
        ${a.is_external ? '' : `<a href="#" onclick="downloadAuthed('/api/certificates/${a.id}');return false;" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">${t('download_cert')}</a>`}
        <a href="#" onclick="downloadAuthed('/api/id-cards/${a.id}');return false;" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg">${t('download_id_card')}</a>
      </div>
    </div>`;
}

function renderMyTests() {
  const div = document.getElementById('myTestsList');
  if (!div) return;
  const list = myTestsData;
  if (!list.length) {
    div.innerHTML = `<div class="p-6 text-center text-slate-500">${_L('У вас нет назначенных тестов.', 'Сізге тағайындалған тесттер жоқ.')}</div>`;
    return;
  }
  const isKz = CURRENT_LANG === 'kz';
  const todo = list.filter(a => myTestKind(a) !== 'passed');
  const done = list.filter(a => myTestKind(a) === 'passed');

  // Вкладки со счётчиками
  const tabBtn = (id, label, count, pillBg, pillFg) => {
    const active = myTestsTab === id;
    return `<button type="button" onclick="setMyTestsTab('${id}')" class="flex-1 sm:flex-none whitespace-nowrap px-2 sm:px-5 py-3 text-sm font-bold border-b-4 -mb-px transition ${active ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500 hover:text-slate-800'}">
      ${label}
      <span class="ml-1.5 inline-block min-w-[1.5rem] text-center text-xs font-bold px-2 py-0.5 rounded-full" style="background:${count ? pillBg : '#f1f5f9'};color:${count ? pillFg : '#94a3b8'}">${count}</span>
    </button>`;
  };
  const tabs = `<div class="flex gap-1 border-b border-slate-200 mb-5">
    ${tabBtn('todo', _L('К прохождению', 'Тапсыруға'), todo.length, '#fef3c7', '#b45309')}
    ${tabBtn('done', _L('Пройденные', 'Тапсырылғандар'), done.length, '#d1fae5', '#047857')}
  </div>`;

  let body = '';
  if (myTestsTab === 'done') {
    if (!done.length) {
      body = `<div class="p-8 text-center text-slate-500">${_L('Пока нет пройденных тестов.', 'Тапсырылған тесттер әлі жоқ.')}</div>`;
    } else {
      const sorted = done.slice().sort((x, y) => new Date(y.test_date || 0) - new Date(x.test_date || 0));
      body = `<div class="space-y-2">${sorted.map(myPassedRowHtml).join('')}</div>`;
    }
  } else if (!todo.length) {
    body = `<div class="p-8 text-center rounded-2xl border-2 border-dashed border-emerald-200 bg-emerald-50">
      <div class="text-4xl mb-2">🎉</div>
      <div class="text-lg font-bold text-emerald-800">${_L('Все назначенные тесты сданы', 'Барлық тағайындалған тесттер тапсырылды')}</div>
      <button type="button" onclick="setMyTestsTab('done')" class="mt-3 px-4 py-2 bg-white border border-emerald-300 text-emerald-700 text-sm font-semibold rounded-lg hover:bg-emerald-100">${_L('Открыть пройденные и сертификаты', 'Тапсырылғандар мен сертификаттарды ашу')}</button>
    </div>`;
  } else {
    // Сначала то, что можно пройти прямо сейчас (не начат / пересдача), затем то, что ждёт решения админа
    const rankOf = a => ({ new: 0, retake: 0, started: 1, failed: 2 }[myTestKind(a)]);
    const groups = groupCoursesByCategory(todo).sort((g1, g2) =>
      (!g1.key - !g2.key) ||
      Math.min(...g1.items.map(rankOf)) - Math.min(...g2.items.map(rankOf)) ||
      g1.label.localeCompare(g2.label, isKz ? 'kk' : 'ru'));
    const showHeaders = groups.some(g => g.key);
    body = groups.map(g => {
      const items = g.items.slice().sort((x, y) => rankOf(x) - rankOf(y));
      const header = showHeaders ? `
        <div class="flex items-center gap-3 mb-3 pb-2 border-b" style="border-color:${g.color.bd}">
          <span class="inline-block w-1.5 h-6 rounded-full" style="background:${g.color.fg}"></span>
          <h3 class="text-base font-bold text-slate-900">${esc(g.label)}</h3>
          <span class="ml-auto text-xs font-bold px-2 py-0.5 rounded-full" style="background:${g.color.bg};color:${g.color.fg}">${items.length}</span>
        </div>` : '';
      return `<section class="mt-8 first:mt-0">${header}<div class="space-y-4">${items.map(a => myTestCardHtml(a, g.color)).join('')}</div></section>`;
    }).join('');
  }

  div.innerHTML = tabs + body;
}

function parseOpts(raw) {
  if (Array.isArray(raw)) return raw;
  try { return JSON.parse(raw); } catch (e) { return []; }
}

function onTestVisibilityChange() {
  if (document.hidden && state.activeTest) {
    state.activeTest.violations = (state.activeTest.violations || 0) + 1;
  }
}

let currentTestIndex = 0;

async function runTest(assignmentId, title, timeLimitMinutes) {
  let data;
  try {
    data = await api.startTest(assignmentId);
  } catch (e) {
    console.error('startTest failed', e);
    const raw = (e && e.message ? e.message : '').toLowerCase();
    const MESSAGES = [
      ['retake not allowed', 'Пересдача по этому курсу не разрешена. Попросите администратора открыть пересдачу в разделе «Назначения» (кнопка «Пересдача»).'],
      ['already passed', 'Тест по этому курсу уже сдан.'],
      ['already completed', 'Тест по этому курсу уже завершён.'],
      ['no questions', 'Для этого курса пока нет вопросов. Обратитесь к администратору.'],
      ['not found', 'Назначение не найдено — обновите страницу и попробуйте снова.'],
      ['expired', 'Срок прохождения теста истёк. Обратитесь к администратору.']
    ];
    const matched = MESSAGES.find(([key]) => raw.includes(key));
    const hint = matched
      ? matched[1]
      : e && e.status === 404
        ? 'Назначение не найдено или раздел тестирования недоступен на сервере.'
        : e && e.status === 403
          ? 'Тест уже пройден или пересдача пока не разрешена.'
          : (e && e.message ? e.message : 'ошибка сервера');
    alert(hint);
    // Список мог устареть — подтягиваем актуальные статусы.
    try { await loadMyTests(); } catch (err) { console.error('refresh after start failure', err); }
    return;
  }
  // Ограничиваем строго 10 вопросами
  const rawQuestions = Array.isArray(data)
    ? data
    : (data && (data.questions || data.items || (data.test && data.test.questions))) || [];
  const questions = rawQuestions.slice(0, 10);
  if (!questions.length) {
    alert('Для этого курса пока нет вопросов. Обратитесь к администратору.');
    return;
  }

  state.activeTest = {
    id: assignmentId,
    questions: questions,
    answers: {},
    violations: 0
  };
  currentTestIndex = 0;

  document.getElementById('testRunTitle').textContent = title;
  document.getElementById('testRunModal').classList.remove('hidden');
  // На телефоне без этого прокручивалась страница под окном, а не сам тест.
  document.body.style.overflow = 'hidden';

  renderTestStep();

  document.addEventListener('visibilitychange', onTestVisibilityChange);

  // Обратный отсчет таймера
  const timerEl = document.getElementById('testRunTimer');
  state.timeLeft = Math.max(1, parseInt(timeLimitMinutes, 10) || 20) * 60;
  const renderTimer = () => {
    const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
    const s = (state.timeLeft % 60).toString().padStart(2, '0');
    if (timerEl) timerEl.textContent = `${m}:${s}`;
  };
  renderTimer();
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    renderTimer();
    if (state.timeLeft <= 0) {
      clearInterval(state.timerInterval);
      alert('Время вышло! Тест будет завершен.');
      finishTest();
    }
  }, 1000);
}

function renderTestStep() {
  const test = state.activeTest;
  if (!test || !test.questions.length) return;

  const total = test.questions.length;
  const q = test.questions[currentTestIndex];

  document.getElementById('testRunSubtitle').textContent = `Вопрос ${currentTestIndex + 1} из ${total}`;

  // Рендерим кнопки 1..10 (зеленые — где уже выбран ответ, синяя — текущий)
  const pager = document.getElementById('testQuestionPager');
  pager.innerHTML = test.questions.map((item, idx) => {
    const isAnswered = test.answers[answerKey(item)] !== undefined;
    const isCurrent = idx === currentTestIndex;
    let cls = 'w-8 h-8 rounded-lg text-xs font-bold transition ';
    if (isCurrent) {
      cls += 'bg-blue-600 text-white ring-2 ring-blue-300';
    } else if (isAnswered) {
      cls += 'bg-emerald-100 text-emerald-800 border border-emerald-300';
    } else {
      cls += 'bg-slate-100 text-slate-600 hover:bg-slate-200';
    }
    return `<button type="button" onclick="goToQuestion(${idx})" class="${cls}">${idx + 1}</button>`;
  }).join('');

  // Текст вопроса и варианты
  const qText = CURRENT_LANG === 'kz' ? (q.question_kz || q.question_ru) : (q.question_ru || q.question_kz);
  const rawOpts = CURRENT_LANG === 'kz' ? (q.options_kz || q.options_ru) : (q.options_ru || q.options_kz);
  const opts = parseOpts(rawOpts);

  const container = document.getElementById('testRunQuestions');
  container.innerHTML = `
    <div class="space-y-4">
      <div class="font-semibold text-slate-900 text-base leading-snug">
        ${currentTestIndex + 1}. ${esc(qText)}
      </div>
      <div class="space-y-2.5 pt-2">
        ${opts.map((opt, optIdx) => {
          const qKey = answerKey(q);
          const checked = test.answers[qKey] === optIdx;
          return `
            <label class="flex items-center space-x-3 p-3 rounded-xl border ${checked ? 'border-blue-500 bg-blue-50/70 shadow-sm' : 'border-slate-200 bg-white hover:border-slate-300'} cursor-pointer text-sm transition">
              <input type="radio" name="active_q_${qKey}" value="${optIdx}" ${checked ? 'checked' : ''} onchange="setAnswer('${qKey}', ${optIdx})" onclick="setAnswer('${qKey}', ${optIdx})" class="text-blue-600 w-4 h-4">
              <span class="text-slate-800">${esc(opt)}</span>
            </label>
          `;
        }).join('')}
      </div>
    </div>
  `;

  document.getElementById('btnPrevQ').disabled = (currentTestIndex === 0);
  document.getElementById('btnNextQ').style.display = (currentTestIndex === total - 1) ? 'none' : 'inline-block';
}

function answerKey(q) {
  return String(q && (q.id !== undefined ? q.id : q.question_id));
}

function setAnswer(questionId, optIdx) {
  if (!state.activeTest) return;
  state.activeTest.answers[String(questionId)] = optIdx;
  renderTestStep();
}

// Снимаем выбранные варианты прямо из разметки — на случай, если событие
// change на мобильном не успело отработать до нажатия «Завершить тест».
function syncAnswersFromDom() {
  if (!state.activeTest) return;
  document.querySelectorAll('#testRunQuestions input[type="radio"]:checked').forEach((input) => {
    const qid = input.name.replace('active_q_', '');
    state.activeTest.answers[qid] = parseInt(input.value, 10);
  });
}

function goToQuestion(idx) {
  currentTestIndex = idx;
  renderTestStep();
}

function stepQuestion(delta) {
  const next = currentTestIndex + delta;
  if (next >= 0 && next < state.activeTest.questions.length) {
    currentTestIndex = next;
    renderTestStep();
  }
}

async function finishTest(auto) {
  if (!state.activeTest) return;
  // Сначала фиксируем отмеченный вариант текущего (в т.ч. последнего) вопроса,
  // и только потом спрашиваем подтверждение.
  syncAnswersFromDom();

  if (!auto) {
    const unanswered = state.activeTest.questions.filter(
      (q) => state.activeTest.answers[answerKey(q)] === undefined
    ).length;
    const question = unanswered
      ? `Без ответа осталось вопросов: ${unanswered}. Всё равно завершить тест?`
      : 'Вы уверены, что хотите завершить тест?';
    if (!confirm(question)) return;
  }

  clearInterval(state.timerInterval);
  clearInterval(state.testTimer);

  document.removeEventListener('visibilitychange', onTestVisibilityChange);
  const res = await api.submitTest(state.activeTest.id, state.activeTest.answers, state.activeTest.violations || 0);
  document.getElementById('testRunModal').classList.add('hidden');
  document.body.style.overflow = '';
  const prefix = auto ? 'Время вышло. ' : '';
  alert(res.passed ? `${prefix}Поздравляем! Тест сдан (${res.scorePercent}%)` : `${prefix}К сожалению, тест не сдан (${res.scorePercent}%)`);
  state.activeTest = null;
  loadMyTests();
}

async function saveSettingsForm(e) {
  e.preventDefault();
  // Поля лежат на разных подвкладках, поэтому браузерное «required» не подходит (скрытое поле не проверяется) — проверяем сами.
  if (!document.getElementById('setComp').value.trim()) { showSettingsTab('org'); alert('Укажите наименование организации.'); document.getElementById('setComp').focus(); return; }
  if (!document.getElementById('setChair1Name').value.trim()) { showSettingsTab('commission'); alert('Укажите ФИО председателя комиссии 1.'); document.getElementById('setChair1Name').focus(); return; }
  await api.saveSettings({
    company_name: document.getElementById('setComp').value.trim(),
    chairman1_name: document.getElementById('setChair1Name').value.trim(),
    chairman1_position: document.getElementById('setChair1Pos').value.trim(),
    chairman2_name: document.getElementById('setChair2Name').value.trim(),
    chairman2_position: document.getElementById('setChair2Pos').value.trim(),
    active_chairman: (document.querySelector('input[name="activeChairman"]:checked') || {}).value || '1',
    certificate_prefix: document.getElementById('setCertPrefix').value.trim(),
    certificate_digits: document.getElementById('setCertDigits').value,
    certificate_next_number: document.getElementById('setCertNext').value,
    tagline_kz: document.getElementById('setTaglineKz').value,
    tagline_ru: document.getElementById('setTaglineRu').value,
    tagline_en: document.getElementById('setTaglineEn').value
  });
  // Обновляем название компании в шапке/логине сразу, без перезагрузки страницы
  PUBLIC_SETTINGS.company_name = document.getElementById('setComp').value.trim();
  alert('Настройки успешно сохранены!');
  render();
}

async function uploadBrandingFile(kind) {
  const input = document.getElementById('set_' + kind + '_file');
  const file = input.files[0];
  if (!file) { alert('Выберите файл.'); return; }
  const statusEl = document.getElementById('set_' + kind + '_status');
  try {
    if (statusEl) statusEl.textContent = 'Загрузка...';
    const fd = new FormData();
    fd.append('file', file);
    const res = await api.req('/api/settings/' + kind, { method: 'POST', body: fd });
    const pathField = { logo: 'logo_path', stamp: 'stamp_path' };
    if (statusEl) statusEl.innerHTML = `Загружено: <a href="${res[pathField[kind]]}" target="_blank" class="text-blue-600 underline">открыть</a>`;
    if (kind === 'logo') {
      // Логотип теперь должен отображаться и в шапке сайта, и на экране входа
      PUBLIC_SETTINGS.logo_path = res.logo_path;
      render();
    }
  } catch (e) {
    if (statusEl) statusEl.textContent = '';
    alert('Не удалось загрузить файл: ' + e.message);
  }
}

const mbState = { rows: [], stats: null, status: '', q: '' };

function renderMedbookPanel(panelDiv) {
  const s = mbState.stats || { total: 0, valid: 0, soon: 0, overdue: 0, no_date: 0 };
  const kpi = (label, value, cls, status) => `
    <div onclick="mbSetStatus('${status}')" class="border rounded-lg p-3 flex flex-col cursor-pointer hover:bg-slate-50 ${mbState.status === status ? 'border-blue-500 ring-1 ring-blue-300' : 'border-slate-200'}">
      <div class="text-[11px] font-bold text-slate-500 uppercase leading-tight min-h-[2.4em] flex items-start">${esc(label)}</div>
      <div class="text-xl font-black mt-1 tabular-nums ${cls}">${value}</div>
    </div>`;
  const q = mbState.q.trim().toLowerCase();
  const rows = mbState.rows.filter(e => (!mbState.status || e.status === mbState.status)
    && (!q || `${e.last_name} ${e.first_name} ${e.position}`.toLowerCase().includes(q)));
  const order = { overdue: 0, soon: 1, no_date: 2, valid: 3 };
  rows.sort((a, b) => (order[a.status] - order[b.status]) || ((a.days_left ?? 1e9) - (b.days_left ?? 1e9)) || a.last_name.localeCompare(b.last_name, 'ru'));
  const canConfig = !isObserverUser();

}
function mbSetStatus(v) { mbState.status = mbState.status === v ? '' : v; renderDashCoursePanel(); }
function mbSetQuery(v) {
  mbState.q = v;
  const pos = document.getElementById('mbSearch') ? document.getElementById('mbSearch').selectionStart : null;
  renderDashCoursePanel();
  const el = document.getElementById('mbSearch');
  if (el) { el.focus(); if (pos != null) try { el.setSelectionRange(pos, pos); } catch (e) {} }
}

// ---- модальные окна ----
function mbModal(html) {
  let m = document.getElementById('mbModal');
  if (!m) {
    m = document.createElement('div');
    m.id = 'mbModal';
    m.className = 'fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-[110]';
    m.onclick = ev => { if (ev.target === m) mbCloseModal(); };
    document.body.appendChild(m);
  }
  m.innerHTML = `<div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-5">${html}</div>`;
}
function mbCloseModal() { const m = document.getElementById('mbModal'); if (m) m.remove(); }
function mbAfterChange() {
  mbCloseModal();
  if (state.tab === 'user_profile' && state.profileUserId) loadUserProfile(state.profileUserId);
  if (document.getElementById('dashCourseTabs')) mbReload();
}

// Форма «дата начала книжки» для сотрудника

    const name = `${u.last_name || ''} ${u.first_name || ''}`.trim();
    const today = new Date().toISOString().slice(0, 10);
    const fixed = e.applicable && e.required;
    const period = e.applicable ? e.period_months : 12;
    mbModal(`
      <div class="flex justify-between items-start mb-1">
        <h3 class="text-base font-bold text-slate-900">🩺 ${_L('Личная медицинская книжка', 'Жеке медициналық кітапша')}</h3>
        <button onclick="mbCloseModal()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
      </div>
      <p class="text-sm text-slate-700 font-semibold">${esc(name)}</p>
      <p class="text-xs text-slate-500 mb-4">${esc(posLabel(u.position) || '—')} · ${esc(u.object || '—')} / ${esc(u.department || '—')}</p>

        <div>
          <label class="text-xs font-semibold text-slate-600">${_L('Дата начала книжки', 'Кітапша басталған күні')}</label>
          <input type="date" id="mbStart" required max="${today}" value="${esc((e.applicable && e.start_date) || '')}" class="w-full border p-2 rounded text-sm">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">${_L('Напоминание', 'Еске салу')}</label>
          ${fixed
            ? `<div class="text-sm border rounded p-2 bg-slate-50">${esc(mbPeriodText(period))} <span class="text-xs text-slate-400">· ${_L('задано для должности', 'лауазымға тағайындалған')}</span></div>`
            : `<div class="flex gap-4 text-sm pt-1">
                <label class="flex items-center gap-1.5"><input type="radio" name="mbPeriod" value="6" ${period === 6 ? 'checked' : ''}> ${_L('Полугодичное (6 мес.)', 'Жарты жылдық (6 ай)')}</label>
                <label class="flex items-center gap-1.5"><input type="radio" name="mbPeriod" value="12" ${period !== 6 ? 'checked' : ''}> ${_L('Годичное (12 мес.)', 'Жылдық (12 ай)')}</label>
              </div>
              <p class="text-[11px] text-slate-400 mt-1">${_L('Для этой должности книжка не обязательна — сотрудник добавлен вручную.', 'Бұл лауазымға кітапша міндетті емес — қызметкер қолмен қосылған.')}</p>`}
        </div>
        <p id="mbFormMsg" class="text-xs text-red-600"></p>
        <div class="flex justify-end gap-2 pt-3 border-t">
          <button type="button" onclick="mbCloseModal()" class="px-4 py-2 border rounded-lg text-sm">${_L('Отмена', 'Бас тарту')}</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg text-sm">${_L('Сохранить', 'Сақтау')}</button>

  } catch (err) { mbModal(`<p class="text-sm text-red-600">${esc(err.message)}</p><div class="text-right mt-3"><button onclick="mbCloseModal()" class="px-4 py-2 border rounded-lg text-sm">OK</button></div>`); }
}
async function mbSubmitForm(ev, userId) {
  ev.preventDefault();
  const radio = document.querySelector('input[name="mbPeriod"]:checked');
  try {
    await api.req('/api/medbooks/user/' + userId, { method: 'PUT', body: { start_date: document.getElementById('mbStart').value, period_months: radio ? Number(radio.value) : undefined } });
    mbAfterChange();
  } catch (err) { const el = document.getElementById('mbFormMsg'); if (el) el.textContent = err.message; }
}
async function mbRemove(userId, manual) {
  const msg = manual ? _L('Убрать мед. книжку у этого сотрудника?', 'Осы қызметкерден медициналық кітапшаны алып тастау керек пе?') : _L('Сбросить дату книжки?', 'Кітапша күнін тастау керек пе?');
  if (!confirm(msg)) return;
  try { await api.req('/api/medbooks/user/' + userId, { method: 'DELETE' }); mbAfterChange(); }
  catch (err) { alert(err.message); }
}

    </div>
    <p class="text-xs text-slate-500 mb-3">${_L('Для тех, у кого должность не входит в список, но книжка есть. Выберите сотрудника, затем укажите дату начала и период.', 'Лауазымы тізімде жоқ, бірақ кітапшасы бар қызметкерлер үшін. Қызметкерді таңдап, басталу күні мен мерзімін көрсетіңіз.')}</p>
    <input id="mbAddQ" oninput="mbAddSearch(this.value)" placeholder="${esc(_L('Начните вводить ФИО', 'Аты-жөнін енгізіңіз'))}" class="w-full border p-2 rounded text-sm" autofocus>

}
function mbAddSearch(v) {
  clearTimeout(mbSearchTimer);
  const box = document.getElementById('mbAddList');
  if (v.trim().length < 2) { box.innerHTML = `<div class="p-3 text-slate-400 text-xs">${_L('Введите минимум 2 буквы', 'Кемінде 2 әріп енгізіңіз')}</div>`; return; }

    try {
      const list = await api.getUsers({ q: v.trim() });
