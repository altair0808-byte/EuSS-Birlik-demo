// Заполняет select значениями справочника; если у сотрудника уже стоит значение,
// которого в справочнике ещё нет (старые данные / значение удалили из списка),
// добавляем его отдельным пунктом — иначе оно потеряется при сохранении карточки.
function fillDictionarySelect(selectId, values, current, placeholder) {
  const sel = document.getElementById(selectId);
  if (!sel) return;
  const list = [...values];
  if (current && !list.includes(current)) list.unshift(current);
  sel.innerHTML = `<option value="">${esc(placeholder || '— не выбрано —')}</option>` + list.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  sel.value = current || '';
}

// То же самое, но для двуязычного справочника «Должность» ({ru, kz} на запись):
// значение (value) сотрудника всегда сохраняется по-русски (канонический текст,
// используется в фильтрах/экспорте), а подпись в выпадающем списке показывается
// на текущем языке интерфейса — как и во всём остальном приложении.
function fillPositionSelect(selectId, positions, current, placeholder) {
  const sel = document.getElementById(selectId);
  if (!sel) return;
  const list = [...positions];
  if (current && !list.some(p => p.ru === current)) list.unshift({ ru: current, kz: '' });
  sel.innerHTML = `<option value="">${esc(placeholder || '— не выбрано —')}</option>`
    + list.map(p => `<option value="${esc(p.ru)}">${esc(CURRENT_LANG === 'kz' ? (p.kz || p.ru) : p.ru)}</option>`).join('');
  sel.value = current || '';
}

// --- Каскад «Объект → Отдел → Должность» в карточке сотрудника ---
const ORG_SELECT_IDS = {
  u: { object: 'uObject', department: 'uDept', position: 'uPos' },
  ae: { object: 'aeObject', department: 'aeDept', position: 'aePos' }
};

// Заполняет три выпадающих списка. cur — текущие значения. Если у сотрудника уже записано
// значение, которого нет в структуре (старые данные), оно остаётся отдельным пунктом,
// чтобы не потеряться при сохранении. Ассистент видит только свою зону.
function fillOrgSelects(prefix, cur = {}) {
  const ids = ORG_SELECT_IDS[prefix];
  const asObserver = isObserverUser();
  const zoneObjs = asObserver ? (state.user.assistant_objects || []) : [];
  const zoneDeps = asObserver ? (state.user.assistant_departments || []) : [];
  const objects = (state.dictionaries.objects || []).filter(o => !zoneObjs.length || zoneObjs.includes(o));
  fillDictionarySelect(ids.object, objects, cur.object || '');
  const object = (document.getElementById(ids.object) || {}).value || '';
  const departments = orgDepartmentsOf(object).filter(d => !zoneDeps.length || zoneDeps.includes(d));
  fillDictionarySelect(ids.department, departments, cur.department || '',
    object ? '— не выбрано —' : '— сначала выберите объект —');
  const department = (document.getElementById(ids.department) || {}).value || '';
  fillPositionSelect(ids.position, orgPositionsOf(object, department), cur.position || '',
    department ? '— не выбрано —' : '— сначала выберите отдел —');
}

// Смена объекта сбрасывает отдел и должность, смена отдела — только должность.
function onOrgSelectChange(prefix, level) {
  const ids = ORG_SELECT_IDS[prefix];
  const val = id => (document.getElementById(id) || {}).value || '';
  if (level === 'object') fillOrgSelects(prefix, { object: val(ids.object) });
  else fillOrgSelects(prefix, { object: val(ids.object), department: val(ids.department) });
}

async function openUserModal(u = null, presetRole = null) {
  document.getElementById('userId').value = u ? u.id : '';
  document.getElementById('uLastName').value = u ? u.last_name : '';
  document.getElementById('uFirstName').value = u ? u.first_name : '';
  await loadDictionaries();
  // Ассистент выбирает объекты/отделы только из своей зоны (сервер это тоже проверяет).
  const asObserver = isObserverUser();
  const zoneObjs = asObserver ? (state.user.assistant_objects || []) : [];
  const zoneDeps = asObserver ? (state.user.assistant_departments || []) : [];
  fillOrgSelects('u', u
    ? { object: u.object || '', department: u.department || '', position: u.position || '' }
    : { object: zoneObjs.length === 1 ? zoneObjs[0] : '', department: zoneDeps.length === 1 ? zoneDeps[0] : '', position: '' });
  // Поля доступа (логин/пароль, № сертификата, комиссия) и «+» в справочниках — не для ассистента
  document.querySelectorAll('#userModal [data-staff-only], #userModal .dict-add-btn').forEach(el => el.classList.toggle('hidden', asObserver));
  document.getElementById('uLogin').value = u ? u.login : '';
  document.getElementById('uPass').value = '';
  document.getElementById('uCertNumber').value = u ? (u.permanent_certificate_number || '') : '';
  document.getElementById('uTcoBadge').value = u ? (u.tco_badge || '') : '';
  document.getElementById('uIin').value = u ? (u.iin || '') : '';
  document.getElementById('uCategory').value = u ? (u.staff_category || 'employee') : 'employee';
  document.getElementById('uHireDate').value = u ? (u.hire_date || '') : '';
  document.getElementById('uRole').value = u ? u.role : (presetRole || (state.tab === 'admins' ? 'admin' : 'employee'));
  const committeeSel = document.getElementById('uCommitteeRole');
  if (committeeSel) committeeSel.value = u ? (u.committee_role || '') : '';
  const roleWrapper = document.getElementById('roleFieldWrapper');
  if (roleWrapper) {
    if (state.user && state.user.role === 'superadmin') {
      roleWrapper.classList.remove('hidden');
    } else {
      roleWrapper.classList.add('hidden');
    }
  }
  renderAssistantZoneCheckboxes(u ? (u.assistant_objects || []) : [], u ? (u.assistant_departments || []) : []);
  onUserRoleFieldChange();
  const roleForTitle = u ? u.role : document.getElementById('uRole').value;
  document.getElementById('userModalTitle').textContent = state.tab === 'admins'
    ? (roleForTitle === 'assistant'
        ? (u ? _L('Редактировать ассистента', 'Ассистентті өзгерту') : _L('Добавить ассистента', 'Ассистент қосу'))
        : (u ? _L('Редактировать администратора', 'Әкімшіні өзгерту') : _L('Добавить администратора', 'Әкімші қосу')))
    : (u ? 'Редактировать сотрудника' : 'Добавить сотрудника');
  document.getElementById('userModal').classList.remove('hidden');
}

// Блок «Доступная зона» (объекты/отделы) в карточке сотрудника — показывается только когда
// выбрана роль «Ассистент» (видно только суперадмину, т.к. и весь блок роли виден только ему).
function renderAssistantZoneCheckboxes(selectedObjects, selectedDepartments) {
  const objBox = document.getElementById('uAssistantObjects');
  const depBox = document.getElementById('uAssistantDepartments');
  if (!objBox || !depBox) return;
  const uniq = arr => [...new Set(arr.filter(Boolean))];
  const objects = uniq([...((state.dictionaries && state.dictionaries.objects) || []), ...((state.meta && state.meta.objects) || [])]);
  const departments = uniq([...((state.dictionaries && state.dictionaries.departments) || []), ...((state.meta && state.meta.departments) || [])]);
  const row = (val, checked) => `<label class="flex items-center gap-1.5"><input type="checkbox" class="rounded text-blue-600" value="${esc(val)}" ${checked ? 'checked' : ''}><span class="truncate">${esc(val)}</span></label>`;
  objBox.innerHTML = objects.length ? objects.map(o => row(o, selectedObjects.includes(o))).join('') : '<div class="text-[11px] text-slate-400">нет данных</div>';
  depBox.innerHTML = departments.length ? departments.map(d => row(d, selectedDepartments.includes(d))).join('') : '<div class="text-[11px] text-slate-400">нет данных</div>';
}

function onUserRoleFieldChange() {
  const roleSel = document.getElementById('uRole');
  const wrapper = document.getElementById('assistantZoneWrapper');
  if (!roleSel || !wrapper) return;
  wrapper.classList.toggle('hidden', roleSel.value !== 'assistant');
  // Категория и дата начала работы — только для сотрудников (не для админов/ассистентов) и не для ассистента-редактора
  const sf = document.getElementById('staffFieldsWrapper');

}

// Быстрое добавление значения в структуру прямо из карточки сотрудника, без похода во
// вкладку «Настройки» — сохраняется сразу на сервере:
//  объект — в общий список объектов; отдел — в выбранный объект; должность — в выбранный
//  отдел (если такой должности нет в общем справочнике, она создаётся).
async function quickAddOrgValue(kind, prefix) {
  const ids = ORG_SELECT_IDS[prefix];
  const val = id => (document.getElementById(id) || {}).value || '';
  const object = val(ids.object);
  const department = val(ids.department);
  if (kind === 'department' && !object) { alert('Сначала выберите объект — отдел добавляется в выбранный объект.'); return; }
  if (kind === 'position' && (!object || !department)) { alert('Сначала выберите объект и отдел — должность добавляется в выбранный отдел.'); return; }
  const label = { object: 'объекта', department: 'отдела', position: 'должности' }[kind];
  const value = (prompt(`Название нового ${label}${kind === 'position' ? ' (русский)' : ''}:`) || '').trim();
  if (!value) return;
  let kzValue = '';
  if (kind === 'position') {
    kzValue = (prompt('То же самое на казахском (можно оставить пустым — впишете позже в «Настройках»):') || '').trim();
  }
  await loadDictionaries();
  const next = cloneDictionaries();
  if (kind === 'object') {
    if (!next.objects.includes(value)) next.objects.push(value);
  } else if (kind === 'department') {
    const o = next.structure.find(x => x.object === object);
    if (o && !o.departments.some(d => d.name === value)) o.departments.push({ name: value, positions: [] });
  } else {
    if (!next.positions.some(p => p.ru === value)) next.positions.push({ ru: value, kz: kzValue });
    const d = (next.structure.find(x => x.object === object) || { departments: [] }).departments.find(x => x.name === department);
    if (d && !d.positions.includes(value)) d.positions.push(value);
  }
  try {
    setDictionaries(await api.saveDictionaries(next));
  } catch (e) {
    alert('Не удалось сохранить: ' + (e.message || 'ошибка сервера'));
    return;
  }
  fillOrgSelects(prefix, {
    object: kind === 'object' ? value : object,
    department: kind === 'department' ? value : (kind === 'position' ? department : ''),
    position: kind === 'position' ? value : ''
  });
}

// Копия справочников для изменения перед сохранением на сервере.
function cloneDictionaries() {
  const d = state.dictionaries || {};
  return JSON.parse(JSON.stringify({
    objects: d.objects || [],
    positions: d.positions || [],
    structure: d.structure || []
  }));
}

async function saveUserForm(e) {
  e.preventDefault();
  const id = document.getElementById('userId').value;
  const data = {
    last_name: document.getElementById('uLastName').value.trim(),
    first_name: document.getElementById('uFirstName').value.trim(),
    object: document.getElementById('uObject').value.trim(),
    department: document.getElementById('uDept').value.trim(),
    position: document.getElementById('uPos').value.trim(),
    login: document.getElementById('uLogin').value.trim(),
    role: document.getElementById('uRole').value,
    permanent_certificate_number: document.getElementById('uCertNumber').value.trim(),
    tco_badge: document.getElementById('uTcoBadge').value.trim(),
    iin: document.getElementById('uIin') ? document.getElementById('uIin').value.trim() : '',
    committee_role: document.getElementById('uCommitteeRole') ? document.getElementById('uCommitteeRole').value : '',
    staff_category: document.getElementById('uCategory') ? document.getElementById('uCategory').value : 'employee',
    hire_date: document.getElementById('uHireDate') ? (document.getElementById('uHireDate').value || '') : ''
  };
  if (data.role !== 'employee') { delete data.staff_category; delete data.hire_date; }
  if (isObserverUser()) {
    // сервер всё равно игнорирует эти поля для ассистента; не шлём, чтобы не затирать значения
    ['login', 'role', 'permanent_certificate_number', 'committee_role', 'staff_category', 'hire_date'].forEach(k => delete data[k]);
  }
  if (data.role === 'assistant') {
    data.assistant_objects = Array.from(document.querySelectorAll('#uAssistantObjects input:checked')).map(el => el.value);
    data.assistant_departments = Array.from(document.querySelectorAll('#uAssistantDepartments input:checked')).map(el => el.value);
  } else {
    data.assistant_objects = [];
    data.assistant_departments = [];
  }
  if (isObserverUser()) { delete data.assistant_objects; delete data.assistant_departments; }
  const pass = document.getElementById('uPass').value;
  if (pass) data.password = pass;
  if (data.login && !pass && !id) {
    alert('При указании логина укажите и пароль.');
    return;
  }
  const btn = e.target.querySelector('button[type=submit]');
  if (btn) btn.disabled = true;
  try {
    await api.saveUser(data, id);
  } catch (err) {
    if (await handleDuplicateError(err, {
      close: closeUserModal,
      resend: async () => { await api.saveUser({ ...data, confirm_not_duplicate: true }, id); closeUserModal(); loadUsersList(); }
    })) { if (btn) btn.disabled = false; return; }
    // раньше ошибка сервера терялась молча — окно оставалось открытым и «кнопка не работала»
    const map = {
      login_taken: 'Такой логин уже занят',
      password_required: 'При указании логина укажите и пароль',
      missing_fields: 'Укажите фамилию и имя',
      forbidden_role: 'Недостаточно прав для назначения этой роли',
      forbidden: 'Недостаточно прав',
      invalid_committee_role: 'Недопустимая роль в комиссии',
      invalid_iin: 'ИИН должен состоять ровно из 12 цифр',
      out_of_zone: 'Этот объект/отдел вне вашей зоны доступа',
      zone_required: 'Выберите объект и отдел из вашей зоны доступа',
      duplicate_employee: 'Сотрудник с таким ФИО уже есть в системе'
    };
    alert('Не удалось сохранить сотрудника: ' + (map[err.message] || err.message || 'ошибка сервера'));
    if (btn) btn.disabled = false;
    return;
  }
  if (btn) btn.disabled = false;
  closeUserModal();
  loadUsersList();
}

function sessFmtDate(d) {
  if (!d) return '—';
  const m = String(d).slice(0, 10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}.${m[2]}.${m[1]}` : esc(d);
}
function sessKindBadge(kind) {
  const k = kind || 'internal';
  return `<span class="inline-block px-2 py-0.5 rounded-full text-[11px] font-semibold ${SESSION_KIND_BADGE[k] || ''}">${esc(SESSION_KIND_LABEL[k] || k)}</span>`;

}
function sessErr(e) { alert(e && e.message ? e.message : 'Ошибка запроса'); }

function renderSessionsTab(container) {

      </div>
      <p class="text-xs text-slate-500 mb-4">Запишите сразу много сотрудников на курс, а после занятия одной кнопкой отметьте всех, кто прошёл.
        Для курса «без протокола» ничего, кроме даты, вводить не нужно — удостоверение не выпускается, но курс виден по QR и в статистике.</p>
      <div id="sessionsBody"><div class="text-slate-400 text-sm">Загрузка…</div></div>
    </div>`;
  if (st.view === 'dashboard') return sessionsLoadDashboard();
  if (st.view === 'detail' && st.detail) return sessionsRenderDetail();
  st.view = 'list';
  return sessionsLoadList();
}
function sessionsSetView(v) { sessionsState.view = v; sessionsState.selected = new Set(); renderSessionsTab(document.getElementById('tabContent')); }

// ---------- список заявок ----------

  const st = sessionsState;

  try {
    const qs = new URLSearchParams();
    if (st.status) qs.set('status', st.status);
    if (st.q) qs.set('q', st.q);
    st.list = await api.req('/api/training-sessions' + (qs.toString() ? '?' + qs : ''));
  } catch (e) { body.innerHTML = `<div class="text-red-600 text-sm">${esc(e.message)}</div>`; return; }
  const rows = st.list.map((x) => `
    <tr class="border-t hover:bg-slate-50 cursor-pointer" onclick="sessionsOpen(${x.id})">
      <td class="py-2 pr-3 whitespace-nowrap">${sessFmtDate(x.status === 'completed' ? x.test_date : x.planned_date)}</td>
      <td class="py-2 pr-3"><div class="font-semibold text-slate-900">${esc(x.course_title)}</div>${x.title ? `<div class="text-xs text-slate-500">${esc(x.title)}</div>` : ''}</td>

      <select onchange="sessionsState.status=this.value;sessionsLoadList()" class="border rounded-lg px-2 py-1.5 text-sm">
        <option value="" ${!st.status ? 'selected' : ''}>Все заявки</option>
        <option value="planned" ${st.status === 'planned' ? 'selected' : ''}>Запланированы</option>
        <option value="completed" ${st.status === 'completed' ? 'selected' : ''}>Проведены</option>
      </select>
      <input type="text" value="${esc(st.q)}" placeholder="Поиск по курсу, названию, протоколу" onkeydown="if(event.key==='Enter'){sessionsState.q=this.value;sessionsLoadList()}" class="border rounded-lg px-3 py-1.5 text-sm w-72">
      <div class="flex-1"></div>
      <button onclick="sessionsOpenCreate()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">+ Новая группа</button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left rt">
        <thead class="text-xs text-slate-500 uppercase"><tr>
          <th class="py-2 pr-3">Дата</th><th class="py-2 pr-3">Курс</th><th class="py-2 pr-3">Вид</th>
          <th class="py-2 pr-3 text-right">Записано</th><th class="py-2 pr-3 text-right">Присутствовало</th><th class="py-2 pr-3">Статус</th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="py-6 text-center text-slate-400">Заявок пока нет. Нажмите «+ Новая группа».</td></tr>'}</tbody>
      </table>
    </div>`;
}

async function sessionsEnsureCourses() {
  if (!sessionsState.courses) sessionsState.courses = await api.getCourses({});
  return sessionsState.courses;
}

// ---------- создание ----------

async function sessionsCreate() {

  try {
    const r = await api.req('/api/training-sessions', { method: 'POST', body: {

function sessionsToggleSel(uid, on) { on ? sessionsState.selected.add(uid) : sessionsState.selected.delete(uid); sessionsRenderDetail(); }
function sessionsToggleAll(on) {
  const st = sessionsState;
  st.selected = on ? new Set(st.detail.members.map((m) => m.user_id)) : new Set();
  sessionsRenderDetail();
}
async function sessionsMark(attended, all = false) {
  const st = sessionsState, d = st.detail;
  if (!all && !st.selected.size) return alert('Отметьте галочками сотрудников в списке');
  try {
    await api.req(`/api/training-sessions/${d.id}/members`, { method: 'PATCH', body: all ? { all: true, attended } : { user_ids: [...st.selected], attended } });
    await sessionsReloadDetail();
  } catch (e) { sessErr(e); }
}
async function sessionsRemoveSelected() {
  const st = sessionsState, d = st.detail;
  if (!st.selected.size) return alert('Отметьте галочками сотрудников в списке');
  const closed = d.status === 'completed';
  if (!confirm(`Убрать из заявки: ${st.selected.size} чел.?` + (closed ? ' У них будет удалена внесённая запись о прохождении.' : ''))) return;
  try {
    for (const uid of [...st.selected]) await api.req(`/api/training-sessions/${d.id}/members/${uid}`, { method: 'DELETE' });
    st.selected = new Set();
    await sessionsReloadDetail();
  } catch (e) { sessErr(e); await sessionsReloadDetail(); }
}
async function sessionsDelete() {
  const d = sessionsState.detail;
  if (!confirm('Удалить заявку? Записи обучения у сотрудников не создавались, поэтому ничего не пропадёт.')) return;
  try { await api.req('/api/training-sessions/' + d.id, { method: 'DELETE' }); sessionsState.detail = null; sessionsSetView('list'); } catch (e) { sessErr(e); }
}
async function sessionsReopen() {
  const d = sessionsState.detail;
  if (!confirm('Откатить закрытие? Все записи о прохождении, созданные этой заявкой, будут удалены.')) return;
  try { const r = await api.req(`/api/training-sessions/${d.id}/reopen`, { method: 'POST' }); alert('Удалено записей: ' + r.deleted); await sessionsReloadDetail(); } catch (e) { sessErr(e); }
}

// ---------- закрыть заявку (массово «прошли») ----------
let scNextManual = false;   // «Следующее прохождение» правили вручную (или оно уже было сохранено в заявке) — не затираем
async function sessionsOpenComplete() {
  const d = sessionsState.detail;
  const attended = d.members.filter((m) => m.attended).length;
  if (!attended) return alert('Сначала отметьте присутствующих (кнопка «Отметить ВСЕХ присутствующими» или галочки + «Отметить выбранных»).');
  const kind = d.course_kind || 'internal';
  const absent = d.members.length - attended;
  // Срок курса нужен, чтобы предзаполнить «Следующее прохождение»; если курсы не загрузились — работаем как раньше (посчитает сервер)
  let sessCourse = null;
  try { sessCourse = (await sessionsEnsureCourses()).find((c) => String(c.id) === String(d.course_id)) || null; } catch (e) { /* не критично */ }
  sessCompleteCourse = sessCourse;
  scNextManual = !!d.next_test_date;
  const term = courseTermInfo(sessCourse);
  const protoField = kind === 'no_protocol' ? '' : `
    <label class="block text-xs font-semibold text-slate-600 mb-1">${kind === 'internal' ? '№ протокола *' : '№ протокола другой организации (необязательно)'}</label>
    <input id="scProto" type="text" value="${esc(d.protocol_number || '')}" class="w-full border rounded-lg px-3 py-2 text-sm mb-3">
    ${kind === 'internal' ? `<label class="block text-xs font-semibold text-slate-600 mb-1">Дата протокола (если пусто — дата прохождения)</label>
    <input id="scProtoDate" type="date" value="${esc(d.protocol_date || '')}" class="w-full border rounded-lg px-3 py-2 text-sm mb-3">` : ''}`;
  sessionsModalShell('sessCompleteModal', `
    <h3 class="text-lg font-bold mb-1">Внести прохождение</h3>
    <p class="text-sm text-slate-600 mb-3">Будет отмечено «прошли»: <b>${attended}</b> чел.${absent ? ` Не присутствовали (${absent}) — запись им не вносится.` : ''}</p>
    <label class="block text-xs font-semibold text-slate-600 mb-1">Дата прохождения *</label>
    <input id="scDate" type="date" oninput="sessionsUpdateNext()" value="${esc(d.test_date || d.planned_date || '')}" class="w-full border rounded-lg px-3 py-2 text-sm mb-3">
    ${protoField}
    ${term.noExpiry ? `<div class="text-xs text-slate-600 mb-3"><b>Следующее прохождение:</b> бессрочно — даты нет.</div>` : `
    <label class="block text-xs font-semibold text-slate-600 mb-1">Следующее прохождение (если пусто — по сроку действия курса)</label>
    <input id="scNext" type="date" oninput="sessionsNextInput()" value="${esc(d.next_test_date || '')}" class="w-full border rounded-lg px-3 py-2 text-sm">
    <p id="scNextHint" class="text-[11px] text-slate-500 mt-1 mb-3"></p>`}
    <label class="block text-xs font-semibold text-slate-600 mb-1">Результат, % (необязательно)</label>
    <input id="scScore" type="number" min="0" max="100" value="${d.score_percent == null ? '' : esc(d.score_percent)}" class="w-full border rounded-lg px-3 py-2 text-sm mb-4">
    <div class="flex justify-end gap-2">
      <button onclick="sessionsCloseModal('sessCompleteModal')" class="px-4 py-2 text-sm rounded-lg bg-slate-100">Отмена</button>
      <button id="scBtn" onclick="sessionsComplete()" class="px-4 py-2 text-sm rounded-lg bg-emerald-600 text-white font-semibold">Внести прохождение (${attended})</button>
    </div>`);
  sessionsUpdateNext();
}
let sessCompleteCourse = null;
function sessionsNextInput() {
  const el = document.getElementById('scNext');
  scNextManual = !!(el && el.value);
  sessionsUpdateNext();
}
// Предзаполнение «Следующего прохождения» по сроку курса (при смене даты прохождения, пока поле не правили вручную)
function sessionsUpdateNext() {
  const nextEl = document.getElementById('scNext'), hint = document.getElementById('scNextHint');
  if (!nextEl || !hint) return;
  const term = courseTermInfo(sessCompleteCourse);
  if (term.months === null) { hint.textContent = ''; return; }
  const auto = addMonthsISO((document.getElementById('scDate') || {}).value, term.months);
  if (!scNextManual) nextEl.value = auto;
  hint.textContent = scNextManual
    ? `Срок курса: ${term.months} мес. — дата изменена вручную`
    : (auto ? `Срок курса: ${term.months} мес. — дата рассчитана автоматически` : `Срок курса: ${term.months} мес. — дата рассчитается после ввода даты прохождения`);
}

async function sessionsComplete() {
  const d = sessionsState.detail;
  const val = (id) => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const body = { test_date: val('scDate'), next_test_date: val('scNext'), score_percent: val('scScore') };
  // Бессрочный курс: поля нет — явно шлём пустое значение, чтобы не подтянулась старая дата из заявки
  if (courseTermInfo(sessCompleteCourse).noExpiry) body.next_test_date = '';
  else if (!body.next_test_date) body.next_test_date = asNextDateFromTerm(body.test_date, sessCompleteCourse) || body.next_test_date;
  if (val('scProto') !== undefined) body.protocol_number = val('scProto');
  if (val('scProtoDate') !== undefined) body.protocol_date = val('scProtoDate');
  const btn = document.getElementById('scBtn'); if (btn) btn.disabled = true;
  try {
    const r = await api.req(`/api/training-sessions/${d.id}/complete`, { method: 'POST', body });
    sessionsCloseModal('sessCompleteModal');
    alert(`Готово. Внесено: ${r.created}` + (r.already_had ? `, уже было: ${r.already_had}` : '') + (r.documents_failed ? `. Не удалось выпустить документы у ${r.documents_failed} (можно повторить из карточки сотрудника)` : ''));
    await sessionsReloadDetail();
  } catch (e) { if (btn) btn.disabled = false; sessErr(e); }
}

// ---------- выбор сотрудников ----------
const SESS_EXPIRING_DAYS = 30;   // окно «истекает срок действия» в окне выбора сотрудников: сколько дней вперёд
const sessPick = { users: [], q: '', object: '', department: '', selected: new Set(), onShift: false, expiring: false, exp: new Map(), expLoaded: false };
async function sessionsOpenPicker() {
  sessPick.q = ''; sessPick.object = ''; sessPick.department = ''; sessPick.selected = new Set();
  sessPick.onShift = false; sessPick.expiring = false; sessPick.exp = new Map(); sessPick.expLoaded = false;
  if (!state.metaLoaded) { try { await refreshOrgMeta(); } catch (e) { /* список объектов не критичен */ } }
  sessionsModalShell('sessPickModal', '<div class="text-slate-400 text-sm">Загрузка…</div>', 'max-w-3xl');
  await sessionsPickLoad();
}
async function sessionsPickLoad() {
  const qs = new URLSearchParams();
  if (sessPick.object) qs.set('object', sessPick.object);
  if (sessPick.department) qs.set('department', sessPick.department);
  try { sessPick.users = await api.req('/api/users' + (qs.toString() ? '?' + qs : '')); } catch (e) { return sessErr(e); }
  // Просрочено / истекает по курсу этой заявки: последняя запись «сдал» по сотруднику с next_test_date в ближайшие N дней
  // (или уже в прошлом). Тот же эндпоинт, что и «Просрочено и скоро истекает» на главной; бессрочные курсы он не отдаёт.
  if (!sessPick.expLoaded) {
    try {
      const rows = await api.getExpiring(SESS_EXPIRING_DAYS, {});
      const cid = String((sessionsState.detail || {}).course_id);
      const m = new Map();
      (rows || []).forEach((a) => { if (String(a.course_id) === cid) m.set(Number(a.user_id), a.next_test_date); });
      sessPick.exp = m;
    } catch (e) { sessPick.exp = new Map(); }
    sessPick.expLoaded = true;
  }
  sessionsPickRender();
}
function sessPickDaysLeft(uid) {
  const d = sessPick.exp.get(Number(uid));
  return d ? Math.ceil((new Date(d) - new Date()) / 86400000) : null;
}
function sessionsPickFiltered() {
  const words = String(sessPick.q || '').toLowerCase().split(/\s+/).filter(Boolean);
  let list = sessPick.users;
  if (sessPick.onShift) list = list.filter((u) => u.rotation_status === 'on_shift');
  if (sessPick.expiring) list = list.filter((u) => sessPick.exp.has(Number(u.id)));
  if (!words.length) return list;
  return list.filter((u) => {
    const hay = `${u.last_name || ''} ${u.first_name || ''} ${u.login || ''} ${u.position || ''} ${u.department || ''}`.toLowerCase();
    return words.every((w) => hay.includes(w));
  });
}
function sessionsPickRender() {
  const af = document.activeElement;
  const keepFocus = af && af.id === 'spQ' ? [af.selectionStart, af.selectionEnd] : null;
  const d = sessionsState.detail;
  const inSession = new Set(d.members.map((m) => m.user_id));
  const meta = state.meta || {};
  const objOpts = ['<option value="">Все объекты</option>'].concat((meta.objects || []).map((o) => `<option ${sessPick.object === o ? 'selected' : ''}>${esc(o)}</option>`)).join('');
  const depOpts = ['<option value="">Все отделы</option>'].concat((meta.departments || []).map((o) => `<option ${sessPick.department === o ? 'selected' : ''}>${esc(o)}</option>`)).join('');
  const shown = sessionsPickFiltered();
  const free = shown.filter((u) => !inSession.has(u.id));
  // числа на кнопках — сколько человек попадёт, если включить именно этот фильтр (с учётом поиска и второго фильтра)
  const onShiftCount = (() => { const k = sessPick.onShift; sessPick.onShift = true; const n = sessionsPickFiltered().length; sessPick.onShift = k; return n; })();
  const expCount = (() => { const k = sessPick.expiring; sessPick.expiring = true; const n = sessionsPickFiltered().length; sessPick.expiring = k; return n; })();
  const rows = shown.map((u) => {
    const already = inSession.has(u.id);
    return `<label class="flex items-center gap-2 py-1.5 border-t ${already ? 'opacity-40' : 'cursor-pointer hover:bg-slate-50'}">
      <input type="checkbox" ${already ? 'disabled checked' : ''} ${sessPick.selected.has(u.id) ? 'checked' : ''} onchange="sessionsPickToggle(${u.id}, this.checked)">
      <span class="font-medium text-sm">${esc(u.last_name || '')} ${esc(u.first_name || '')}</span>
      <span class="text-xs text-slate-500">${esc(u.position || '')}${u.department ? ' · ' + esc(u.department) : ''}</span>
      ${u.rotation_status === 'on_shift' ? `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded ${rotBadgeClass('on_shift')}" title="${esc(rotStatusLabel('on_shift'))}">${ROT_ICON.on_shift}${u.rotation_days_left != null ? ' ' + esc(rotNoteText(u)) : ''}</span>` : ''}
      ${(() => { const dl = sessPickDaysLeft(u.id); if (dl == null) return ''; return dl < 0 ? `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-red-100 text-red-700">${_L('просрочено', 'мерзімі өткен')} ${Math.abs(dl)} ${_L('дн.', 'күн')}</span>` : `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-800">${dl === 0 ? _L('истекает сегодня', 'бүгін аяқталады') : _L('истекает через', 'аяқталуына') + ' ' + dl + ' ' + _L('дн.', 'күн')}</span>`; })()}
      ${already ? '<span class="ml-auto text-xs text-slate-400">уже в заявке</span>' : ''}
    </label>`;
  }).join('');
  sessionsModalShell('sessPickModal', `
    <div class="flex justify-between items-start mb-3"><h3 class="text-lg font-bold">Добавить сотрудников</h3>
      <button onclick="sessionsCloseModal('sessPickModal')" class="text-slate-400 hover:text-slate-700 text-xl leading-none">×</button></div>
    <div class="flex flex-wrap gap-2 mb-2">
      <input id="spQ" type="text" value="${esc(sessPick.q)}" placeholder="Поиск по ФИО / логину" oninput="sessPick.q=this.value;sessionsPickRender()" class="border rounded-lg px-3 py-1.5 text-sm flex-1 min-w-[160px]">
      <select onchange="sessPick.object=this.value;sessionsPickLoad()" class="border rounded-lg px-2 py-1.5 text-sm">${objOpts}</select>
      <select onchange="sessPick.department=this.value;sessionsPickLoad()" class="border rounded-lg px-2 py-1.5 text-sm">${depOpts}</select>
    </div>
    <div class="flex flex-wrap items-center gap-2 mb-2 text-xs">
      <button type="button" onclick="sessPick.onShift=!sessPick.onShift;sessionsPickRender()" class="px-3 py-1.5 rounded-full border font-bold ${sessPick.onShift ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-emerald-700 border-emerald-300 hover:bg-emerald-50'}">👷 ${_L('На вахте', 'Вахтада')} <span class="tabular-nums">${onShiftCount}</span></button>
      <button type="button" onclick="sessPick.expiring=!sessPick.expiring;sessionsPickRender()" title="${esc(_L('Срок действия курса уже истёк или истекает в ближайшие', 'Курс мерзімі өтті немесе жақын арада аяқталады') + ' ' + SESS_EXPIRING_DAYS + ' ' + _L('дн.', 'күн'))}" class="px-3 py-1.5 rounded-full border font-bold ${sessPick.expiring ? 'bg-red-600 text-white border-red-600' : 'bg-white text-red-700 border-red-300 hover:bg-red-50'}">⏰ ${_L('Просрочено и истекает', 'Мерзімі өткен және аяқталады')} <span class="tabular-nums">${expCount}</span></button>
    </div>
    <div class="flex flex-wrap items-center gap-2 mb-2 text-xs">
      <button onclick="sessionsPickAll()" class="px-3 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 font-semibold">Выбрать всех найденных (${free.length})</button>
      <button onclick="sessPick.selected=new Set();sessionsPickRender()" class="px-3 py-1 rounded-lg bg-slate-100 hover:bg-slate-200">Снять выбор</button>
      <span class="text-slate-500">Найдено: ${shown.length} · выбрано: <b>${sessPick.selected.size}</b></span>
    </div>
    <div class="max-h-[50vh] overflow-y-auto border rounded-lg px-3 mb-4">${rows || '<div class="py-6 text-center text-slate-400 text-sm">Никого не найдено</div>'}</div>
    <div class="flex justify-end gap-2">
      <button onclick="sessionsCloseModal('sessPickModal')" class="px-4 py-2 text-sm rounded-lg bg-slate-100">Отмена</button>
      <button onclick="sessionsPickApply()" class="px-4 py-2 text-sm rounded-lg bg-blue-600 text-white font-semibold">Добавить в заявку (${sessPick.selected.size})</button>
    </div>`, 'max-w-3xl');
  if (keepFocus) {
    const q = document.getElementById('spQ');
    if (q) { q.focus(); try { q.setSelectionRange(keepFocus[0], keepFocus[1]); } catch (e) {} }
  }
}
function sessionsPickToggle(uid, on) { on ? sessPick.selected.add(uid) : sessPick.selected.delete(uid); sessionsPickRender(); }
function sessionsPickAll() {
  const inSession = new Set(sessionsState.detail.members.map((m) => m.user_id));
  sessionsPickFiltered().forEach((u) => { if (!inSession.has(u.id)) sessPick.selected.add(u.id); });
  sessionsPickRender();
}
async function sessionsPickApply() {
  if (!sessPick.selected.size) return alert('Никого не выбрано');
  const d = sessionsState.detail;
  try {
    const r = await api.req(`/api/training-sessions/${d.id}/members`, { method: 'POST', body: { user_ids: [...sessPick.selected] } });
    sessionsCloseModal('sessPickModal');
    if (r.already) alert(`Добавлено: ${r.added}. Уже были в заявке: ${r.already}`);
    await sessionsReloadDetail();
  } catch (e) { sessErr(e); }
}

// ===================== МАССОВОЕ ОБНОВЛЕНИЕ ЧЕРЕЗ EXCEL =====================
// 1) «Выгрузить в Excel для обучения» — все сотрудники (с учётом фильтра объект/отдел, если он включён);

let bulkXlFile = null;

  }
  m.innerHTML = `
    <div class="bg-white rounded-xl shadow-2xl max-w-3xl w-full p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-start gap-3 mb-2">

// --- КАТЕГОРИИ КУРСОВ: единая систематизация обучения (список курсов, назначения, кабинет сотрудника) ---
const CAT_PALETTE = [
  { fg: '#1d4ed8', bg: '#eff6ff', bd: '#bfdbfe' },
  { fg: '#047857', bg: '#ecfdf5', bd: '#a7f3d0' },
  { fg: '#b45309', bg: '#fffbeb', bd: '#fde68a' },
  { fg: '#be123c', bg: '#fff1f2', bd: '#fecdd3' },
  { fg: '#6d28d9', bg: '#f5f3ff', bd: '#ddd6fe' },
  { fg: '#0e7490', bg: '#ecfeff', bd: '#a5f3fc' },
  { fg: '#c2410c', bg: '#fff7ed', bd: '#fed7aa' }
];
const CAT_NONE_COLOR = { fg: '#475569', bg: '#f1f5f9', bd: '#e2e8f0' };

// Ключ категории — русское название в нижнем регистре (если его нет — казахское). Пустая строка = без категории.
function catKeyOf(c) { return String((c && (c.category_ru || c.category_kz)) || '').trim().toLowerCase(); }
function catLabelOf(c) {
  const ru = String((c && c.category_ru) || '').trim();
  const kz = String((c && c.category_kz) || '').trim();
  return CURRENT_LANG === 'kz' ? (kz || ru) : (ru || kz);
}
// Цвет категории считается от её названия — поэтому одна и та же категория имеет один и тот же цвет на всех страницах
function catColorOf(key) {
  if (!key) return CAT_NONE_COLOR;
  let h = 0;
  for (const ch of key) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return CAT_PALETTE[h % CAT_PALETTE.length];
}
function catBadgeHtml(c) {
  const key = catKeyOf(c);
  if (!key) return '';
  const col = catColorOf(key);
  return `<span class="inline-block text-[11px] font-semibold px-2 py-0.5 rounded-full border" style="background:${col.bg};color:${col.fg};border-color:${col.bd}">${esc(catLabelOf(c))}</span>`;
}
// Группы: категории по алфавиту, «Без категории» всегда в конце
function groupCoursesByCategory(items) {
  const map = new Map();
  items.forEach(it => {
    const key = catKeyOf(it);
    if (!map.has(key)) map.set(key, { key, label: catLabelOf(it) || t('cat_none'), color: catColorOf(key), items: [] });
    map.get(key).items.push(it);
  });
  const loc = CURRENT_LANG === 'kz' ? 'kk' : 'ru';
  return [...map.values()].sort((a, b) => (!a.key - !b.key) || a.label.localeCompare(b.label, loc));
}
function courseTitleOf(c) { return (CURRENT_LANG === 'kz' ? c.title_kz : c.title_ru) || c.title_ru || c.title_kz || ''; }

// --- Просроченные на главной: список внизу переключается (Просрочено / Скоро истекает / Все)
// и сам фильтруется по выбранной категории или курсу в блоке «Статистика по курсам» ---
function expScopeIds() {
  if (dashExpAll) return null;
  if (dashSelectedCourseId) return new Set([String(dashSelectedCourseId)]);
  if (dashMainGroup) return new Set(dashGroupCourses(dashMainGroup).map(c => String(c.id)));
  return null;
}
function expScopeLabel() {
  if (dashExpAll) return '';
  if (dashSelectedCourseId) {
    const c = dashCourseStats.find(x => String(x.id) === String(dashSelectedCourseId));
    return c ? dashCourseTitle(c) : '';
  }
  return dashMainGroup ? dashGroupLabel(dashMainGroup) : '';
}
function expCounts() {
  const sc = expScopeIds();
  let o = 0, n = 0;
  expData.forEach(a => {
    if (sc && !sc.has(String(a.course_id))) return;
    if (expDaysLeft(a) < 0) o++; else n++;
  });
  return { o, n, all: o + n };
}
function expScopeChanged() {
  if (!document.getElementById('expiringList')) return;
  renderExpiringFilters();
  renderExpiringList();
}
function setExpStatus(v) { expState.status = v; expScopeChanged(); }
function clearExpScope() { dashExpAll = true; expScopeChanged(); }
// Клик по цифре «Просрочено»: kind = 'all' | 'group' | 'course'
function dashShowOverdue(kind, id) {
  expState.status = 'overdue';
  if (kind === 'all') { dashExpAll = true; dashSelectedCourseId = null; }
  else if (kind === 'group') { dashExpAll = false; dashMainGroup = id; dashSelectedCourseId = null; }
  else if (kind === 'course') {
    const c = dashCourseStats.find(x => String(x.id) === String(id));
    if (c) { dashExpAll = false; dashMainGroup = dashCourseGroup(c); dashSelectedCourseId = c.id; }
  }
  renderDashCourseTabs(); renderDashCoursePanel(); expScopeChanged();
  const el = document.getElementById('expiringBlock');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderCoursesList() {
  const div = document.getElementById('coursesList');
  if (!div) return;
  const all = state.courses || [];
  const q = (state.courseFilter.q || '').trim().toLowerCase();
  const found = q
    ? all.filter(c => `${c.title_ru} ${c.title_kz} ${c.category_ru || ''} ${c.category_kz || ''}`.toLowerCase().includes(q))
    : all;
  const groupsAll = groupCoursesByCategory(found);

  // Если выбранной категории больше нет (удалили/переименовали) — показываем все
  if (state.courseFilter.cat !== '*' && !groupsAll.some(g => g.key === state.courseFilter.cat)) state.courseFilter.cat = '*';
  const cur = state.courseFilter.cat;

  // Чипы категорий (быстрый фильтр). Если категорий нет вообще — чипы не нужны.
  const chips = document.getElementById('courseCatChips');
  const hasCategories = groupsAll.some(g => g.key);
  if (chips) {
    const chip = (key, label, n, col) => {
      const on = cur === key;
      const st = on ? `background:${col.fg};color:#fff;border-color:${col.fg}` : `background:${col.bg};color:${col.fg};border-color:${col.bd}`;
      return `<button type="button" data-key="${esc(key)}" onclick="setCourseCat(this.dataset.key)" class="px-3 py-1.5 rounded-full text-xs font-semibold border" style="${st}">${esc(label)} <span style="opacity:.7">${n}</span></button>`;
    };
    chips.innerHTML = hasCategories
      ? chip('*', t('cat_all'), found.length, { fg: '#1e293b', bg: '#ffffff', bd: '#cbd5e1' }) + groupsAll.map(g => chip(g.key, g.label, g.items.length, g.color)).join('')
      : '';
  }

  if (!all.length) {
    div.innerHTML = '<div class="p-8 text-center text-slate-500 border border-dashed rounded-xl">Курсов пока нет. Нажмите «+ Добавить курс», чтобы создать первый.</div>';
    return;
  }
  if (!found.length) {
    div.innerHTML = `<div class="p-6 text-center text-slate-400">${t('no_data')}</div>`;
    return;
  }

  const groups = cur === '*' ? groupsAll : groupsAll.filter(g => g.key === cur);
  const showHeaders = hasCategories;   // без категорий — плоский список, как раньше
  div.innerHTML = groups.map(g => {
    const collapsed = showHeaders && cur === '*' && state.collapsedCats.has(g.key);
    const cards = g.items.slice()
      .sort((a, b) => courseTitleOf(a).localeCompare(courseTitleOf(b), CURRENT_LANG === 'kz' ? 'kk' : 'ru'))
      .map(c => courseCardHtml(c, g.color)).join('');
    const header = showHeaders ? `
      <button type="button" data-key="${esc(g.key)}" onclick="toggleCourseCat(this.dataset.key)" class="w-full flex items-center gap-3 text-left mb-3 pb-2 border-b" style="border-color:${g.color.bd}">
        <span class="inline-block w-1.5 h-6 rounded-full" style="background:${g.color.fg}"></span>
        <span class="text-base font-bold text-slate-900">${esc(g.label)}</span>
        <span class="text-xs font-bold px-2 py-0.5 rounded-full" style="background:${g.color.bg};color:${g.color.fg}">${g.items.length}</span>
        <span class="ml-auto text-slate-400 text-xs">${collapsed ? '▸' : '▾'}</span>
      </button>` : '';
    return `<section>${header}${collapsed ? '' : `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${cards}</div>`}</section>`;
  }).join('');
}

// Стаж в компании: «2 года 3 месяца 5 дней» (по дате начала работы YYYY-MM-DD)
function tenureText(hireDate) {
  const m = String(hireDate || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return '';
  const now = new Date();
  const t = { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate() };
  const h = { y: +m[1], m: +m[2], d: +m[3] };
  if (Date.UTC(t.y, t.m - 1, t.d) < Date.UTC(h.y, h.m - 1, h.d)) return '';
  let years = t.y - h.y, months = t.m - h.m, days = t.d - h.d;
  if (days < 0) { months -= 1; days += new Date(t.y, t.m - 1, 0).getDate(); }
  if (months < 0) { years -= 1; months += 12; }
  const kz = CURRENT_LANG === 'kz';
  const plural = (n, one, few, many) => { const a = n % 100, b = n % 10; return (a > 10 && a < 20) ? many : (b > 1 && b < 5) ? few : b === 1 ? one : many; };
  const parts = [];
  if (kz) {
    if (years) parts.push(years + ' жыл');
    if (months) parts.push(months + ' ай');
    if (days || !parts.length) parts.push(days + ' күн');
  } else {
    if (years) parts.push(years + ' ' + plural(years, 'год', 'года', 'лет'));
    if (months) parts.push(months + ' ' + plural(months, 'месяц', 'месяца', 'месяцев'));
    if (days || !parts.length) parts.push(days + ' ' + plural(days, 'день', 'дня', 'дней'));
  }
  return parts.join(' ');
}

// Плашка «В компании: ...» (дашборд сотрудника и блок у QR-кода)
function tenureBannerHtml(hireDate) {
  const txt = tenureText(hireDate);
  if (!txt) return '';
  return `<div class="flex items-center gap-2 text-sm text-slate-700 bg-indigo-50 border border-indigo-100 rounded-lg px-3 py-2">
    <span>🏢</span>
    <span>${_L('В компании', 'Компанияда')}: <b>${esc(txt)}</b> <span class="text-slate-400 text-xs">(${_L('с', '')} ${fmtDate(hireDate)})</span></span>

}

async function openCourseModal(id) {
  if (!(state.courses || []).length) { try { state.courses = await api.getCourses(); } catch (e) {} }
  fillCourseCategoryLists();
  ['Ru', 'Kz'].forEach(L => {
    document.getElementById('cMaterialStatus' + L).textContent = '';
    document.getElementById('cMaterialFile' + L).value = '';
    document.getElementById('cVideoStatus' + L).textContent = '';
    document.getElementById('cVideoFile' + L).value = '';
  });
  if (id) {
    const { course } = await api.getCourse(id);
    document.getElementById('courseId').value = course.id;
    document.getElementById('cTitleRu').value = course.title_ru || '';
    document.getElementById('cTitleKz').value = course.title_kz || '';
    document.getElementById('cDescRu').value = course.description_ru || '';
    document.getElementById('cDescKz').value = course.description_kz || '';
    document.getElementById('cCatRu').value = course.category_ru || '';
    document.getElementById('cCatKz').value = course.category_kz || '';
    document.getElementById('cTime').value = course.time_limit_minutes;
    document.getElementById('cPass').value = course.pass_score_percent;
    document.getElementById('cValid').value = course.validity_months;
    document.getElementById('cNoExpiry').checked = !!course.no_expiry;
    document.getElementById('cMandatory').checked = !!course.is_mandatory;
    document.getElementById('cMandatoryFor').value = course.mandatory_for || 'all';
    onCourseMandatoryToggle();
    document.getElementById('cKind').value = course.course_kind || (course.is_external ? 'external' : 'internal');
    {
      const mg = document.getElementById('cMainGroup');
      mg.value = course.main_group || dashDefaultGroup(document.getElementById('cKind').value);
      mg.dataset.manual = course.main_group ? '1' : '';
    }
    setCourseCardColor(course.card_color || '');
    onCourseNoExpiryToggle();
    onCourseExternalToggle();
    // video_url_ru/kz — новые поля; video_url — старое поле для курсов, созданных до этого обновления
    document.getElementById('cVideoRu').value = course.video_url_ru || course.video_url || '';
    document.getElementById('cVideoKz').value = course.video_url_kz || '';
    renderMaterialStatus('ru', course.material_pdf_path_ru || course.material_pdf_path);
    renderMaterialStatus('kz', course.material_pdf_path_kz);
    renderVideoStatus('ru', course.video_path_ru || course.video_path);
    renderVideoStatus('kz', course.video_path_kz);
    document.getElementById('courseModalTitle').textContent = 'Редактировать курс';
  } else {
    document.getElementById('courseId').value = '';
    document.getElementById('cTitleRu').value = '';
    document.getElementById('cTitleKz').value = '';
    document.getElementById('cDescRu').value = '';
    document.getElementById('cDescKz').value = '';
    // Новый курс: если сейчас открыт раздел (категория) — подставляем её, чтобы курс сразу попал куда надо
    const curCat = state.courseFilter.cat;
    const curCourse = (curCat && curCat !== '*') ? (state.courses || []).find(c => catKeyOf(c) === curCat) : null;
    document.getElementById('cCatRu').value = curCourse ? (curCourse.category_ru || '') : '';
    document.getElementById('cCatKz').value = curCourse ? (curCourse.category_kz || '') : '';
    document.getElementById('cTime').value = 20;
    document.getElementById('cPass').value = 80;
    document.getElementById('cValid').value = 12;
    document.getElementById('cNoExpiry').checked = false;
    document.getElementById('cMandatory').checked = false;
    document.getElementById('cMandatoryFor').value = 'all';
    onCourseMandatoryToggle();
    document.getElementById('cKind').value = 'internal';
    {
      const mg = document.getElementById('cMainGroup');
      mg.value = dashDefaultGroup('internal');
      mg.dataset.manual = '';
    }
    setCourseCardColor('');
    onCourseNoExpiryToggle();
    onCourseExternalToggle();
    document.getElementById('cVideoRu').value = '';
    document.getElementById('cVideoKz').value = '';
    renderMaterialStatus('ru', null);
    renderMaterialStatus('kz', null);
    renderVideoStatus('ru', null);
    renderVideoStatus('kz', null);
    document.getElementById('courseModalTitle').textContent = 'Новый курс';
  }
  document.getElementById('courseModal').classList.remove('hidden');
}

async function saveCourseForm(e) {
  e.preventDefault();
  const id = document.getElementById('courseId').value || undefined;
  const data = {
    title_ru: document.getElementById('cTitleRu').value.trim(),
    title_kz: document.getElementById('cTitleKz').value.trim(),
    description_ru: document.getElementById('cDescRu').value.trim(),
    description_kz: document.getElementById('cDescKz').value.trim(),
    category_ru: document.getElementById('cCatRu').value.trim(),
    category_kz: document.getElementById('cCatKz').value.trim(),
    time_limit_minutes: parseInt(document.getElementById('cTime').value) || 20,
    pass_score_percent: parseInt(document.getElementById('cPass').value) || 80,
    validity_months: parseInt(document.getElementById('cValid').value) || 12,
    no_expiry: document.getElementById('cNoExpiry').checked,
    is_mandatory: document.getElementById('cMandatory').checked,
    mandatory_for: document.getElementById('cMandatoryFor').value || 'all',
    course_kind: document.getElementById('cKind').value,
    is_external: document.getElementById('cKind').value !== 'internal',
    main_group: document.getElementById('cMainGroup').value,
    card_color: document.getElementById('cCardColor').value || undefined,
    video_url_ru: document.getElementById('cVideoRu').value.trim(),
    video_url_kz: document.getElementById('cVideoKz').value.trim()
  };
  const saved = await api.saveCourse(data, id);
  const courseId = id || saved.id;
  const materialFileRu = document.getElementById('cMaterialFileRu').files[0];
  if (materialFileRu) await api.uploadMaterial(courseId, 'ru', materialFileRu);
  const materialFileKz = document.getElementById('cMaterialFileKz').files[0];
  if (materialFileKz) await api.uploadMaterial(courseId, 'kz', materialFileKz);
  const videoFileRu = document.getElementById('cVideoFileRu').files[0];
  if (videoFileRu) await api.uploadVideo(courseId, 'ru', videoFileRu);
  const videoFileKz = document.getElementById('cVideoFileKz').files[0];
  if (videoFileKz) await api.uploadVideo(courseId, 'kz', videoFileKz);
  document.getElementById('courseModal').classList.add('hidden');
  loadCoursesList();
}

  if (!isSuperadminUser()) return;
  if (!confirm('Удалить курс?')) return;
  await api.deleteCourse(id);
  loadCoursesList();
}

// --- TESTS (QUESTIONS BY VARIANT) LOGIC ---
// Тестовая база курса организована как до 10 вариантов (билетов) по 10 вопросов,
// по 4 варианта ответа в каждом. Это позволяет выдавать сотрудникам разные билеты.
const TEST_VARIANTS_COUNT = 10;
const QUESTIONS_PER_VARIANT = 10;
let currentQuestionsCourseId = null;
let currentTestVariant = 1;
let allCourseQuestions = [];
let qViewLang = 'ru';      // на каком языке показывать вопросы в списке: 'ru' | 'kz'
let qSearchText = '';      // поиск по всем билетам курса

function parseQuestionOptions(raw) {
  if (Array.isArray(raw)) return raw;
  try { const v = JSON.parse(raw || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
}

async function openTestsModal(courseId) {
  currentQuestionsCourseId = courseId;
  currentTestVariant = 1;
  qSearchText = '';
  const searchEl = document.getElementById('qSearch');
  if (searchEl) searchEl.value = '';
  resetQuestionForm();
  closeQuestionForm();
  document.getElementById('testImportPanel').classList.add('hidden');
  document.getElementById('testImportStatus').innerHTML = '';
  document.getElementById('testImportFile').value = '';
  await loadQuestionsForCourse();
  document.getElementById('questionsModal').classList.remove('hidden');
}
// Сохраняем старое имя как алиас на случай, если где-то ещё осталась ссылка на него
function openQuestionsModal(courseId) { return openTestsModal(courseId); }

function closeTestsModal() {
  closeQuestionForm();
  document.getElementById('questionsModal').classList.add('hidden');
}

function toggleTestImportPanel() {
  document.getElementById('testImportPanel').classList.toggle('hidden');
}

async function loadQuestionsForCourse() {
  const { course, questions } = await api.getCourse(currentQuestionsCourseId);
  document.getElementById('questionsModalTitle').textContent = 'Тесты курса: ' + course.title_ru;
  allCourseQuestions = questions;
  renderVariantTabs();
  renderVariantQuestions(true);
}

function questionCountsByVariant() {
  const counts = {};
  allCourseQuestions.forEach(q => { const v = q.variant_number || 1; counts[v] = (counts[v] || 0) + 1; });
  return counts;
}

function renderVariantTabs() {
  const div = document.getElementById('variantTabs');
  const counts = questionCountsByVariant();
  const total = allCourseQuestions.length;
  const filled = Array.from({ length: TEST_VARIANTS_COUNT }, (_, i) => counts[i + 1] || 0).filter(c => c >= QUESTIONS_PER_VARIANT).length;
  const summary = document.getElementById('questionsModalSummary');
  if (summary) summary.textContent = `Всего вопросов: ${total} · полностью заполнено билетов: ${filled} из ${TEST_VARIANTS_COUNT}`;

  div.innerHTML = Array.from({ length: TEST_VARIANTS_COUNT }, (_, i) => i + 1).map(v => {
    const count = counts[v] || 0;
    const complete = count >= QUESTIONS_PER_VARIANT;
    const active = v === currentTestVariant && !qSearchText;
    const pct = Math.min(100, Math.round(count / QUESTIONS_PER_VARIANT * 100));
    const box = active
      ? 'bg-blue-600 text-white border-blue-600 shadow'
      : (complete ? 'bg-white text-slate-800 border-emerald-300 hover:bg-emerald-50' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100');
    const barBg = active ? 'rgba(255,255,255,.35)' : '#e2e8f0';
    const barFg = active ? '#fff' : (complete ? '#10b981' : '#f59e0b');
    return `<button type="button" onclick="selectTestVariant(${v})" class="shrink-0 md:w-full text-left rounded-lg border px-3 py-2 transition ${box}">
      <div class="flex items-center justify-between gap-3">
        <span class="text-sm font-bold whitespace-nowrap">Билет ${v}</span>
        <span class="text-xs font-semibold whitespace-nowrap">${complete ? '✓ ' : ''}${count}/${QUESTIONS_PER_VARIANT}</span>
      </div>
      <div class="mt-1.5 h-1 rounded-full overflow-hidden" style="background:${barBg}"><div class="h-full rounded-full" style="width:${pct}%;background:${barFg}"></div></div>
    </button>`;
  }).join('');
}

function selectTestVariant(v) {
  currentTestVariant = v;
  qSearchText = '';
  const searchEl = document.getElementById('qSearch');
  if (searchEl) searchEl.value = '';
  renderVariantTabs();
  renderVariantQuestions();
}

function setQuestionViewLang(l) {
  qViewLang = l;
  renderVariantQuestions(true);
}

function onQuestionSearch() {
  qSearchText = (document.getElementById('qSearch').value || '').trim().toLowerCase();
  renderVariantTabs();
  renderVariantQuestions();
}

function renderVariantQuestions(keepScroll = false) {
  const container = document.getElementById('questionsList');
  if (!container) return;
  const prevScroll = container.scrollTop;

  // Переключатель языка RU / KZ
  const langBox = document.getElementById('qLangSwitch');
  if (langBox) {
    const btn = (code, label) => `<button type="button" onclick="setQuestionViewLang('${code}')" class="px-3 py-1.5 ${qViewLang === code ? 'bg-slate-800 text-white' : 'bg-white text-slate-600 hover:bg-slate-50'}">${label}</button>`;
    langBox.innerHTML = btn('ru', 'RU') + btn('kz', 'KZ');
  }

  const counts = questionCountsByVariant();
  const inVariant = counts[currentTestVariant] || 0;
  const searching = !!qSearchText;

  // Порядковый номер вопроса внутри своего билета
  const posInVariant = new Map();
  const seen = {};
  allCourseQuestions.forEach(q => {
    const v = q.variant_number || 1;
    seen[v] = (seen[v] || 0) + 1;
    posInVariant.set(q.id, seen[v]);
  });

  let list;
  if (searching) {
    list = allCourseQuestions.filter(q => {
      const hay = [q.question_ru, q.question_kz, ...parseQuestionOptions(q.options_ru), ...parseQuestionOptions(q.options_kz)].join(' ').toLowerCase();
      return hay.includes(qSearchText);
    });
  } else {
    list = allCourseQuestions.filter(q => (q.variant_number || 1) === currentTestVariant);
  }

  // Заголовок над списком + кнопка «Добавить»
  const heading = document.getElementById('variantHeading');
  const countText = document.getElementById('variantCountText');
  const addBtn = document.getElementById('addQuestionBtn');
  if (searching) {
    heading.textContent = 'Результаты поиска';
    countText.textContent = `Найдено вопросов: ${list.length} (по всем билетам)`;
  } else {
    heading.textContent = 'Билет ' + currentTestVariant;
    countText.textContent = inVariant >= QUESTIONS_PER_VARIANT
      ? `Заполнен: ${inVariant} из ${QUESTIONS_PER_VARIANT} вопросов`
      : `Вопросов: ${inVariant} из ${QUESTIONS_PER_VARIANT} — можно добавить ещё ${QUESTIONS_PER_VARIANT - inVariant}`;
  }
  if (addBtn) {
    const full = inVariant >= QUESTIONS_PER_VARIANT;
    addBtn.disabled = full;
    addBtn.title = full ? 'В билете уже 10 вопросов — удалите или измените существующие' : '';
    addBtn.textContent = searching ? `+ Добавить в билет ${currentTestVariant}` : '+ Добавить вопрос';
  }

  if (!list.length) {
    container.innerHTML = searching
      ? '<div class="text-sm text-slate-400 py-10 text-center">Ничего не найдено. Измените запрос.</div>'
      : `<div class="text-sm text-slate-400 py-10 text-center">В билете №${currentTestVariant} пока нет вопросов. Нажмите «+ Добавить вопрос» или загрузите тест из Excel.</div>`;
    return;
  }

  const isKz = qViewLang === 'kz';
  container.innerHTML = list.map(q => {
    const optsRu = parseQuestionOptions(q.options_ru);
    const optsKz = parseQuestionOptions(q.options_kz);
    const qText = (isKz ? q.question_kz : q.question_ru) || q.question_ru || q.question_kz || '';
    const actionBtns = `<button type="button" onclick="editQuestionById(${q.id})" class="px-3 py-1.5 rounded-lg border border-blue-200 text-blue-700 text-xs font-semibold hover:bg-blue-50">Изменить</button>
      <button type="button" onclick="deleteQuestionRow(${q.id})" class="px-3 py-1.5 rounded-lg border border-red-200 text-red-600 text-xs font-semibold hover:bg-red-50">Удалить</button>`;
    const opts = optsRu.map((o, i) => (isKz ? optsKz[i] : o) || o);
    return `
    <article class="rounded-xl border border-slate-200 bg-white shadow-sm">
      <div class="flex gap-3 p-4">
        <div class="w-8 h-8 shrink-0 rounded-full bg-blue-50 text-blue-700 font-bold text-sm flex items-center justify-center">${posInVariant.get(q.id) || ''}</div>
        <div class="flex-1 min-w-0">
          ${searching ? `<span class="inline-block mb-1 text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">Билет ${q.variant_number || 1}</span>` : ''}
          <p class="text-[15px] font-semibold text-slate-900 leading-snug break-words">${esc(qText)}</p>
          <div class="mt-3 grid gap-2 sm:grid-cols-2">
            ${opts.map((o, i) => {
              const ok = i === q.correct_index;
              return `<div class="flex items-start gap-2 rounded-lg border px-3 py-2 text-sm ${ok ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-semibold' : 'bg-slate-50 border-slate-200 text-slate-700'}">
                <span class="font-bold shrink-0 ${ok ? 'text-emerald-700' : 'text-slate-400'}">${'ABCD'[i] || i + 1}</span>
                <span class="flex-1 break-words">${esc(o)}</span>
                ${ok ? '<span class="shrink-0 text-emerald-600">✓</span>' : ''}
              </div>`;
            }).join('')}
          </div>
          <div class="mt-3 flex gap-2 sm:hidden">${actionBtns}</div>
        </div>
        <div class="hidden sm:flex flex-col gap-1.5 shrink-0">${actionBtns}</div>
      </div>
    </article>`;
  }).join('');

  container.scrollTop = keepScroll ? prevScroll : 0;
}

function setQuestionFormTitle(editing, variant) {
  const el = document.getElementById('qFormTitle');
  if (el) el.textContent = (editing ? 'Изменить вопрос' : 'Новый вопрос') + ' — билет ' + variant;
  const nextBtn = document.getElementById('qSaveNextBtn');
  if (nextBtn) nextBtn.classList.toggle('hidden', !!editing);
}

function resetQuestionForm() {
  document.getElementById('qId').value = '';
  document.getElementById('qVariant').value = currentTestVariant;
  setQuestionFormTitle(false, currentTestVariant);
  document.getElementById('qTextRu').value = '';
  document.getElementById('qTextKz').value = '';
  for (let i = 0; i < 4; i++) {
    document.getElementById('qOpt' + i + 'Ru').value = '';
    document.getElementById('qOpt' + i + 'Kz').value = '';
  }
  const r0 = document.getElementById('qCorrectR0');
  if (r0) r0.checked = true;
}

function openQuestionForm() {
  const count = (questionCountsByVariant()[currentTestVariant] || 0);
  if (count >= QUESTIONS_PER_VARIANT) {
    alert('В одном билете не может быть больше 10 вопросов. Удалите или измените существующие.');
    return;
  }
  resetQuestionForm();
  document.getElementById('questionFormModal').classList.remove('hidden');
  document.getElementById('qTextRu').focus();
}

function closeQuestionForm() {
  const m = document.getElementById('questionFormModal');
  if (m) m.classList.add('hidden');
}

function editQuestionById(id) {
  const q = (allCourseQuestions || []).find(item => Number(item.id) === Number(id));
  if (!q) return;

  const optsRu = parseQuestionOptions(q.options_ru);
  const optsKz = parseQuestionOptions(q.options_kz);
  const variant = q.variant_number || currentTestVariant;

  document.getElementById('qId').value = q.id;
  document.getElementById('qVariant').value = variant;
  setQuestionFormTitle(true, variant);
  document.getElementById('qTextRu').value = q.question_ru || '';
  document.getElementById('qTextKz').value = q.question_kz || '';

  for (let i = 0; i < 4; i++) {
    document.getElementById('qOpt' + i + 'Ru').value = optsRu[i] || '';
    document.getElementById('qOpt' + i + 'Kz').value = optsKz[i] || '';
  }

  const radio = document.getElementById('qCorrectR' + (q.correct_index ?? 0));
  if (radio) radio.checked = true;

  document.getElementById('questionFormModal').classList.remove('hidden');
  document.getElementById('qTextRu').focus();
}

// Алиас для обратной совместимости
function editQuestionRow(q) {
  if (q && q.id) editQuestionById(q.id);
}

async function saveQuestionForm(e, addNext) {
  if (e && e.preventDefault) e.preventDefault();
  const qid = document.getElementById('qId').value;
  const variantNo = parseInt(document.getElementById('qVariant').value, 10) || currentTestVariant;
  const currentCount = (allCourseQuestions || []).filter(q => Number(q.variant_number) === Number(variantNo)).length;
  if (!qid && currentCount >= QUESTIONS_PER_VARIANT) {
    alert('В одном билете не может быть больше 10 вопросов. Удалите или измените существующие.');
    return;
  }
  const textRu = document.getElementById('qTextRu').value.trim();
  let textKz = document.getElementById('qTextKz').value.trim();

  if (!textRu) {
    alert('Пожалуйста, введите текст вопроса (RU).');
    return;
  }
  if (!textKz) textKz = textRu;

  const optsRu = [0, 1, 2, 3].map(i => document.getElementById('qOpt' + i + 'Ru').value.trim());
  let optsKz = [0, 1, 2, 3].map(i => document.getElementById('qOpt' + i + 'Kz').value.trim());

  if (optsRu.some(o => !o)) {
    alert('Заполните все 4 варианта ответа (RU).');
    return;
  }
  optsKz = optsKz.map((kz, i) => kz || optsRu[i]);

  const correctRadio = document.querySelector('input[name="qCorrectRadio"]:checked');
  if (!correctRadio) {
    alert('Отметьте кружком правильный ответ.');
    return;
  }

  const data = {
    question_ru: textRu,
    question_kz: textKz,
    options_ru: optsRu,
    options_kz: optsKz,
    correct_index: parseInt(correctRadio.value, 10),
    variant_number: variantNo
  };

  try {
    if (qid) {
      await api.updateQuestion(currentQuestionsCourseId, qid, data);
    } else {
      await api.addQuestion(currentQuestionsCourseId, data);
    }
    await loadQuestionsForCourse();
    loadCoursesList();
    // «Сохранить и добавить ещё» — форма остаётся открытой для следующего вопроса, пока в билете есть место
    const stillRoom = ((questionCountsByVariant()[variantNo]) || 0) < QUESTIONS_PER_VARIANT;
    if (addNext && !qid && stillRoom) {
      resetQuestionForm();
      document.getElementById('qTextRu').focus();
    } else {
      resetQuestionForm();
      closeQuestionForm();
    }
  } catch (err) {
    alert('Ошибка сохранения вопроса: ' + (err.message || 'Ошибка сервера'));
  }
}

async function deleteQuestionRow(qid) {
  if (!confirm('Удалить вопрос?')) return;
  try {
    await api.deleteQuestion(currentQuestionsCourseId, qid);
    await loadQuestionsForCourse();
    loadCoursesList();
  } catch (err) {
    alert('Ошибка при удалении: ' + (err.message || 'Ошибка сервера'));
  }
}

// --- Автоматическая загрузка теста из Excel ---
async function downloadTestTemplate() {
  try {
    const res = await api.req('/api/courses/questions-template.xlsx');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'test_template.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Не удалось скачать шаблон: ' + e.message);
  }
}

async function importTestFile() {
  const fileInput = document.getElementById('testImportFile');
  const file = fileInput.files[0];
  const mode = document.getElementById('testImportMode').value;
  const statusEl = document.getElementById('testImportStatus');
  if (!file) { alert('Выберите файл Excel (.xlsx) для загрузки.'); return; }
  if (mode === 'replace' && !confirm('Вся текущая база тестов этого курса будет удалена и заменена содержимым файла. Продолжить?')) return;

  statusEl.innerHTML = '<span class="text-slate-500">Загрузка и проверка файла...</span>';
  try {
    const fd = new FormData();
    fd.append('file', file);
    const res = await api.req('/api/courses/' + currentQuestionsCourseId + '/questions/import?mode=' + mode, { method: 'POST', body: fd });
    let html = `<span class="text-emerald-700 font-semibold">Загружено вопросов: ${res.imported}</span>`;
    if (res.skipped) {
      html += `<div class="text-amber-600 mt-1">Пропущено строк: ${res.skipped}</div>`;
      html += `<ul class="list-disc list-inside text-amber-600">${res.errors.slice(0, 15).map(e => `<li>${esc(e)}</li>`).join('')}</ul>`;
      if (res.errors.length > 15) html += `<div class="text-amber-600">...и ещё ${res.errors.length - 15}</div>`;
    }
    statusEl.innerHTML = html;
    fileInput.value = '';
    await loadQuestionsForCourse();
    loadCoursesList();
  } catch (e) {
    statusEl.innerHTML = `<span class="text-red-600">Ошибка загрузки: ${esc(e.message)}</span>`;
  }
}

// Список категорий для фильтра берётся из самих назначений (до фильтрации), чтобы в нём были только реально используемые
function populateAssignCatFilter(fullList) {
  const sel = document.getElementById('aFilterCat');
  if (!sel) return;
  const groups = groupCoursesByCategory(fullList);
  if (state.assignCat !== '*' && !groups.some(g => g.key === state.assignCat)) state.assignCat = '*';
  const hasCategories = groups.some(g => g.key);
  sel.classList.toggle('hidden', !hasCategories);
  sel.innerHTML = `<option value="*">${t('all_categories')}</option>` +
    groups.map(g => `<option value="${esc(g.key)}" ${state.assignCat === g.key ? 'selected' : ''}>${esc(g.label)} (${g.items.length})</option>`).join('');
}

            <div id="asProtAutoNote" class="text-[11px] text-slate-500 -mt-1">Номер подставлен автоматически по счётчику из настроек — при необходимости его можно исправить вручную.</div>

              </label>
              <div id="asHistoricalFields" class="hidden grid grid-cols-2 gap-3 mt-2">
                <div><label class="text-xs font-semibold text-slate-600">Дата прохождения</label><input type="date" id="asTestDate" oninput="asUpdateNextDate()" class="w-full border p-2 rounded text-sm"></div>
                <div id="asNextWrap">
                  <div id="asNextFields"><label class="text-xs font-semibold text-slate-600">Дата след. прохождения</label><input type="date" id="asNextTestDate" oninput="onAsNextInput()" class="w-full border p-2 rounded text-sm"></div>
                  <p id="asNextHint" class="text-[11px] text-slate-500 mt-1"></p>

              <div class="flex items-center justify-between mb-2">
                <label class="text-xs font-semibold text-slate-600">Сотрудники <span id="asSelectedCount" class="text-blue-600 font-bold"></span></label>
                <div class="space-x-2 text-xs">
                  <button type="button" onclick="asSelectAll(true)" class="text-blue-600 hover:underline">Выбрать всех</button>
                  <button type="button" onclick="asSelectAll(false)" class="text-slate-500 hover:underline">Снять всё</button>
                  <button type="button" id="asShowSelectedBtn" onclick="toggleAsShowSelected()" class="text-emerald-700 hover:underline font-semibold">Показать выбранных</button>

              </div>
              <div class="text-[11px] text-slate-500 -mt-1 mb-2">Один номер протокола будет присвоен всем выбранным ниже сотрудникам.</div>
              <div class="grid grid-cols-2 gap-2 mb-2">
                <input id="asFilterQ" type="text" placeholder="${t('search_placeholder')}" oninput="renderAssignEmployeeList()" class="border border-slate-300 rounded-lg px-2 py-1.5 text-xs col-span-2">
                <select id="asFilterObject" onchange="renderAssignEmployeeList()" class="border border-slate-300 rounded-lg px-2 py-1.5 text-xs"><option value="">${t('all_objects')}</option></select>
                <select id="asFilterDept" onchange="renderAssignEmployeeList()" class="border border-slate-300 rounded-lg px-2 py-1.5 text-xs"><option value="">${t('all_departments')}</option></select>
              </div>
