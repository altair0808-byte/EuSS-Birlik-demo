<style>
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  .idqr svg { width: 100%; height: auto; display: block; }
  .fade-in { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  /* ===== Телефоны (до 768px): таблицы → карточки, крупные поля, удобное меню ===== */
  html { -webkit-text-size-adjust: 100%; }
  @media (max-width: 767px) {
    /* iOS увеличивает страницу при фокусе на поле со шрифтом < 16px — убираем */
    input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea { font-size: 16px !important; }
    /* Меню вкладок: кнопки не переносятся на 2 строки, прокрутка пальцем без полосы */
    nav > div { scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    nav > div::-webkit-scrollbar { display: none; }
    nav button, nav a { white-space: nowrap; flex-shrink: 0; padding-top: .55rem !important; padding-bottom: .55rem !important; }
    /* Кнопки действий вверху вкладки — одна прокручиваемая строка, а не 8 рядов */
    .toolbar-scroll { flex-wrap: nowrap !important; overflow-x: auto; width: 100%; padding-bottom: 4px; scrollbar-width: none; }
    .toolbar-scroll::-webkit-scrollbar { display: none; }
    .toolbar-scroll > button, .toolbar-scroll > label, .toolbar-scroll > a { white-space: nowrap; flex-shrink: 0; }
    /* Крупнее зона нажатия у кнопок в таблицах и карточках */
    #tabContent button { min-height: 36px; }
    /* Таблицы-списки → карточки (подписи колонок подставляет JS: data-label) */
    .overflow-x-auto { overflow-x: visible; }
    table.rt, table.rt tbody, table.rt tr, table.rt td { display: block; width: 100%; max-width: none; }
    table.rt thead { display: none; }
    table.rt tr { border: 1px solid #e2e8f0 !important; border-radius: 12px; margin-bottom: 10px; padding: 6px 12px; background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
    table.rt td { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 6px 0 !important; border: 0 !important; text-align: right !important; word-break: break-word; }
    table.rt td::before { content: attr(data-label); font-weight: 600; font-size: 12px; color: #64748b; text-align: left; flex: 0 0 38%; max-width: 38%; }
    table.rt td[data-label=""]::before { display: none; }
    table.rt td[data-label=""] { justify-content: flex-start; text-align: left !important; }
    table.rt td[colspan] { display: block; text-align: center !important; }
    table.rt td[colspan]::before { display: none; }
    table.rt td:last-child { border-top: 1px dashed #e2e8f0 !important; margin-top: 4px; padding-top: 10px !important; flex-wrap: wrap; justify-content: flex-end; }
    table.rt td:last-child::before { flex-basis: 100%; max-width: 100%; }
    /* Карточки и окна — меньше отступы */
    #tabContent .p-6 { padding: 1rem; }
    .fixed .max-h-\[90vh\] { max-height: 92vh; }
  }
  /* ===== Просмотр материалов: полный экран ===== */
  #mediaViewerBox.mv-pseudo-full { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important; height: 100dvh !important; max-width: none !important; max-height: none !important; border-radius: 0 !important; z-index: 110; }
  #mediaViewerBox:fullscreen { border-radius: 0 !important; }
  #mediaViewerBox:-webkit-full-screen { border-radius: 0 !important; }
  #mvStage { display: flex; }
  #mvCanvas { margin: auto; flex: 0 0 auto; }
  .mv-btn { min-width: 36px; height: 34px; padding: 0 10px; border-radius: 8px; background: rgba(255,255,255,.12); color: #fff; font-size: 15px; font-weight: 600; line-height: 1; }
  .mv-btn:hover { background: rgba(255,255,255,.22); }
  .mv-btn:disabled { opacity: .35; cursor: default; }
  .test-scroll {
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }
</style>

let CURRENT_LANG = localStorage.getItem('lang') || 'ru';
function t(key) { return (I18N[CURRENT_LANG] && I18N[CURRENT_LANG][key]) || key; }
function setLang(lang) { CURRENT_LANG = lang; localStorage.setItem('lang', lang); }
const _L = (ru, kz) => (CURRENT_LANG === 'kz' ? kz : ru);
// Должность хранится у сотрудника одним (русским) значением — это «канонический» текст.
// Казахское отображение берём из справочника state.dictionaries.positions ({ru, kz}) по
// совпадению с ru; если для значения нет казахского перевода в справочнике (например,
// должность вписана вручную и её ещё нет в списке) — просто показываем как есть.
function posLabel(ruValue) {
  if (!ruValue) return ruValue;
  if (CURRENT_LANG !== 'kz') return ruValue;
  const dict = (state.dictionaries && state.dictionaries.positions) || [];
  const entry = dict.find(p => p && p.ru === ruValue);
  return (entry && entry.kz) ? entry.kz : ruValue;
}


// Единый фильтр «Объект/Отдел» поддерживает мульти-выбор (массивы значений).
// Разбирает сохранённое в sessionStorage значение и приводит его к массивам —
// в т.ч. старый формат (одна строка), сохранённый до перехода на мульти-выбор,
// чтобы у пользователей, уже открывших вкладку, фильтр не сломался при обновлении.
function normalizeOrgFilter(raw) {
  let parsed;
  try { parsed = JSON.parse(raw || '{}'); } catch (e) { parsed = {}; }
  const toArr = v => Array.isArray(v) ? v.filter(Boolean) : (v ? [v] : []);
  return { object: toArr(parsed.object), department: toArr(parsed.department) };
}

function qs(obj) {
  const parts = Object.entries(obj).filter(([, v]) => v !== '' && v !== null && v !== undefined);
  if (!parts.length) return '';
  return '?' + parts.map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
}

const api = {
  async req(url, opts = {}) {
    opts.headers = opts.headers || {};
    if (state.token) opts.headers['Authorization'] = 'Bearer ' + state.token;
    if (opts.body && !(opts.body instanceof FormData)) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    const res = await fetch(url, opts);
    if (res.status === 401) {
      logout();
      throw new Error('Unauthorized');
    }
    if (!res.ok) {
      const raw = await res.text().catch(() => '');
      let detail = '';
      let parsedBody = null;
      try {
        const parsed = JSON.parse(raw);
        parsedBody = parsed;
        // parsed.message — понятный пользователю текст (если сервер его прислал, например
        // "Укажите фамилию и имя"); parsed.details — исходный текст ошибки БД (поле
        // `details` в { error: 'db_error', details: e.message }, см. routes/*.js).
        // Раньше сюда попадал только parsed.error, то есть при db_error пользователь видел
        // просто код "db_error" без единой подсказки, что пошло не так на самом деле.
        detail = parsed.message || parsed.details || parsed.error || '';
      } catch (e) {
        detail = (raw || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200);
      }
      const err = new Error(detail || 'Ошибка запроса');
      err.status = res.status;
      err.url = url;
      err.data = parsedBody; // тело ответа сервера (код ошибки, existing_user и т.д.)
      throw err;
    }
    const ct = res.headers.get('content-type');
    if (ct && ct.includes('application/json')) return res.json();
    return res;
  },

  getUsers(filter = {}) { return this.req('/api/users' + qs(filter)); },

// Скачивание/открытие защищённых файлов (требующих Authorization),
// которые нельзя открыть обычной ссылкой <a href target="_blank">,
// т.к. браузер не добавляет заголовок Authorization при обычной навигации.
// Скачивание/открытие файла с токеном авторизации.
// ВАЖНО: вкладку для просмотра (PDF без имени файла) открываем СРАЗУ, в момент клика, ДО await fetch.
// Браузеры блокируют window.open, вызванный после асинхронного запроса (это уже не «жест
// пользователя») — из-за этого кнопки «Скачать PDF», «Сертификат», «Удостоверение» молча ничего
// не делали. Если вкладку открыть не удалось — файл скачивается обычной загрузкой.
// forceDownload=true — всегда скачивать файлом (имя берётся из заголовка ответа).
async function downloadAuthed(url, filename, forceDownload) {
  let pre = null;
  if (!filename && !forceDownload) { try { pre = window.open('', '_blank'); } catch (e) { pre = null; } }
  const closePre = () => { try { if (pre && !pre.closed) pre.close(); } catch (e) {} };
  try {
    const res = await fetch(url, { headers: state.token ? { 'Authorization': 'Bearer ' + state.token } : {} });
    if (res.status === 401) { closePre(); logout(); return; }
    if (!res.ok) {
      closePre();
      const err = await res.json().catch(() => ({ error: 'Ошибка сервера' }));
      alert(err.message || err.error || 'Не удалось скачать файл');
      return;
    }
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    if (filename || forceDownload || !pre || pre.closed) {
      let name = filename;
      if (!name) {
        const cd = res.headers.get('content-disposition') || '';
        const m = cd.match(/filename\*=UTF-8''([^;]+)/i) || cd.match(/filename="?([^";]+)"?/i);
        name = blob.type === 'application/pdf' ? 'document.pdf' : 'document';
        if (m) { try { name = decodeURIComponent(m[1]); } catch (e) { name = m[1]; } }
      }
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    } else {
      pre.location.href = blobUrl;
    }
    setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
  } catch (e) {
    closePre();
    alert('Не удалось скачать файл: ' + e.message);
  }
}

// Экранирование текста перед вставкой в innerHTML (защита от XSS в ФИО/названиях)
function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Экранирование строки для безопасной вставки внутрь одинарных кавычек в inline-обработчике onclick="...('...')"
function jsAttrEsc(str) {
  return String(str ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// ИИН — маскирование (ТЗ «роли/ИИН/PDF=копия Word», ответ по §11.3): в списках сотрудников
// показывается замаскированным (••••••••1234), раскрывается по клику; повторный клик или
// уход со страницы (перерисовка списка) снова скрывает значение. Действует для всех ролей,
// которые видят список (admin/assistant/superadmin) — не только для assistant.
function maskIin(iin) {
  const s = String(iin || '');
  if (s.length <= 4) return '•'.repeat(s.length);
  return '•'.repeat(s.length - 4) + s.slice(-4);
}
function iinCellHtml(iin) {
  if (!iin) return '<span class="text-slate-400">—</span>';
  return `<span class="font-mono cursor-pointer select-none hover:text-blue-600" data-revealed="0" data-iin="${esc(iin)}" title="${_L('Показать/скрыть ИИН', 'ЖСН көрсету/жасыру')}" onclick="toggleIinReveal(this)">${esc(maskIin(iin))}</span>`;
}
function toggleIinReveal(el) {
  const full = el.dataset.iin || '';
  const revealed = el.dataset.revealed === '1';
  el.dataset.revealed = revealed ? '0' : '1';
  el.textContent = revealed ? maskIin(full) : full;
}

// --- ПРОСМОТР МАТЕРИАЛОВ И ВИДЕО ПРЯМО НА САЙТЕ (без открытия в отдельном окне) ---
function isVideoFileUrl(url) { return /\.(mp4|webm|ogg|mov|m4v|avi|mkv)(\?|#|$)/i.test(url); }
function isPdfFileUrl(url) { return /\.pdf(\?|#|$)/i.test(url); }
function isOfficeDocUrl(url) { return /\.(ppt|pptx|doc|docx|xls|xlsx)(\?|#|$)/i.test(url); }

function toYouTubeEmbedUrl(url) {
  try {
    const u = new URL(url, window.location.origin);
    const host = u.hostname.replace(/^www\./, '');
    let id = '';
    if (host === 'youtu.be') id = u.pathname.slice(1);
    else if (host === 'youtube.com' || host === 'm.youtube.com') {
      if (u.pathname === '/watch') id = u.searchParams.get('v') || '';
      else if (u.pathname.startsWith('/embed/')) return u.href;
      else if (u.pathname.startsWith('/shorts/')) id = u.pathname.split('/')[2] || '';
    } else {
      return null;
    }
    return id ? `https://www.youtube.com/embed/${id}` : null;
  } catch (e) { return null; }
}

// ---- Быстрый постраничный просмотр PDF (pdf.js) ----
// Почему быстрее, чем <iframe> с PDF: файл читается кусками (HTTP Range) и ПЕРВАЯ страница
// показывается, не дожидаясь загрузки всего файла; рисуется только текущая страница, следующая
// готовится заранее. Если pdf.js не загрузился (нет доступа к cdnjs) или файл не открылся —
// автоматически включается прежний вариант (встроенный просмотр браузера).
const PDFJS_VER = '3.11.174';
let _pdfjsPromise = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (_pdfjsPromise) return _pdfjsPromise;
  _pdfjsPromise = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.min.js`;
    sc.onload = () => {
      try {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.worker.min.js`;
        resolve(window.pdfjsLib);
      } catch (e) { _pdfjsPromise = null; reject(e); }
    };
    sc.onerror = () => { _pdfjsPromise = null; reject(new Error('pdfjs_load_failed')); };
    document.head.appendChild(sc);
  });
  return _pdfjsPromise;
}

const MV = { doc: null, page: 1, total: 0, zoom: 1, token: 0, loadId: 0, ro: null, cache: new Map(), pages: new Map(), touchX: null, touchY: null, raf: 0 };

function mvFullActive() {
  const box = document.getElementById('mediaViewerBox');
  return !!(document.fullscreenElement || document.webkitFullscreenElement || (box && box.classList.contains('mv-pseudo-full')));
}

function toggleMediaFullscreen() {
  const box = document.getElementById('mediaViewerBox');
  if (!box) return;
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    return;
  }
  if (box.classList.contains('mv-pseudo-full')) { box.classList.remove('mv-pseudo-full'); mvUpdateFsLabel(); return; }
  const req = box.requestFullscreen || box.webkitRequestFullscreen;
  const fallback = () => { box.classList.add('mv-pseudo-full'); mvUpdateFsLabel(); };
  if (req) {
    try { const r = req.call(box); if (r && r.catch) r.catch(fallback); } catch (e) { fallback(); }
  } else {
    fallback(); // например iPhone: у Safari нет полноэкранного режима для обычных элементов — растягиваем окно на весь экран
  }
}

function mvUpdateFsLabel() {
  const txt = mvFullActive() ? _L('✕ Выйти из полного экрана', '✕ Толық экраннан шығу') : _L('⛶ На весь экран', '⛶ Толық экран');
  const b = document.getElementById('mediaViewerFsBtn');
  if (b) b.textContent = txt;
  const b2 = document.getElementById('mvFs');
  if (b2) b2.textContent = mvFullActive() ? '✕' : '⛶';
}
document.addEventListener('fullscreenchange', mvUpdateFsLabel);
document.addEventListener('webkitfullscreenchange', mvUpdateFsLabel);

async function mvGetPage(n) {
  if (!MV.doc) return null;
  if (MV.pages.has(n)) return MV.pages.get(n);
  const pr = MV.doc.getPage(n);
  MV.pages.set(n, pr);
  if (MV.pages.size > 6) MV.pages.delete(MV.pages.keys().next().value);
  return pr;
}

// Размер страницы под доступную область (как слайд «по размеру экрана») × масштаб пользователя
function mvLayout(page) {
  const stage = document.getElementById('mvStage');
  const vp1 = page.getViewport({ scale: 1 });
  const W = Math.max(120, stage.clientWidth - 12), H = Math.max(120, stage.clientHeight - 12);
  const fit = Math.min(W / vp1.width, H / vp1.height);
  const cssW = Math.floor(vp1.width * fit * MV.zoom), cssH = Math.floor(vp1.height * fit * MV.zoom);
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  const maxPx = 12e6; // не раздуваем память на телефонах
  while (cssW * dpr * cssH * dpr > maxPx && dpr > 1) dpr -= 0.25;
  return { cssW, cssH, dpr, scale: fit * MV.zoom * dpr };
}

async function mvRenderToCanvas(n) {
  const page = await mvGetPage(n);
  if (!page) return null;
  const L = mvLayout(page);
  const key = `${n}|${L.cssW}x${L.cssH}|${L.dpr}`;
  if (MV.cache.has(key)) return { canvas: MV.cache.get(key), L };
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.floor(L.cssW * L.dpr));
  off.height = Math.max(1, Math.floor(L.cssH * L.dpr));
  const vp = page.getViewport({ scale: L.scale });
  await page.render({ canvasContext: off.getContext('2d'), viewport: vp }).promise;
  MV.cache.set(key, off);
  if (MV.cache.size > 4) MV.cache.delete(MV.cache.keys().next().value);
  return { canvas: off, L };
}

async function mvShow() {
  if (!MV.doc) return;
  const my = ++MV.token;
  const n = MV.page;
  try {
    const r = await mvRenderToCanvas(n);
    if (!r || my !== MV.token) return;
    const cv = document.getElementById('mvCanvas');
    if (!cv) return;
    cv.width = r.canvas.width; cv.height = r.canvas.height;
    cv.style.width = r.L.cssW + 'px'; cv.style.height = r.L.cssH + 'px';
    cv.getContext('2d').drawImage(r.canvas, 0, 0);
    const ld = document.getElementById('mvLoading'); if (ld) ld.remove();
    // заранее готовим следующую страницу — переключение мгновенное
    if (n < MV.total) { setTimeout(() => { if (my === MV.token) mvRenderToCanvas(n + 1).catch(() => {}); }, 60); }
  } catch (e) {
    if (my === MV.token) console.error('PDF render error:', e);
  }
}

function mvUpdateNav() {
  const info = document.getElementById('mvPageInfo');
  if (info) info.textContent = `${MV.page} / ${MV.total}`;
  const pv = document.getElementById('mvPrev'), nx = document.getElementById('mvNext');
  if (pv) pv.disabled = MV.page <= 1;
  if (nx) nx.disabled = MV.page >= MV.total;
}

function mvGo(n) {
  if (!MV.doc) return;
  n = Math.max(1, Math.min(MV.total, n));
  if (n === MV.page) return;
  MV.page = n;
  mvUpdateNav();
  const st = document.getElementById('mvStage'); if (st) { st.scrollTop = 0; st.scrollLeft = 0; }
  mvShow();
}

function mvSetZoom(z) {
  MV.zoom = Math.max(1, Math.min(4, z));
  mvShow();
}

function mvOnKey(e) {
  if (!MV.doc) return false;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' ) { mvGo(MV.page + 1); return true; }
  if (k === 'ArrowLeft' || k === 'PageUp') { mvGo(MV.page - 1); return true; }
  if (k === 'ArrowDown' && MV.zoom === 1) { mvGo(MV.page + 1); return true; }
  if (k === 'ArrowUp' && MV.zoom === 1) { mvGo(MV.page - 1); return true; }
  if (k === 'Home') { mvGo(1); return true; }
  if (k === 'End') { mvGo(MV.total); return true; }
  if (k === 'f' || k === 'F') { toggleMediaFullscreen(); return true; }
  return false;
}

function mvResetState() {
  MV.token++; MV.loadId++;
  if (MV.ro) { try { MV.ro.disconnect(); } catch (e) {} MV.ro = null; }
  if (MV.doc) { try { MV.doc.destroy(); } catch (e) {} }
  MV.doc = null; MV.page = 1; MV.total = 0; MV.zoom = 1;
  MV.cache.clear(); MV.pages.clear();
}

function mvIframeFallback(body, absUrl) {
  mvResetState();
  body.innerHTML = `<iframe src="${esc(absUrl)}" class="w-full h-full border-0"></iframe>`;
}

async function openPdfInViewer(absUrl, body) {
  mvResetState();
  const loadId = MV.loadId;
  body.innerHTML = `
    <div class="flex flex-col w-full h-full bg-slate-800 select-none">
      <div id="mvStage" class="flex-1 min-h-0 overflow-auto relative" style="touch-action:pan-x pan-y pinch-zoom">
        <canvas id="mvCanvas" class="bg-white shadow-lg"></canvas>
        <div id="mvLoading" class="absolute inset-0 flex items-center justify-center text-slate-200 text-sm pointer-events-none">${_L('Загрузка…', 'Жүктелуде…')}</div>
      </div>
      <div class="flex items-center justify-center gap-2 px-3 py-2 bg-slate-900 shrink-0 flex-wrap">
        <button type="button" id="mvPrev" class="mv-btn" onclick="mvGo(MV.page-1)" title="←">‹</button>
        <span id="mvPageInfo" class="text-slate-100 text-sm font-semibold min-w-[64px] text-center">–</span>
        <button type="button" id="mvNext" class="mv-btn" onclick="mvGo(MV.page+1)" title="→">›</button>
        <span class="w-px h-5 bg-slate-600 mx-1"></span>
        <button type="button" class="mv-btn" onclick="mvSetZoom(MV.zoom-0.25)" title="−">−</button>
        <button type="button" class="mv-btn" onclick="mvSetZoom(MV.zoom+0.25)" title="+">+</button>
        <button type="button" id="mvFs" class="mv-btn" onclick="toggleMediaFullscreen()" title="${_L('На весь экран', 'Толық экран')}">⛶</button>
      </div>
    </div>`;
  const stage = document.getElementById('mvStage');
  // свайп пальцем влево/вправо — листание (когда страница не увеличена)
  stage.addEventListener('touchstart', (e) => { if (e.touches.length === 1) { MV.touchX = e.touches[0].clientX; MV.touchY = e.touches[0].clientY; } else { MV.touchX = null; } }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (MV.touchX === null || MV.zoom > 1) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - MV.touchX, dy = t.clientY - MV.touchY;
    MV.touchX = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) mvGo(MV.page + (dx < 0 ? 1 : -1));
  }, { passive: true });
  // при изменении размера окна / входе в полный экран — перерисовать под новый размер
  if (typeof ResizeObserver !== 'undefined') {
    MV.ro = new ResizeObserver(() => {
      if (!MV.doc) return;
      cancelAnimationFrame(MV.raf);
      MV.raf = requestAnimationFrame(() => mvShow());
    });
    MV.ro.observe(stage);
  }
  mvUpdateFsLabel();

  try {
    const pdfjs = await loadPdfJs();
    if (loadId !== MV.loadId) return; // окно уже закрыли/открыли другое
    const task = pdfjs.getDocument({ url: absUrl, rangeChunkSize: 131072, disableAutoFetch: true });
    const doc = await task.promise;
    if (loadId !== MV.loadId) { try { doc.destroy(); } catch (e) {} return; }
    MV.doc = doc; MV.total = doc.numPages; MV.page = 1;
    mvUpdateNav();
    mvShow();
  } catch (e) {
    console.warn('pdf.js недоступен, открываю встроенным просмотром:', e && e.message);
    if (loadId === MV.loadId) mvIframeFallback(body, absUrl);
  }
}

// Открывает материал/видео (файл на сервере или внешняя ссылка, напр. YouTube) во встроенном
// модальном окне поверх сайта, вместо перехода в новую вкладку.
function openMediaViewer(url, title) {
  if (!url) return;
  const modal = document.getElementById('mediaViewerModal');
  const body = document.getElementById('mediaViewerBody');
  const titleEl = document.getElementById('mediaViewerTitle');
  const dl = document.getElementById('mediaViewerDownload');
  let absUrl;
  try { absUrl = new URL(url, window.location.origin).href; } catch (e) { absUrl = url; }

  mvResetState();
  titleEl.textContent = title || '';
  dl.href = absUrl;
  dl.textContent = _L('Скачать', 'Жүктеп алу');
  body.innerHTML = '';
  mvUpdateFsLabel();

  modal.classList.remove('hidden');
  modal.classList.add('flex');

  if (isPdfFileUrl(url)) {
    openPdfInViewer(absUrl, body);
  } else if (isVideoFileUrl(url)) {
    body.innerHTML = `<video src="${esc(absUrl)}" controls autoplay playsinline class="w-full h-full bg-black"></video>`;
  } else if (isOfficeDocUrl(url)) {
    const officeUrl = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(absUrl);
    body.innerHTML = `
      <iframe src="${esc(officeUrl)}" class="w-full h-[calc(100%-2.25rem)] border-0" allowfullscreen></iframe>
      <p class="text-[11px] text-slate-500 px-3 py-2 border-t border-slate-200">Если предпросмотр не отображается (например, сайт недоступен из интернета), воспользуйтесь ссылкой «Скачать» выше. Для быстрой работы загружайте презентации в формате PDF.</p>
    `;
  } else {
    const yt = toYouTubeEmbedUrl(url);
    if (yt) {
      body.innerHTML = `<iframe src="${esc(yt)}" class="w-full h-full border-0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    } else {
      body.innerHTML = `<iframe src="${esc(absUrl)}" class="w-full h-full border-0"></iframe>`;
    }
  }
}

function closeMediaViewer() {
  const modal = document.getElementById('mediaViewerModal');
  const body = document.getElementById('mediaViewerBody');
  const box = document.getElementById('mediaViewerBox');
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {}
  }
  if (box) box.classList.remove('mv-pseudo-full');
  mvResetState();
  modal.classList.add('hidden');
  modal.classList.remove('flex');
  body.innerHTML = ''; // останавливает воспроизведение видео/iframe при закрытии
}

document.addEventListener('keydown', (e) => {
  const modal = document.getElementById('mediaViewerModal');
  const open = modal && !modal.classList.contains('hidden');
  if (!open) return;
  if (e.key === 'Escape') {
    const box = document.getElementById('mediaViewerBox');
    if (box && box.classList.contains('mv-pseudo-full')) { box.classList.remove('mv-pseudo-full'); mvUpdateFsLabel(); return; }
    closeMediaViewer();
    return;
  }
  if (mvOnKey(e)) e.preventDefault();
});

// objectNames может быть массивом (мульти-выбор) или одной строкой (вызов из модалки экспорта).
function orgDeptOptions(objectNames = state.org.object) {
  const meta = state.meta || {};
  const names = Array.isArray(objectNames) ? objectNames.filter(Boolean) : (objectNames ? [objectNames] : []);
  if (names.length && (meta.pairs || []).length) {
    return [...new Set(meta.pairs.filter(p => names.includes(p.object) && p.department).map(p => p.department))]
      .sort((a, b) => a.localeCompare(b, 'ru'));

}

function onOrgCheckChange(field, value, checked) {
  const set = new Set(state.org[field]);

  if (field === 'object') {
    // если после смены выбора объектов какой-то из выбранных отделов больше не
    // относится ни к одному из них — убираем его, чтобы фильтр не «завис»
    const validDeps = orgDeptOptions(state.org.object);
    state.org.department = state.org.department.filter(d => validDeps.includes(d));

async function refreshOrgMeta() {
  try {
    const meta = await api.getUsersMeta();
    state.meta = { objects: meta.objects || [], departments: meta.departments || [], pairs: meta.pairs || [] };
    state.metaLoaded = true;
    // выбранные ранее объекты/отделы могли исчезнуть (сотрудников удалили) — убираем их из фильтра
    let reset = false;
    const validObjects = state.org.object.filter(o => state.meta.objects.includes(o));
    if (validObjects.length !== state.org.object.length) { state.org.object = validObjects; reset = true; }
    const validDeps = state.org.department.filter(d => state.meta.departments.includes(d));
    if (validDeps.length !== state.org.department.length) { state.org.department = validDeps; reset = true; }
    if (reset) saveOrg();
    renderOrgBar();
    if (reset) loadTabContent();
  } catch (e) {}
}

// Справочники «Отдел» / «Должность» (п.1 запроса) — грузятся один раз и переиспользуются
// в модалке сотрудника (select) и во вкладке «Настройки» (управление списком).
// Приводит ответ /api/settings/dictionaries к единому виду в state.dictionaries.
function setDictionaries(d) {
  d = d || {};
  state.dictionaries = {
    objects: d.objects || [],
    departments: d.departments || [],
    positions: d.positions || [],
    structure: d.structure || []
  };
}

// Структура «Объект → Отдел → Должность» (Настройки → «Объекты, отделы и должности»).
// Отделы объекта и должности отдела — только те, что закреплены в настройках.
function orgDepartmentsOf(object) {
  const o = (state.dictionaries.structure || []).find(x => x.object === object);
  return o ? o.departments.map(d => d.name) : [];
}
function orgPositionsOf(object, department) {
  const o = (state.dictionaries.structure || []).find(x => x.object === object);
  const d = o && o.departments.find(x => x.name === department);
  if (!d) return [];
  const catalog = state.dictionaries.positions || [];
  return d.positions.map(ru => catalog.find(p => p.ru === ru) || { ru, kz: '' });
}

async function loadDictionaries(force = false) {
  if (state.dictionariesLoaded && !force) return state.dictionaries;
  try {
    setDictionaries(await api.getDictionaries());
    state.dictionariesLoaded = true;
  } catch (e) {}
  return state.dictionaries;
}

function resetOrg() {

}

// ===================== Телефоны: таблицы → карточки =====================
// На узком экране CSS (table.rt) превращает строки в карточки. Подписи для карточек берутся
// из заголовков колонок (thead) и ставятся в data-label ячеек автоматически — после любой
// перерисовки вкладки (загрузка списка, фильтр, смена вкладки).
function labelResponsiveTables(root) {
  (root || document).querySelectorAll('#tabContent table.divide-y, #tabContent table.rt').forEach(tb => {
    const heads = tb.querySelectorAll('thead th');
    if (heads.length < 3) return;
    tb.classList.add('rt');
    const labels = Array.from(heads).map(th => (th.textContent || '').replace(/\s+/g, ' ').trim());
    tb.querySelectorAll('tbody tr').forEach(tr => {
      let i = 0;
      Array.from(tr.children).forEach(td => {
        if (td.tagName !== 'TD') { i += 1; return; }
        const span = Number(td.getAttribute('colspan') || 1);
        if (span === 1 && td.dataset.label === undefined) td.dataset.label = labels[i] || '';
        i += span;
      });
    });
  });
}
(function initResponsiveTables() {
  let pending = false;
  const run = () => { pending = false; try { labelResponsiveTables(); } catch (e) {} };
  const start = () => {
    new MutationObserver(() => { if (!pending) { pending = true; requestAnimationFrame(run); } })
      .observe(document.body, { childList: true, subtree: true });
    run();
  };
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();

  ];
}
function navActiveSection(kind) {
  const tab = state.tab === 'user_profile' ? 'users' : state.tab;
  const all = navSections(kind);
  return all.find(sec => sec.tabs.some(x => x[0] === tab)) || all[0];
}
function navHtml(kind) {
  const act = navActiveSection(kind);
  let h = navSections(kind).map(sec => `<button onclick="navGo('${kind}','${sec.id}')" class="px-3 py-1.5 text-xs font-semibold rounded-md whitespace-nowrap ${sec.id === act.id ? 'bg-blue-600 text-white' : 'text-slate-600 hover:text-slate-900'}">${sec.label}</button>`).join('');
  if (kind === 'admin') {
    h += `<a href="#" onclick="openExportModal();return false;" class="px-3 py-1.5 text-xs font-semibold rounded-md text-emerald-700 hover:bg-emerald-50 whitespace-nowrap">📥 ${t('nav_export')}</a>`;
    if (state.user.committee_role) h += `<a href="#" onclick="openSignatureModal();return false;" class="px-3 py-1.5 text-xs font-semibold rounded-md text-indigo-700 hover:bg-indigo-50 whitespace-nowrap">✍️ Электронная подпись</a>`;
  }
  return h;
}
function navSubHtml(kind) {
  const act = navActiveSection(kind);
  if (act.tabs.length < 2) return '';
  const cur = state.tab === 'user_profile' ? 'users' : state.tab;
  return `<div class="border-t border-slate-200 bg-white"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex gap-1 overflow-x-auto">${act.tabs.map(x => `<button onclick="setTab('${x[0]}')" class="px-3 py-2 text-xs font-semibold whitespace-nowrap border-b-2 -mb-px ${x[0] === cur ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500 hover:text-slate-800'}">${x[1]}</button>`).join('')}</div></div>`;
}
function navGo(kind, sid) {
  const sec = navSections(kind).find(x => x.id === sid);
  if (!sec) return;
  const last = navLast[sid];
  setTab(last && sec.tabs.some(x => x[0] === last) ? last : sec.tabs[0][0]);
}

function setTab(tname) {
  state.tab = tname;
  ['admin', 'employee'].forEach(k => { const sec = navSections(k).find(x => x.tabs.some(y => y[0] === tname)); if (sec) navLast[sec.id] = tname; });
  bulkSelectedUserIds.clear();
  bulkShowOnlySelected = false;
  bulkUserCache.clear();
  usersFilterDropdownOpen = null;
  render();
}

// --- Вкладки внутри «Настроек» (чтобы всё не шло одной длинной страницей) ---
const SETTINGS_TABS = [
  { id: 'org', label: 'Организация', superOnly: true },
  { id: 'commission', label: 'Комиссия и подписи', superOnly: true },
  { id: 'numbering', label: 'Нумерация', superOnly: true },
  { id: 'card', label: 'Удостоверение', superOnly: true },
  { id: 'dicts', label: 'Объекты, отделы и должности' },
  { id: 'storage', label: 'Хранилище', superOnly: true }
];
function settingsTabBarHtml(isSuperadmin, active) {
  return SETTINGS_TABS.filter(t => !t.superOnly || isSuperadmin).map(t =>
    `<button type="button" data-stab-btn="${t.id}" onclick="showSettingsTab('${t.id}')" class="px-3 py-2 text-sm font-semibold -mb-px border-b-2 ${t.id === active ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500 hover:text-slate-800'}">${t.label}</button>`
  ).join('');
}
function showSettingsTab(name) {
  const isSuper = state.user && state.user.role === 'superadmin';
  if (!SETTINGS_TABS.some(t => t.id === name && (!t.superOnly || isSuper))) name = isSuper ? 'org' : 'dicts';
  state.settingsTab = name;
  document.querySelectorAll('[data-stab]').forEach(el => {
    el.classList.toggle('hidden', !el.getAttribute('data-stab').split(' ').includes(name));
  });
  document.querySelectorAll('[data-stab-btn]').forEach(b => {
    const on = b.getAttribute('data-stab-btn') === name;
    b.classList.toggle('border-blue-600', on);
    b.classList.toggle('text-blue-700', on);
    b.classList.toggle('border-transparent', !on);
    b.classList.toggle('text-slate-500', !on);
  });
}

// --- Запасное хранилище в Google Drive (вкладка «Настройки», только суперадмин) ---
function driveMsg(text, ok) {
  const el = document.getElementById('driveActionMsg');
  if (el) { el.className = 'text-xs mt-2 ' + (ok ? 'text-emerald-700' : 'text-red-600'); el.textContent = text; }
}
async function loadDriveStatus() {
  const box = document.getElementById('driveStatusBox');
  if (!box) return;
  try {
    const st = await api.req('/api/drive/status');
    if (!st.configured) {
      box.innerHTML = '<span class="text-amber-700">Не настроено: на сервере не заданы переменные GDRIVE_* (см. env.example). Пока они не заданы, сайт работает без облачной копии.</span>';
      const b = document.getElementById('driveExportBtn'); if (b) b.disabled = true;
      return;
    }
    const c = st.counts;
    let html = `Отправлено файлов: <b>${c.done}</b> · В очереди: <b>${c.pending}</b>` +
      (st.waiting_for_signature ? ` (из них ждут подписи председателя: ${st.waiting_for_signature})` : '') +
      ` · С ошибкой: <b class="${c.failed ? 'text-red-600' : ''}">${c.failed}</b>`;
    if (st.problems && st.problems.length) {
      html += '<ul class="mt-2 space-y-1 text-xs text-red-600">' +
        st.problems.slice(0, 5).map(p => `<li>#${p.id} (${esc(p.kind)}, попыток: ${p.attempts}): ${esc(p.last_error || '')}</li>`).join('') + '</ul>';
    }
    box.innerHTML = html;
    const rb = document.getElementById('driveRetryBtn'); if (rb) rb.classList.toggle('hidden', !c.failed);
  } catch (e) {
    box.textContent = 'Не удалось получить статус: ' + e.message;
  }
}
async function driveExportAll() {
  if (!confirm('Поставить в очередь все подписанные протоколы и все удостоверения, которых ещё нет в Google Drive? Уже отправленное повторно не загружается. Отправка идёт в фоне и может занять время.')) return;
  const btn = document.getElementById('driveExportBtn'); if (btn) btn.disabled = true;
  try {
    const r = await api.req('/api/drive/export-all', { method: 'POST', body: {} });
    driveMsg(`Принято в очередь: подписанных протоколов — ${r.protocols}, удостоверений — ${r.id_cards}. Новых задач: ${r.queued}. Обновите статус через минуту.`, true);
    setTimeout(loadDriveStatus, 3000);
  } catch (e) {
    driveMsg('Не удалось запустить выгрузку: ' + e.message, false);
  } finally {
    if (btn) btn.disabled = false;
  }
}
async function driveCheckAccess() {
  try {
    const r = await api.req('/api/drive/check', { method: 'POST', body: {} });
    driveMsg(`Подключение работает. Корневая папка: «${r.name}»${r.sharedDrive ? ' (Общий диск)' : ''}.`, true);
  } catch (e) {
    driveMsg('Нет доступа к Google Drive: ' + e.message, false);
  }
}
async function driveRetryFailed() {
  try {
    const r = await api.req('/api/drive/retry', { method: 'POST', body: {} });
    driveMsg(`Возвращено в очередь: ${r.requeued}.`, true);
    setTimeout(loadDriveStatus, 2000);
  } catch (e) {
    driveMsg('Не удалось: ' + e.message, false);
  }
}

          ${canEdit ? `<button type="button" onclick="removeDictionaryValueFromSettings('objects', '${jsAttrEsc(v)}')" class="shrink-0 px-1.5 text-red-400 hover:text-red-600 text-xs font-bold opacity-60 group-hover:opacity-100" title="Удалить объект">✕</button>` : ''}

      : `<div class="text-xs text-slate-400 px-1">Список пуст</div>`;
  }

  // Правая часть: отделы выбранного объекта — компактные карточки с «чипами» должностей
  const title = document.getElementById('orgStructTitle');

  const box = document.getElementById('orgStructBox');
  if (box) {

      box.innerHTML = `<div class="text-xs text-slate-400 lg:col-span-2">${state.orgStructObject ? 'В этом объекте пока нет отделов' : ''}</div>`;
    } else {
      box.innerHTML = obj.departments.map((dep, di) => {
        const linked = new Set(dep.positions);
        const available = d.positions.filter(p => !linked.has(p.ru));
        const chips = dep.positions.map((ru, pi) => {
          const kz = (d.positions.find(p => p.ru === ru) || {}).kz;
          return `<span class="inline-flex items-center gap-1 rounded-full bg-slate-100 border border-slate-200 ${canEdit ? 'pl-2.5 pr-1' : 'px-2.5'} py-0.5 text-xs text-slate-700" ${kz ? `title="${esc(kz)}"` : ''}>${esc(ru)}${canEdit ? `<button type="button" onclick="removeOrgPosition(${di}, ${pi})" class="text-slate-400 hover:text-red-600 font-bold leading-none px-0.5" title="Убрать из отдела">✕</button>` : ''}</span>`;

        return `

function renderPositionsCatalog() {

async function saveOrgDictionaries(next) {
  if (!isSuperadminUser()) return;
  try {
    setDictionaries(await api.saveDictionaries(next));
  } catch (e) {
    alert('Не удалось сохранить список: ' + (e.message || 'ошибка сервера'));
    await loadDictionaries(true);
  }
  renderOrgSettings();
}

function selectOrgStructObject(name) {
  state.orgStructObject = name;
  renderOrgSettings();
}

function addDictionaryValueFromSettings(kind) {
  const next = cloneDictionaries();
  if (kind === 'objects') {
    const input = document.getElementById('dictObjectsNew');
    const value = (input.value || '').trim();
    if (!value) return;
    if (!next.objects.includes(value)) next.objects.push(value);
    input.value = '';
    state.orgStructObject = value;
  } else {
    const ruInput = document.getElementById('dictPositionsNewRu');
    const kzInput = document.getElementById('dictPositionsNewKz');
    const ru = (ruInput.value || '').trim();
    const kz = (kzInput.value || '').trim();
    if (!ru) return;
    const idx = next.positions.findIndex(p => p.ru === ru);
    if (idx === -1) next.positions.push({ ru, kz });
    else next.positions[idx] = { ru, kz: kz || next.positions[idx].kz };
    ruInput.value = '';
    kzInput.value = '';
  }
  saveOrgDictionaries(next);
}

function removeDictionaryValueFromSettings(kind, value) {
  const next = cloneDictionaries();
  if (kind === 'objects') {
    if (!confirm(`Удалить объект «${value}» вместе с его отделами и закреплёнными должностями? У сотрудников записанные значения не изменятся.`)) return;
    next.objects = next.objects.filter(v => v !== value);
  } else {
    if (!confirm(`Удалить должность «${value}» из справочника и из всех отделов? У сотрудников записанные значения не изменятся.`)) return;
    next.positions = next.positions.filter(p => p.ru !== value);
  }
  saveOrgDictionaries(next);
}

function orgStructTarget(next) {
  return next.structure.find(o => o.object === state.orgStructObject);
}

function addOrgDepartment() {
  const input = document.getElementById('orgNewDept');
  const value = (input.value || '').trim();
  if (!value || !state.orgStructObject) return;
  const next = cloneDictionaries();
  const o = orgStructTarget(next);
  if (!o) return;
  if (!o.departments.some(d => d.name === value)) o.departments.push({ name: value, positions: [] });
  input.value = '';
  saveOrgDictionaries(next);
}

function removeOrgDepartment(di) {
  const next = cloneDictionaries();
  const o = orgStructTarget(next);
  const dep = o && o.departments[di];
  if (!dep) return;
  if (!confirm(`Убрать отдел «${dep.name}» из объекта «${o.object}»? У сотрудников записанные значения не изменятся.`)) return;
  o.departments.splice(di, 1);
  saveOrgDictionaries(next);
}

function addOrgPosition(di) {
  const sel = document.getElementById('orgAddPos_' + di);
  const ru = sel ? sel.value : '';
  if (!ru) return;
  const next = cloneDictionaries();
  const o = orgStructTarget(next);
  const dep = o && o.departments[di];
  if (!dep) return;
  if (!dep.positions.includes(ru)) dep.positions.push(ru);
  saveOrgDictionaries(next);
}

function removeOrgPosition(di, pi) {
  const next = cloneDictionaries();
  const o = orgStructTarget(next);
  const dep = o && o.departments[di];
  if (!dep) return;
  dep.positions.splice(pi, 1);
  saveOrgDictionaries(next);
}

function initSignatureCanvas() {
  const canvas = document.getElementById('sigCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  // Фон холста НЕ закрашиваем: белым он выглядит за счёт CSS (bg-white), а в сохранённой картинке
  // фон остаётся прозрачным — иначе в протоколе подпись шла с белым прямоугольником.
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  canvas.dataset.drawn = '0';
  let drawing = false;
  let last = null;
  function posFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }
  function start(e) {
    e.preventDefault();
    drawing = true;
    last = posFromEvent(e);
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = posFromEvent(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
    canvas.dataset.drawn = '1';
  }
  function end(e) { drawing = false; }
  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointerleave', end);
  canvas.addEventListener('pointercancel', end);
}

function clearSignatureCanvas() {
  const canvas = document.getElementById('sigCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  canvas.dataset.drawn = '0';
}

function showSigError(msg) {
  const el = document.getElementById('sigError');
  if (!el) return;
  if (!msg) { el.classList.add('hidden'); el.textContent = ''; return; }
  el.textContent = msg;
  el.classList.remove('hidden');
}

// PNG с прозрачным фоном, обрезанный по границам штриха (+небольшое поле): так подпись в протоколе
// ложится без белого прямоугольника и её размер не зависит от того, в каком месте поля расписались.
function signatureCanvasToTransparentPng(canvas) {
  try {
    const w = canvas.width, h = canvas.height;
    const data = canvas.getContext('2d').getImageData(0, 0, w, h).data;
    let minX = w, minY = h, maxX = -1, maxY = -1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (data[(y * w + x) * 4 + 3] > 10) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return canvas.toDataURL('image/png');
    const pad = 6;
    const sx = Math.max(0, minX - pad), sy = Math.max(0, minY - pad);
    const sw = Math.min(w, maxX + pad + 1) - sx, sh = Math.min(h, maxY + pad + 1) - sy;
    const out = document.createElement('canvas');
    out.width = sw; out.height = sh;
    out.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
    return out.toDataURL('image/png');
  } catch (e) {
    return canvas.toDataURL('image/png');
  }
}

async function saveSignatureCanvas() {
  const canvas = document.getElementById('sigCanvas');
  if (!canvas) return;
  showSigError('');
  if (canvas.dataset.drawn !== '1') {
    showSigError('Сначала распишитесь в поле выше.');
    return;
  }
  const passEl = document.getElementById('sigPassword');
  const password = passEl ? passEl.value : '';
  if (passEl && !password) {
    showSigError('Введите текущий пароль, чтобы обновить подпись.');
    return;
  }
  const dataUrl = signatureCanvasToTransparentPng(canvas);
  const btn = document.getElementById('sigSaveBtn');
  if (btn) btn.disabled = true;
  try {
    await api.saveMySignature(dataUrl, password || undefined);
    const fresh = await api.getMySignature();
    renderSignatureModal(fresh);
  } catch (e) {
    showSigError(e.message || 'Не удалось сохранить подпись');
    if (btn) btn.disabled = false;
  }
}

async function clearSavedSignature() {
  if (!confirm('Удалить сохранённую подпись? Подписывать протоколы будет нельзя, пока не сохраните новую.')) return;
  showSigError('');
  const passEl = document.getElementById('sigPassword');
  const password = passEl ? passEl.value : '';
  if (passEl && !password) {
    showSigError('Введите текущий пароль, чтобы удалить подпись.');
    return;
  }
  const btn = document.getElementById('sigClearBtn');
  if (btn) btn.disabled = true;
  try {
    await api.clearMySignature(password || undefined);
    const fresh = await api.getMySignature();
    renderSignatureModal(fresh);
  } catch (e) {
    showSigError(e.message || 'Не удалось удалить подпись');
    if (btn) btn.disabled = false;
  }
}

// Для набора курсов (Set id-строк): последний «сдал» по паре сотрудник+курс; считаем уникальных сотрудников
// с действующим обучением и с просрочкой (та же логика, что у верхних карточек главной).
function dashUniqueCounts(courseIds) {
  const now = new Date();
  const latest = new Map();
  (dashAssignData || []).forEach(x => {
    if (x.status !== 'passed' || !courseIds.has(String(x.course_id))) return;
    const k = `${x.user_id}:${x.course_id}`;
    const cur = latest.get(k);
    const tx = String(x.test_date || ''), tc = cur ? String(cur.test_date || '') : '';
    if (!cur || tx > tc || (tx === tc && Number(x.id) > Number(cur.id))) latest.set(k, x);
  });
  const valid = new Set(), overdue = new Set();
  latest.forEach(x => {
    const isOverdue = x.next_test_date && new Date(x.next_test_date) < now;
    (isOverdue ? overdue : valid).add(x.user_id);
  });
  return { valid: valid.size, overdue: overdue.size };
}
function dashGroupStats(key) {
  const courses = dashGroupCourses(key);
  const ids = new Set(courses.map(c => String(c.id)));
  let valid, overdue;
  if (dashAssignData) {
    ({ valid, overdue } = dashUniqueCounts(ids));
  } else { // назначения не загрузились — приблизительно по сумме курсов
    valid = courses.reduce((n, c) => n + (c.trained_employees || 0), 0);
    overdue = courses.reduce((n, c) => n + (c.overdue || 0), 0);
  }
  const missingMandatory = courses.some(c => c.is_mandatory && (c.untrained || 0) > 0);
  return { courses, valid, overdue, missingMandatory };
}

async function loadDashboardCourseStats() {
  const tabsDiv = document.getElementById('dashCourseTabs');
  const panelDiv = document.getElementById('dashCoursePanel');
  const mandCard = document.getElementById('dashMandatoryCard');
  if (!tabsDiv || !panelDiv) return;
  try {
    const [summary, assigns, allCourses, planned, _mb] = await Promise.all([
      api.getCourseStatsSummary(dashParams()),
      api.getAssignments({ ...dashParams(), active_only: 1 }).catch(() => null),
      api.getCourses().catch(() => null),
      api.req('/api/training-sessions?status=planned').catch(() => []),
      mbLoad()
    ]);
    dashPlanned = Array.isArray(planned) ? planned : [];
    dashCourseStats = summary.courses || [];
    dashAssignData = Array.isArray(assigns) ? assigns : null;
    // Дополняем статистику категорией и видом курса из списка курсов, если эндпоинт статистики их не вернул
    if (Array.isArray(allCourses)) {
      const byId = new Map(allCourses.map(x => [String(x.id), x]));
      dashCourseStats.forEach(c => {
        const x = byId.get(String(c.id));
        if (!x) return;
        if (!c.main_group && x.main_group) c.main_group = x.main_group;
        if (!c.course_kind && x.course_kind) c.course_kind = x.course_kind;
        if (c.is_external == null && x.is_external != null) c.is_external = x.is_external;
      });
    }

    if (mandCard) {
      const missing = summary.overall ? (summary.overall.employees_missing_mandatory || 0) : 0;
      const hasMandatory = dashCourseStats.some(c => c.is_mandatory);
      mandCard.classList.toggle('hidden', !hasMandatory);
      document.getElementById('dashMandatoryMissing').textContent = missing;
    }

    if (dashMainGroup !== 'medbook' && !DASH_GROUPS.some(g => g.key === dashMainGroup)) dashMainGroup = 'biot';
    ensureDashSelectedCourse();
    renderDashCourseTabs();
    renderDashCoursePanel();
    expScopeChanged();
  } catch (e) {
    tabsDiv.innerHTML = `<div class="text-red-600 text-sm">${t('error_generic')}</div>`;

}

// У каждого вида курсов своя система записи
//  biot     — наш курс с тестом: назначается тест → сдал → протокол;
//  internal — внутренний курс: группа обучения (заявка) → отметка присутствия → закрытие группы;
//  external — внешний курс: вносится прохождение с номером протокола внешней организации (или заранее группа).
function dashGroupMode(key) { return key === 'biot' ? 'test' : key === 'internal' ? 'session' : 'external'; }
function dashGroupHow(key) {
  return key === 'biot' ? _L('Запись: назначение теста → протокол', 'Жазылу: тест тағайындау → хаттама')
    : key === 'internal' ? _L('Запись: группа обучения → отметка присутствия', 'Жазылу: оқыту тобы → қатысуды белгілеу')
    : _L('Запись: внесение прохождения (протокол внешней организации)', 'Жазылу: өтуді енгізу (сыртқы ұйым хаттамасы)');
}
// Действующее обучение, которое истекает в ближайшие N дней (по последней записи «сдал» пары сотрудник+курс)
function dashSoonCount(courseIds, days) {
  const now = new Date(), limit = new Date(now.getTime() + days * 86400000);
  const latest = new Map();
  (dashAssignData || []).forEach(x => {
    if (x.status !== 'passed' || !courseIds.has(String(x.course_id))) return;
    const k = `${x.user_id}:${x.course_id}`, cur = latest.get(k);
    const tx = String(x.test_date || ''), tc = cur ? String(cur.test_date || '') : '';
    if (!cur || tx > tc || (tx === tc && Number(x.id) > Number(cur.id))) latest.set(k, x);
  });
  const people = new Set();
  latest.forEach(x => { if (x.next_test_date) { const d = new Date(x.next_test_date); if (d >= now && d <= limit) people.add(x.user_id); } });
  return people.size;
}
// Показатели дашборда — свои для каждого вида

  const mode = dashGroupMode(key);
  if (mode === 'test') {
    k.push({ label: _L('Ожидают теста', 'Тест күтеді'), value: uniq(x => x.status === 'pending' || x.status === 'in_progress'), cls: 'text-amber-600' });

  } else {
    k.push({ label: _L('Истекает ≤ 30 дн.', '≤ 30 күнде аяқталады'), value: dashSoonCount(ids, 30), cls: 'text-amber-600' });
    const pl = dashPlanned.filter(x => ids.has(String(x.course_id)));

  }
  return k;
}

    main = primary(`dashEnroll(${cid}, null)`, '📚 ' + _L('Назначить тест', 'Тест тағайындау'));
  } else if (mode === 'session') {
    main = primary(`dashEnroll(${cid}, null)`, '👥 ' + _L('Записать в группу обучения', 'Оқыту тобына жазу'))
      + secondary(`setTab('sessions')`, _L('Все группы обучения', 'Барлық оқыту топтары'));
  } else {
    main = primary(`dashRecordExternal(${cid})`, '➕ ' + _L('Внести прохождение (внешний протокол)', 'Өтуді енгізу (сыртқы хаттама)'))
      + secondary(`dashEnroll(${cid}, null, 'session')`, '👥 ' + _L('Записать в группу заранее', 'Топқа алдын ала жазу'));
  }
  return `<div class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap items-center gap-2">${main}${problem}</div>`;
}

// Записать сотрудников на курс прямо с главной (модалка назначения с предвыбранным курсом)
function dashAssignCourse(courseId) {
  if (!courseId) return;
  dashEnroll(courseId, null);
}

// Внешний курс: сразу внести пройденное обучение (модалка в режиме внешнего курса — номер протокола внешней организации и даты)
function dashRecordExternal(courseId) {
  openAssignModal(null, null, courseId ? Number(courseId) : null);
}

// Запись с главной = заявка в «Группах обучения» (статус «Запланирована»): записанные попадают в дашборд групп,
// все по умолчанию считаются присутствующими; не пришедшего убираете из заявки, затем одной кнопкой закрываете —
// прохождение вносится всем оставшимся. Если по курсу уже есть запланированная группа, предлагаем добавить в неё.
async function dashEnroll(courseId, userIds, forceMode) {
  // Система записи зависит от вида курсов (дашборда):
  //  БиОТ — назначение теста (сдал после теста, закрепляется протоколом);
  //  Внутренние — группа обучения (присутствие = пройдено);
  //  Внешние — внесение прохождения (кнопка «Внести прохождение») или заранее группа (forceMode = 'session').
  const cs = dashCourseStats.find(x => String(x.id) === String(courseId));
  const mode = forceMode || (cs ? dashGroupMode(dashCourseGroup(cs)) : dashGroupMode(dashMainGroup));
  if (mode === 'test') {
    openAssignModal(null, userIds && userIds.length ? userIds : null, courseId ? Number(courseId) : null);
    return;
  }
  if (!courseId) { dashCreateSession(null); return; }   // действие уровня дашборда: окно создания группы без предвыбранного курса
  if (mode === 'external' && !forceMode) {
    openAssignModal(null, userIds && userIds.length ? userIds : null, Number(courseId));
    return;
  }
  try {
    let session = null;
    const existing = dashPlanned.filter(x => String(x.course_id) === String(courseId));
    if (existing.length) {
      const e = existing[0];
      const label = `${e.planned_date ? sessFmtDate(e.planned_date) : _L('без даты', 'күні жоқ')}, ${e.members_count} ${_L('чел.', 'адам')}`;
      if (confirm(_L(`По этому курсу уже есть запланированная группа (${label}).\n\nОК — добавить сотрудников в неё.\nОтмена — создать новую группу.`, `Бұл курс бойынша жоспарланған топ бар (${label}).\n\nОК — қызметкерлерді соған қосу.\nБас тарту — жаңа топ құру.`))) session = e.id;
    }
    if (session) {
      if (userIds && userIds.length) await api.req(`/api/training-sessions/${session}/members`, { method: 'POST', body: { user_ids: userIds } });
    } else {
      const today = new Date();
      const iso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      const r = await api.req('/api/training-sessions', { method: 'POST', body: { course_id: Number(courseId), planned_date: iso, user_ids: userIds || [] } });
      session = r.id;
    }
    // Открываем карточку заявки: готовим состояние ДО переключения вкладки, чтобы не зависеть от порядка отрисовки
    sessionsState.detail = await api.req('/api/training-sessions/' + session);
    sessionsState.view = 'detail';
    sessionsState.selected = new Set();
    sessionsState.courses = null;
    setTab('sessions');
    if (!userIds || !userIds.length) {
      // список сотрудников выбирается прямо в заявке
      for (let i = 0; i < 40 && !document.getElementById('sessionsBody'); i++) await new Promise(r => setTimeout(r, 50));
      sessionsOpenPicker();
    }
  } catch (e) {
    alert(e && e.message ? e.message : t('error_generic'));
  }
}
function dashOpenSession(id) {
  api.req('/api/training-sessions/' + id).then(d => {
    sessionsState.detail = d; sessionsState.view = 'detail'; sessionsState.selected = new Set();
    setTab('sessions');
  }).catch(e => alert(e && e.message ? e.message : t('error_generic')));
}

// Сотрудники с просрочкой / ожидающие прохождения по одному курсу — из уже загруженных назначений
function dashCourseUserSets(courseId) {
  const overdue = new Set(), pending = new Set();
  const cid = String(courseId);
  const now = new Date();
  const latest = new Map();
  (dashAssignData || []).forEach(x => {
    if (String(x.course_id) !== cid) return;
    if (x.status === 'pending' || x.status === 'in_progress') pending.add(Number(x.user_id));
    if (x.status === 'passed') {
      const cur = latest.get(x.user_id);
      const tx = String(x.test_date || ''), tc = cur ? String(cur.test_date || '') : '';
      if (!cur || tx > tc || (tx === tc && Number(x.id) > Number(cur.id))) latest.set(x.user_id, x);
    }
  });
  latest.forEach((x, uid) => { if (x.next_test_date && new Date(x.next_test_date) < now) overdue.add(Number(uid)); });
  return { overdue, pending };
}

// «Записать всех, кто не прошёл / просрочен»: не проходивших курс (с учётом фильтра объект/отдел) + просроченных + ожидающих
async function dashAssignProblem(courseId) {
  const ids = new Set();
  try {
    const untrained = await api.getUntrainedEmployees(courseId, dashParams());
    (untrained || []).forEach(u => ids.add(Number(u.id)));
  } catch (e) {
    alert(e && e.message ? e.message : t('error_generic'));
    return;
  }
  const sets = dashCourseUserSets(courseId);
  sets.overdue.forEach(id => ids.add(id));
  sets.pending.forEach(id => ids.add(id));
  if (!ids.size) {
    alert(_L('Нет сотрудников, которых нужно записать: все прошли курс, просроченных нет.', 'Жазуды қажет ететін қызметкерлер жоқ: барлығы курстан өткен, мерзімі өткендер жоқ.'));
    return;
  }
  dashEnroll(courseId, [...ids]);
}

  setTab('sessions');
  setTimeout(() => sessionsOpenCreate(courseId || undefined), 80);

let expFilterTimeout = null;
function onExpFilterChange() {
  expState.q = document.getElementById('expQ').value;
  expState.status = document.getElementById('expStatus').value;
  expState.course = document.getElementById('expCourse').value;
  expState.sort = document.getElementById('expSort').value;
  clearTimeout(expFilterTimeout);
  expFilterTimeout = setTimeout(renderExpiringList, 120);
}

function onExpDaysChange() {
  expState.days = Number(document.getElementById('expDays').value) || 30;
  loadExpiringWidget();
}

function resetExpFilters() {
  Object.assign(expState, { q: '', course: '', status: 'overdue', sort: 'date_asc' });
  expShowOnlySelected = false;
  renderExpiringFilters();
  renderExpiringList();
}

function getExpiringFiltered() {
  const q = expState.q.trim().toLowerCase();
  const title = a => (CURRENT_LANG === 'kz' ? (a.title_kz || a.title_ru) : (a.title_ru || a.title_kz)) || '';
  const scopeIds = expScopeIds();
  const showSel = expShowOnlySelected && expSelected.size > 0;
  let list = expData.filter(a => {
    if (showSel) return expSelected.has(Number(a.user_id));   // «Показать выбранных» игнорирует статус/курс/поиск
    const dl = expDaysLeft(a);
    if (expState.status === 'overdue' && !(dl < 0)) return false;
    if (expState.status === 'soon' && dl < 0) return false;
    if (scopeIds && !scopeIds.has(String(a.course_id))) return false;
    if (['7', '14', '30'].includes(expState.status) && !(dl >= 0 && dl <= Number(expState.status))) return false;
    if (expState.course && title(a) !== expState.course) return false;
    if (q) {
      const hay = `${a.last_name} ${a.first_name} ${title(a)} ${a.object || ''} ${a.department || ''} ${a.position || ''} ${posLabel(a.position || '')}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const loc = CURRENT_LANG === 'kz' ? 'kk' : 'ru';
  const fio = a => `${a.last_name} ${a.first_name}`;
  const cmp = {
    date_asc: (a, b) => new Date(a.next_test_date) - new Date(b.next_test_date),
    date_desc: (a, b) => new Date(b.next_test_date) - new Date(a.next_test_date),
    name_asc: (a, b) => fio(a).localeCompare(fio(b), loc),
    name_desc: (a, b) => fio(b).localeCompare(fio(a), loc),
    course: (a, b) => title(a).localeCompare(title(b), loc) || fio(a).localeCompare(fio(b), loc),
    object: (a, b) => (a.object || '').localeCompare(b.object || '', loc) || fio(a).localeCompare(fio(b), loc)
  }[expState.sort] || (() => 0);
  return list.sort(cmp);
}

function renderExpiringList() {
  const div = document.getElementById('expiringList');
  if (!div) return;
  const list = getExpiringFiltered();
  const countEl = document.getElementById('expCount');
  if (countEl) countEl.textContent = `${_L('Показано', 'Көрсетілді')}: ${list.length} ${_L('из', '/')} ${expData.length}`;
  if (!expData.length) {
    div.innerHTML = `<div class="text-sm text-slate-500">${t('expiring_none')}</div>`;
    return;
  }
  if (!list.length) {
    div.innerHTML = `<div class="text-sm ${expState.status === 'overdue' && !expState.q && !expState.course ? 'text-emerald-600 font-semibold' : 'text-slate-500'}">${expState.status === 'overdue' && !expState.q && !expState.course ? '✓ ' + _L('Просроченных нет', 'Мерзімі өткендер жоқ') : _L('Ничего не найдено по выбранным фильтрам', 'Таңдалған сүзгілер бойынша ештеңе табылмады')}</div>`;
    return;
  }
  div.innerHTML = list.map(a => {
    const nextDate = new Date(a.next_test_date);
    const daysLeft = expDaysLeft(a);
    const overdue = daysLeft < 0;
    const today = daysLeft === 0;
    const col = catColorOf(catKeyOf(a));   // цвет курса = цвет его категории (как на вкладке «Курсы»)
    const badgeClass = overdue ? 'bg-red-100 text-red-800' : daysLeft <= 7 ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700';
    const badgeText = overdue ? `${Math.abs(daysLeft)} ${CURRENT_LANG === 'kz' ? 'күн' : 'дн.'} ${t('overdue')}` : today ? t('expires_today') : `${daysLeft} ${t('days_left')}`;
    return `

// Скачивает файл-уведомление (Сотрудник/Логин/Пароль + текст обращения) для выбранных
// сотрудников с истекающим/просроченным обучением (п.4 запроса). Если ни один не выбран —
// используются все, что сейчас видны в списке (с учётом фильтров).
async function downloadCredentialsNoticeFromExpiring() {
  const ids = expSelected.size ? [...expSelected] : [...new Set(getExpiringFiltered().map(a => Number(a.user_id)))];
  if (!ids.length) {
    alert(_L('Нет сотрудников для уведомления.', 'Хабарлау үшін қызметкер жоқ.'));
    return;
  }
  // Пароль сотрудника в файле всегда равен его логину (ничего отдельно не генерируется
  // и не «перевыпускается» — см. routes/export.js), поэтому дополнительный вопрос
  // про перевыпуск пароля больше не нужен.
  try {
    const res = await api.exportCredentialsNotice({ user_ids: ids });
    const blob = await res.blob();
    let name = 'credentials.xlsx';
    const m = (res.headers.get('content-disposition') || '').match(/filename\*=UTF-8''([^;]+)/i);
    if (m) { try { name = decodeURIComponent(m[1]); } catch (e) {} }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    // Сервер сообщает (в заголовке), у кого логин/пароль отсутствовали и были созданы заново —
    // показываем это администратору отдельным уведомлением после скачивания файла.
    const missingHeader = res.headers.get('x-credentials-missing');
    if (missingHeader) {
      try {
        const missing = JSON.parse(decodeURIComponent(escape(atob(missingHeader))));
        if (Array.isArray(missing) && missing.length) {
          alert(_L(
            `Файл скачан.\n\nУ ${missing.length} сотрудник(ов) логин/пароль не были указаны — созданы заново:\n${missing.join('\n')}`,
            `Файл жүктелді.\n\n${missing.length} қызметкерде логин/құпия сөз көрсетілмеген — қайта жасалды:\n${missing.join('\n')}`
          ));
        }
      } catch (e) { /* заголовок не критичен для скачивания */ }
    }
  } catch (e) {
    alert('Не удалось сформировать файл: ' + (e.message || 'ошибка сервера'));
  }
}

function exportExpiringCsv() {
  const list = getExpiringFiltered();
  const title = a => (CURRENT_LANG === 'kz' ? (a.title_kz || a.title_ru) : (a.title_ru || a.title_kz)) || '';
  const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const rows = [['ФИО', 'Курс', 'Объект', 'Отдел', 'Должность', 'Действителен до', 'Осталось дней']];
  list.forEach(a => rows.push([`${a.last_name} ${a.first_name}`, title(a), a.object, a.department, posLabel(a.position),
    new Date(a.next_test_date).toLocaleDateString('ru-RU'), expDaysLeft(a)]));
  const csv = '\uFEFF' + rows.map(r => r.map(q).join(';')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'expiring.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function handleImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await api.req('/api/users/import', { method: 'POST', body: fd });
    let msg = `Импортировано сотрудников: ${res.created}.`;
    if (res.historyCreated) msg += ` Внесено записей об обучении: ${res.historyCreated}.`;
    if (res.skipped) msg += ` Пропущено: ${res.skipped}.`;
    if (res.errors && res.errors.length) msg += '\n\n' + res.errors.slice(0, 20).join('\n');
    alert(msg);
  } catch (e) {
    alert('Ошибка импорта: ' + e.message);
  }
  input.value = '';
  loadUsersList();
}

    case 'user_updated':

        else if (v && 'from' in v) parts.push(`${esc(lbl)}: <span class="text-slate-400 line-through">${esc(v.from === '' ? '—' : v.from)}</span> → <b>${esc(v.to === '' ? '—' : v.to)}</b>`);
      });

    case 'employment_status_changed':
      parts.push(esc(statusLbl[d.status] || d.status || '') + (d.date ? ' · ' + esc(fmtDate(d.date)) + (d.date_end ? ' — ' + esc(fmtDate(d.date_end)) : '') : '') + (d.leave_reason ? ' · ' + esc(leaveReasonText({ leave_reason: d.leave_reason, leave_note: d.leave_note })) : ''));
      break;
    case 'rotation_set':

      break;
    case 'overtime_set':
      parts.push(d.from ? `${esc(fmtDate(d.from))} → ${esc(fmtDate(d.to))}` : 'овертайм снят');
      break;
    case 'rotations_imported':
      parts.push(`обновлено: ${esc(d.updated)}, без даты заезда: ${esc(d.empty)}${d.errors ? ', ошибок: ' + esc(d.errors) : ''}`);
      break;
    case 'users_imported':

}

let auditDebounce = null;
function onAuditFilterChange(debounced) {
  const apply = () => {
    const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    state.auditFilter = { actor_id: g('auditActor'), action: g('auditAction'), date_from: g('auditFrom'), date_to: g('auditTo'), q: g('auditQ').trim() };
    loadAudit(false);
  };
  clearTimeout(auditDebounce);
  if (debounced) auditDebounce = setTimeout(apply, 350); else apply();
}
function resetAuditFilter() {
  state.auditFilter = { actor_id: '', action: '', date_from: '', date_to: '', q: '' };
  const c = document.getElementById('tabContent');
  if (c) renderAuditTab(c);
}

async function loadAudit(append) {
  const tbody = document.getElementById('auditTable');
  if (!tbody) return;
  const f = state.auditFilter;
  const offset = append ? state.auditRows.length : 0;
  try {
    const res = await api.getAudit({ ...f, limit: AUDIT_PAGE, offset });
    state.auditRows = append ? state.auditRows.concat(res.rows) : res.rows;
    state.auditTotal = res.total;
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-600">${t('error_generic')}${e && e.message ? ': ' + esc(e.message) : ''}</td></tr>`;
    return;
  }
  if (!document.getElementById('auditTable')) return; // пользователь ушёл с вкладки
  tbody.innerHTML = state.auditRows.length
    ? state.auditRows.map(auditRowHtml).join('')
    : `<tr><td colspan="5" class="p-6 text-center text-slate-400">${_L('Записей пока нет', 'Жазбалар әзірге жоқ')}</td></tr>`;
  const cnt = document.getElementById('auditCount');
  if (cnt) cnt.textContent = `${_L('Показано', 'Көрсетілген')} ${state.auditRows.length} ${_L('из', '/')} ${state.auditTotal}`;
  const more = document.getElementById('auditMoreBtn');
  if (more) more.classList.toggle('hidden', state.auditRows.length >= state.auditTotal);
}

    const isAdminsTab = state.tab === 'admins';
    const isArchiveTab = state.tab === 'archive';
    users = await api.getUsers({
      q: state.usersFilter.q,
      ...(isAdminsTab ? { role: 'staff' } : orgParams()),
      status: isArchiveTab ? 'archive' : 'active',
      ...(state.usersFilter.positions.length ? { position: state.usersFilter.positions.join(',') } : {}),
      ...(!isAdminsTab && !isArchiveTab && state.usersFilter.rotation ? { rotation: state.usersFilter.rotation } : {}),
      ...(isArchiveTab && state.usersFilter.statuses.length ? { statuses: state.usersFilter.statuses.join(',') } : {})
    });
  } catch (e) {
    if (tbody) tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-600">${t('error_generic')}${e && e.message ? ': ' + esc(e.message) : ''}</td></tr>`;

  }
  state.users = users.filter(u => u.role !== "superadmin");

    state.users = [...bulkSelectedUserIds].map(id => bulkUserCache.get(id)).filter(Boolean)
      .sort((a, b) => String(a.last_name).localeCompare(String(b.last_name), 'ru'));

  if (!tbody) return;
  const isArchiveTab = state.tab === 'archive';

  const isObserver = isObserverUser();
  tbody.innerHTML = state.users.map(u => `

      <td class="px-4 py-3 font-medium text-slate-900">
        ${(u.role === 'admin' || u.role === 'assistant') ? `${esc(u.last_name)} ${esc(u.first_name)}` : `<button onclick="openUserProfile(${u.id})" class="hover:text-blue-600 hover:underline text-left">${esc(u.last_name)} ${esc(u.first_name)}</button>${u.staff_category === 'manager' ? `<span class="ml-1.5 align-middle text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700">${_L('Руководитель', 'Басшы')}</span>` : u.staff_category === 'specialist' ? `<span class="ml-1.5 align-middle text-[10px] font-bold px-1.5 py-0.5 rounded bg-teal-100 text-teal-700">${_L('Специалист', 'Маман')}</span>` : ''}`}
      </td>
      <td class="px-4 py-3 font-mono text-slate-600">${u.login ? esc(u.login) : '<span class="text-slate-400 italic font-sans">не назначен</span>'}</td>
      <td class="px-4 py-3 text-slate-600">${u.role === 'assistant' ? assistantZoneCellHtml(u) : `${esc(u.object || '—')} / ${esc(u.department || '—')}`}</td>

            : `<button onclick="openStatusModal(${u.id}, 'fired')" class="text-amber-700 hover:underline text-xs">${_L('Уволить', 'Жұмыстан босату')}</button>
               <button onclick="openStatusModal(${u.id}, 'maternity')" class="text-purple-700 hover:underline text-xs">${_L('В отпуск', 'Демалысқа')}</button>`) : ''}
        ` : isArchiveTab ? `
          <button onclick="openStatusModal(${u.id}, 'active')" class="text-emerald-700 hover:underline text-xs">${_L('Восстановить', 'Қалпына келтіру')}</button>

// ===================== ВАХТА: заезд / отъезд, «на вахте» / «дома» =====================
// Статус считает сервер по сегодняшней дате (routes/users.js: ROTATION_SELECT) — здесь только показ.
// Символы можно поменять в одном месте:
const ROT_ICON = { on_shift: '👷', home: '🏠' };
function rotStatusLabel(st) {
  return st === 'on_shift' ? _L('На вахте', 'Вахтада') : st === 'home' ? _L('Дома', 'Үйде') : _L('Не указано', 'Көрсетілмеген');
}
function rotBadgeClass(st) {
  return st === 'on_shift' ? 'bg-emerald-100 text-emerald-700' : 'bg-sky-100 text-sky-700';
}
// Короткая пометка: «осталось 5 дн.» / «заезд через 3 дн.»
function rotNoteText(u) {
  if (u.rotation_status === 'on_shift' && u.rotation_days_left != null) {
    return u.rotation_days_left === 0 ? _L('отъезд сегодня', 'бүгін кетеді') : `${_L('осталось', 'қалды')} ${u.rotation_days_left} ${_L('дн.', 'күн')}`;
  }
  if (u.rotation_status === 'home' && u.rotation_days_to_arrival != null) {
    return `${_L('заезд через', 'келуге')} ${u.rotation_days_to_arrival} ${_L('дн.', 'күн қалды')}`;
  }
  return '';
}
// Ячейка колонки «Вахта» в списке сотрудников (клик — открыть окно заезда/отъезда)
function rotationCellHtml(u) {
  if (u.role !== 'employee') return '';
  if (!u.rotation_arrival) {
    // Вахта по графику не указана; если сотрудник сейчас в овертайме — он всё равно «на вахте»
    const add = `<button onclick="openRotationModal(${u.id})" class="text-slate-400 hover:text-blue-600 hover:underline">＋ ${_L('Указать', 'Көрсету')}</button>`;
    return u.rotation_status === 'on_shift'
      ? `<span class="inline-block font-semibold px-2 py-0.5 rounded ${rotBadgeClass('on_shift')}">${ROT_ICON.on_shift} ${esc(rotStatusLabel('on_shift'))}</span><div class="text-[11px] text-slate-500 mt-0.5">${_L('овертайм', 'овертайм')} · ${add}</div>`
      : add;
  }
  const note = rotNoteText(u);
  return `<button onclick="openRotationModal(${u.id})" class="text-left hover:opacity-80" title="${_L('Изменить заезд / отъезд', 'Келу / кетуді өзгерту')}">
      <span class="inline-block font-semibold px-2 py-0.5 rounded ${rotBadgeClass(u.rotation_status)}">${ROT_ICON[u.rotation_status]} ${esc(rotStatusLabel(u.rotation_status))}</span>
      <div class="text-[11px] text-slate-500 mt-0.5 whitespace-nowrap">${_L('заезд', 'келу')} ${fmtDate(u.rotation_arrival)} · ${_L('отъезд', 'кету')} ${fmtDate(u.rotation_departure)}</div>
      ${note ? `<div class="text-[11px] text-slate-400">${esc(note)}</div>` : ''}
    </button>`;
}
// Блок «Вахта» в карточке сотрудника
function rotationProfileHtml(user) {
  if (!user || user.role !== 'employee') return '';
  const btn = `<button onclick="openRotationModal(${user.id})" class="text-blue-600 hover:underline font-semibold">${user.rotation_arrival ? _L('Изменить', 'Өзгерту') : '＋ ' + _L('Указать заезд / отъезд', 'Келу / кетуді көрсету')}</button>`;
  if (!user.rotation_arrival) {
    const otOn = user.rotation_status === 'on_shift' ? ` <span class="font-semibold px-2 py-0.5 rounded ${rotBadgeClass('on_shift')}">${ROT_ICON.on_shift} ${esc(rotStatusLabel('on_shift'))}</span>` : '';
    return `<p class="text-xs text-slate-400 mt-1">${_L('Вахта', 'Вахта')}: <span class="italic">${_L('не указана', 'көрсетілмеген')}</span>${otOn} · ${btn}</p>`;
  }
  const note = rotNoteText(user);
  return `<div class="text-xs text-slate-500 mt-2 flex flex-wrap items-center gap-x-2 gap-y-1">
      <span class="font-semibold px-2 py-0.5 rounded ${rotBadgeClass(user.rotation_status)}">${ROT_ICON[user.rotation_status]} ${esc(rotStatusLabel(user.rotation_status))}</span>
      <span>${_L('Заезд', 'Келу')}: <b class="text-slate-700">${fmtDate(user.rotation_arrival)}</b></span>
      <span>${_L('Срок', 'Мерзімі')}: <b class="text-slate-700">${user.rotation_days || '—'} ${_L('дн.', 'күн')}</b></span>
      <span>${_L('Отъезд', 'Кету')}: <b class="text-slate-700">${fmtDate(user.rotation_departure)}</b></span>
      ${note ? `<span class="text-slate-400">· ${esc(note)}</span>` : ''}
      <span>· ${btn}</span>
      <span>· <button data-name="${esc(user.last_name + ' ' + user.first_name)}" onclick="downloadRotationCalendar(${user.id}, this.dataset.name)" class="text-emerald-700 hover:underline font-semibold">📅 ${_L('Календарь на год (PDF)', 'Жылдық күнтізбе (PDF)')}</button></span>
    </div>`;
}
// ===================== ОВЕРТАЙМ: сотрудника оставили на вахте сверх графика (период «с … по», без часов) =====================
// Пока сегодняшняя дата внутри периода, сервер считает сотрудника «на вахте» (routes/users.js: OT_ON_SQL).
function overtimeRangeText(u) {

function rotAddDays(iso, n) {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function rotDiffDays(a, b) {
  return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000);
}

function closeRotationModal() {
  const m = document.getElementById('rotModal');
  if (m) m.remove();

function rotHighlightPreset() {
  const cur = Number((document.getElementById('rotDays') || {}).value);
  document.querySelectorAll('#rotModal [data-rot-preset]').forEach(b => {
    const on = Number(b.dataset.rotPreset) === cur;
    b.classList.toggle('bg-blue-600', on);
    b.classList.toggle('text-white', on);
    b.classList.toggle('border-blue-600', on);
  });
}
function rotPickDays(n) {
  document.getElementById('rotDays').value = n;
  rotRecalc('days');
}
// Отъезд = заезд + срок; если поправили отъезд руками — срок пересчитывается по нему
function rotRecalc(changed) {
  const a = document.getElementById('rotArrival').value;
  const dEl = document.getElementById('rotDays');
  const depEl = document.getElementById('rotDeparture');
  if (changed === 'departure') {
    if (a && depEl.value) dEl.value = Math.max(1, rotDiffDays(a, depEl.value));
  } else if (a && Number(dEl.value) >= 1) {
    depEl.value = rotAddDays(a, Number(dEl.value));
  }
  const restEl = document.getElementById('rotCalRest');
  if (restEl && restEl.dataset.touched !== '1' && Number(dEl.value) >= 1) restEl.value = dEl.value;
  rotHighlightPreset();
}
// Скачать PDF-календарь вахты на год. fromModal = true — берём даты из окна «Вахта» (можно ещё не сохранённые),
// иначе — сохранённую вахту сотрудника (дома между вахтами = срок вахты).
function downloadRotationCalendar(userId, name, fromModal) {
  const p = new URLSearchParams({ lang: CURRENT_LANG === 'kz' ? 'kz' : 'ru' });
  if (fromModal) {
    const arrival = (document.getElementById('rotArrival') || {}).value;
    const days = (document.getElementById('rotDays') || {}).value;
    const departure = (document.getElementById('rotDeparture') || {}).value;
    const rest = (document.getElementById('rotCalRest') || {}).value;
    const start = (document.getElementById('rotCalStart') || {}).value;
    if (!arrival) { alert(_L('Укажите дату заезда.', 'Келу күнін көрсетіңіз.')); return; }
    p.set('arrival', arrival);
    if (days) p.set('days', days);
    if (departure) p.set('departure', departure);
    if (rest) p.set('rest', rest);
    if (start) p.set('start', start);
  }
  const safe = String(name || userId).trim().replace(/[^\p{L}\p{N}]+/gu, '_');
  downloadAuthed('/api/users/' + userId + '/rotation-calendar.pdf?' + p.toString(), 'Вахта_' + safe + '.pdf');
}

    active: _L('Сотрудник вернётся в общий список «Сотрудники» и снова будет учитываться в статистике.', 'Қызметкер жалпы тізімге қайтады және қайта статистикаға кіреді.')
  };

  const dateInput = document.getElementById('statusDate');
  const endWrap = document.getElementById('statusDateEndWrap');
  const endInput = document.getElementById('statusDateEnd');
  const endLabel = document.getElementById('statusDateEndLabel');
  const isLeave = status === 'maternity';
  if (endWrap) endWrap.classList.toggle('hidden', !isLeave);
  if (endInput) { endInput.value = ''; endInput.required = isLeave; }
  const reasonWrap = document.getElementById('statusReasonWrap');
  if (reasonWrap) reasonWrap.classList.toggle('hidden', !isLeave);
  const reasonSel = document.getElementById('statusReason');
  if (reasonSel) reasonSel.value = '';
  const noteInp = document.getElementById('statusNote');

  onStatusReasonChange();
