<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(15,59,108,0.12);
    max-width: 480px; width: 100%; padding: 28px 24px; border-top: 6px solid #0f3b6c;
  }
  .status { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 12px; font-weight: 700; margin-bottom: 20px; }
  .status.valid { background: #e8f8ee; color: #0f7a3c; }
  .status.expired { background: #fff7e6; color: #b45309; }
  .status.revoked { background: #fdeaea; color: #b91c1c; }
  .status.notfound { background: #f1f5f9; color: #64748b; }
  .status .dot { width: 12px; height: 12px; border-radius: 999px; background: currentColor; flex-shrink: 0; }
  h1 { font-size: 15px; color: #0f3b6c; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #64748b; margin: 0 0 18px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #eef2f7; font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .row .label { color: #64748b; }
  .row .value { font-weight: 600; color: #1e293b; text-align: right; }
  .uid { font-family: monospace; font-size: 12px; color: #94a3b8; text-align: center; margin-top: 18px; }
  .loading { text-align: center; color: #94a3b8; padding: 30px 0; }
</style>
</head>
<body>
  <div class="card">
    <h1>Проверка документа о проверке знаний по БиОТ</h1>
    <p class="sub">Білімді тексеру куәлігі / Safety knowledge certificate</p>
    <div id="content" class="loading">Проверка... / Тексерілуде... / Checking...</div>
  </div>

<script>
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('ru-RU');
}

const STATUS_META = {
  VALID:   { cls: 'valid',   text: 'ДЕЙСТВИТЕЛЬНО / ЖАРАМДЫ / VALID' },
  EXPIRED: { cls: 'expired', text: 'СРОК ИСТЁК / МЕРЗІМІ АЯҚТАЛДЫ / EXPIRED' },
  REVOKED: { cls: 'revoked', text: 'АННУЛИРОВАНО / ЖОЙЫЛДЫ / REVOKED' }
};

async function run() {
  const uid = decodeURIComponent(location.pathname.split('/').pop());
  const content = document.getElementById('content');
  try {
    // Один и тот же QR-адрес обслуживает ДВА разных документа: сертификат
    // (/api/certificates/verify) и удостоверение (/api/id-cards/verify).
    // UID удостоверения начинается с UD-, сертификата — с BIOT-, поэтому сначала
    // спрашиваем подходящий сервис, а затем, на всякий случай, второй.
    const isCard = /^UD-/i.test(uid);
    const endpoints = isCard
      ? ['/api/id-cards/verify/', '/api/certificates/verify/']
      : ['/api/certificates/verify/', '/api/id-cards/verify/'];
    let data = { found: false };
    for (const ep of endpoints) {
      try {
        const r = await fetch(ep + encodeURIComponent(uid));
        const d = await r.json();
        if (d && d.found) { data = d; break; }
      } catch (err) { /* пробуем следующий сервис */ }
    }
    if (!data.found) {
      content.innerHTML = `
        <div class="status notfound"><span class="dot"></span>ДОКУМЕНТ НЕ НАЙДЕН / NOT FOUND</div>
        <div class="uid">${uid}</div>`;
      return;
    }
    const meta = STATUS_META[data.status] || STATUS_META.VALID;
    content.innerHTML = `
      <div class="status ${meta.cls}"><span class="dot"></span>${meta.text}</div>
      <div class="row"><span class="label">Тип документа</span><span class="value">${data.document_type === 'id_card' ? 'Удостоверение' : 'Сертификат'}</span></div>
      <div class="row"><span class="label">ФИО / Name</span><span class="value">${data.full_name || '—'}</span></div>
      <div class="row"><span class="label">Номер документа</span><span class="value">${data.certificate_number || '—'}</span></div>
      <div class="row"><span class="label">Курс / Course</span><span class="value">${data.course_title_ru || data.course_title_kz || '—'}</span></div>
      <div class="row"><span class="label">№ протокола</span><span class="value">${data.protocol_number || '—'}</span></div>
      <div class="row"><span class="label">Дата выдачи</span><span class="value">${fmtDate(data.issue_date)}</span></div>
      <div class="row"><span class="label">Действителен до</span><span class="value">${data.expiry_date ? fmtDate(data.expiry_date) : 'Бессрочно'}</span></div>
      <div class="uid">${data.certificate_uid || uid}</div>
    `;
  } catch (e) {
    content.innerHTML = `<div class="status notfound"><span class="dot"></span>ОШИБКА ПРОВЕРКИ / ERROR</div>`;
  }
}
run();
</script>
</body>
</html>
